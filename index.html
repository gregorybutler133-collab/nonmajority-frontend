<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nonmajority">
<meta name="theme-color" content="#F1EDE6">
<title>Nonmajority</title>
<style>
:root{
  /* warm ivory ground */
  --bg:#F1EDE6;
  --bg-2:#E8E3DA;
  --surface:#FAF8F4;
  --surface-2:#F0ECE3;
  --line:#DAD3C6;
  --line-soft:#E6E1D6;
  --ink:#282521;
  --ink-2:#5A544B;
  --ink-3:#8B8377;
  --brand:#5E7060;
  --brand-ink:#F7F5F0;
  --hot:#B06A5B;
  --high:#C09155;
  --med:#A79E68;
  --low:#9B9287;
  --good:#6C8C70;
  --bad:#AB564D;
  /* data visualisation — earth tones only */
  --c1:#7C93A8;
  --c2:#6E8F72;
  --c3:#C9A96A;
  --c4:#A79CB8;
  --c5:#C08D74;
  --c6:#A89F92;
  --c7:#8FA6A0;
  --focus:#7C93A8;
  --acc-mint:#6C8C70;
  --acc-lime:#8A9A63;
  --acc-amber:#C09155;
  --acc-sky:#7C93A8;
  --acc-violet:#A79CB8;
  --acc-coral:#C08D74;
  --hl-lime:rgba(138,154,99,.24);
  --hl-mint:rgba(108,140,112,.22);
  --hl-amber:rgba(192,145,85,.24);
  /* precision hardware: tight radii, not SaaS pills */
  --r-s:3px;--r-m:6px;--r-l:10px;
  --tap:52px;
  --shadow:0 1px 2px rgba(40,37,33,.04),0 8px 24px -14px rgba(40,37,33,.18);
  --shadow-in:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(40,37,33,.04);
  --safe-b:env(safe-area-inset-bottom,0px);
  /* woven terrain */
  --mtn-a:#84806F;--mtn-b:#F0E9DE;--mtn-c:#C9B2C4;--mtn-snow:#FFFFFF;
  /* pastel sky: warm peach at the top, cream at the horizon */
  --mtn-sky:#EFE5D9;--mtn-sky2:#F4DDCD;--mtn-sky-low:#E6DBCD;
  /* depth ramp: sage in the foreground, mauve on the far peaks */
  --mtn-d1:#AAB09A;--mtn-d2:#B3B7A0;--mtn-d3:#C6BFAC;--mtn-d4:#B9A6BA;--mtn-d5:#CCBCCE;
  --mtn-hi:#F3EEF1;
  /* pastel scale used across the interface */
  --p1:#8FAE93;--p2:#B7C39A;--p3:#E0CBA4;--p4:#E3AFA5;--p5:#C2AFD6;--p6:#AEC8DC;
  --p1-soft:#E4EDE5;--p2-soft:#EDF0E2;--p3-soft:#F6EEDF;--p4-soft:#F8E7E3;--p5-soft:#EFE9F6;--p6-soft:#E6EFF6;
  --topo:none;
}
html[data-theme="dark"]{
  --bg:#1C1A17;
  --bg-2:#232019;
  --surface:#26231D;
  --surface-2:#2E2A23;
  --line:#3A352C;
  --line-soft:#302C25;
  --ink:#F0EBE1;
  --ink-2:#B6AE9F;
  --ink-3:#847C6F;
  --brand:#89A085;
  --brand-ink:#1C1A17;
  --hot:#C8836F;
  --high:#D2A468;
  --med:#B9AE76;
  --low:#847C6F;
  --good:#87A88A;
  --bad:#C46E63;
  --c1:#93A9BC;--c2:#87A88A;--c3:#D2BA82;--c4:#B7ADC6;--c5:#CFA189;--c6:#A79E92;--c7:#9DB2AC;
  --focus:#93A9BC;
  --acc-mint:#87A88A;--acc-lime:#A2B27B;--acc-amber:#D2A468;
  --acc-sky:#93A9BC;--acc-violet:#B7ADC6;--acc-coral:#CFA189;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6);
  --shadow-in:inset 0 1px 0 rgba(255,255,255,.04),inset 0 -1px 0 rgba(0,0,0,.2);
  --mtn-a:#14120F;--mtn-b:#9A8F7C;--mtn-c:#6E5F70;--mtn-snow:#EFE9DE;
  --mtn-sky:#1C1A17;--mtn-sky2:#2A2019;--mtn-sky-low:#151310;
  --mtn-d1:#5B6A55;--mtn-d2:#636B54;--mtn-d3:#6B6455;--mtn-d4:#5E4F60;--mtn-d5:#6C5C70;
  --mtn-hi:#CFC6CC;
  --p1:#7E9C84;--p2:#9AAA80;--p3:#C2AC85;--p4:#C79188;--p5:#A493BC;--p6:#8FAAC2;
  --p1-soft:#2A332C;--p2-soft:#2F3329;--p3-soft:#353026;--p4-soft:#352A28;--p5-soft:#2E2A35;--p6-soft:#272F35;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
  overflow-x:hidden;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,select,textarea{-webkit-appearance:none;appearance:none}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
::selection{background:var(--brand);color:#fff}

/* ---------- SPLASH ---------- */
#splash{
  position:fixed;inset:0;z-index:900;background:var(--mtn-sky);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .7s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splashCv{position:absolute;inset:0;width:100%;height:100%;
  opacity:0;transform:translateY(3.2%) scale(1.02);
  transition:opacity 1.15s ease,transform 1.5s cubic-bezier(.2,.85,.3,1)}
#splashCv.in{opacity:1;transform:none}

/* ---------- GLOBAL TERRAIN BACKDROP ---------- */
/* One still frame of the same range, anchored to the bottom of the
   viewport on every screen. Rendered once, not per frame, so it costs
   nothing while you work. */
#terrainBg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:0;transition:opacity 1.4s ease;
}
#terrainBg.in{opacity:1}
#terrainBg canvas{position:absolute;inset:0;width:100%;height:100%}
#terrainBg .veil{
  position:absolute;inset:0;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 34%,
    color-mix(in srgb,var(--bg) 86%,transparent) 58%,
    color-mix(in srgb,var(--bg) 72%,transparent) 100%);
}
html[data-theme="dark"] #terrainBg .veil{
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 34%,
    color-mix(in srgb,var(--bg) 88%,transparent) 58%,
    color-mix(in srgb,var(--bg) 78%,transparent) 100%);
}
.app{position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){
  #splashCv{transition:none;opacity:1;transform:none}
  #terrainBg{transition:none}
}
#splash .mark{
  position:relative;text-align:center;pointer-events:none;
  transform:translateY(-6%);
}
#splash .mark .wm{font-size:clamp(30px,8.4vw,74px);font-weight:850;letter-spacing:-.02em;line-height:1}
#splash .mark .tag{
  margin-top:14px;font-size:clamp(10px,2.3vw,13px);font-weight:650;
  letter-spacing:.42em;color:var(--ink-2);text-indent:.42em;
}
#splash .skip{
  position:absolute;bottom:calc(26px + var(--safe-b));left:50%;transform:translateX(-50%);
  font-size:12.5px;color:var(--ink-3);font-weight:650;padding:12px 20px;
}

/* ---------- SHELL ---------- */
.app{display:flex;min-height:100vh;min-height:100dvh}
.rail{
  display:none;width:230px;flex:0 0 230px;background:var(--bg-2);
  border-right:1px solid var(--line-soft);padding:20px 12px;
  position:sticky;top:0;height:100vh;height:100dvh;flex-direction:column;gap:2px;overflow-y:auto;
}
.brand{padding:0 10px 18px;display:flex;flex-direction:column;gap:1px}
.brand b{font-size:17px;letter-spacing:.02em;font-weight:850}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.16em;font-weight:650}
.rail button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r-m);
  color:var(--ink-2);font-weight:650;font-size:14.5px;min-height:46px;width:100%;text-align:left}
.rail button:hover{background:var(--surface)}
.rail button.on{background:var(--brand);color:var(--brand-ink)}
.rail .ico{width:19px;text-align:center;font-size:16px}
.rail .spacer{flex:1;min-height:10px}

main{flex:1;min-width:0;padding:0 0 calc(100px + var(--safe-b))}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

.topbar{position:sticky;top:0;z-index:60;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft)}
.topbar .row{max-width:1240px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:10px;min-height:62px}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0}
.topbar .sub{display:block;font-size:12px;color:var(--ink-3);font-weight:550;letter-spacing:0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--bg-2);
  background:color-mix(in srgb,var(--bg-2) 95%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;overflow-x:auto;
  padding:5px 4px calc(5px + var(--safe-b));scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:7px 3px;color:var(--ink-3);font-size:9.8px;font-weight:700;border-radius:var(--r-s);
  min-height:48px;justify-content:center;letter-spacing:.02em}
.tabs button .ico{font-size:14px;line-height:1;opacity:.7}
.tabs button.on{color:var(--brand)}
@media(min-width:1040px){.rail{display:flex}.tabs{display:none}main{padding-bottom:40px}}

/* ---------- PRIMITIVES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
  min-height:var(--tap);padding:0 20px;border-radius:var(--r-m);font-weight:700;font-size:15.5px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.42;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l);padding:18px}
.card+.card{margin-top:14px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:var(--tap);padding:13px 14px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:12px;font-size:16px}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.grid2{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:660px){.grid2{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;
  font-size:13.5px;font-weight:650;background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink-2);min-height:40px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  font-size:12px;font-weight:750;letter-spacing:.2px;background:var(--surface-2);color:var(--ink-2)}
.pill.hot{background:color-mix(in srgb,var(--hot) 22%,transparent);color:var(--hot)}
.pill.high{background:color-mix(in srgb,var(--high) 22%,transparent);color:var(--high)}
.pill.med{background:color-mix(in srgb,var(--med) 22%,transparent);color:var(--med)}
.pill.low{background:color-mix(in srgb,var(--low) 24%,transparent);color:var(--ink-2)}
.pill.good{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.pill.flat{background:var(--surface-2);color:var(--ink-2)}
.empty{text-align:center;padding:48px 22px;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r-l)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-weight:750}
.empty .btn{margin-top:16px}
.sect-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sect-h h2{font-size:15px;font-weight:750}
.sect-h .n{color:var(--ink-3);font-size:13.5px;font-weight:600}
.hint{font-size:13px;color:var(--ink-3);line-height:1.55;margin-top:8px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- DASHBOARD (analytics board) ---------- */
.mtnhead{position:relative;height:240px;overflow:hidden;border-bottom:1px solid var(--line-soft);background:var(--mtn-sky)}
.mtnhead canvas{position:absolute;inset:0;width:100%;height:100%}
.mtnhead .ov{position:absolute;left:0;right:0;bottom:16px;text-align:center;pointer-events:none}
.mtnhead .ov .wm{font-size:clamp(24px,5.4vw,44px);font-weight:850;letter-spacing:-.015em;line-height:1}
.mtnhead .ov .tag{font-size:10.5px;letter-spacing:.4em;text-indent:.4em;color:var(--ink-2);font-weight:700;margin-top:7px}
@media(min-width:1040px){.mtnhead{height:300px}}

.board{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--r-l);overflow:hidden;margin-top:16px}
@media(min-width:760px){.board{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.board{grid-template-columns:1.35fr 1fr 1.15fr}}
.panel{background:var(--bg-2);padding:16px 16px 18px;min-height:250px;display:flex;flex-direction:column}
.panel .dt{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.panel .ttl{text-align:center;font-size:12.5px;font-weight:800;letter-spacing:.09em;margin-top:2px}
.panel .big{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:12px 0 4px}
.panel .big b{font-size:40px;font-weight:830;letter-spacing:-1.6px;line-height:.92}
.panel .big .delta{font-size:11.5px;font-weight:750;padding-bottom:5px;line-height:1.25}
.panel .big .delta i{font-style:normal;display:block;color:var(--ink-3);font-weight:600;font-size:10.5px}
.up{color:var(--good)}.down{color:var(--bad)}.flatd{color:var(--ink-3)}
.panel .chart{flex:1;min-height:150px;margin-top:6px}
.panel svg{width:100%;height:100%;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-3);font-weight:600}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.mtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
.mtable th{text-align:left;font-size:10px;color:var(--ink-3);font-weight:650;padding:6px 4px;border-bottom:1px solid var(--line-soft);letter-spacing:.04em}
.mtable th:last-child,.mtable td:last-child{text-align:right}
.mtable td{padding:11px 4px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);font-weight:600;vertical-align:middle}
.mtable td.val{text-align:right}
.mtable .num{display:inline-block;background:var(--surface-2);padding:5px 9px;border-radius:5px;
  font-weight:800;color:var(--ink);font-size:14px;letter-spacing:-.2px}
.mtable tr:last-child td{border-bottom:0}
.panel .nodata{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--ink-3);font-size:12.5px;line-height:1.6;padding:16px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);
  padding:14px 13px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:84px;justify-content:center}
.stat b{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat span{font-size:11.5px;color:var(--ink-3);font-weight:650}
.stat.accent b{color:var(--hot)}
.stat.money b{color:var(--good);font-size:22px}

/* ---------- LEADS ---------- */
.search{display:flex;gap:10px;align-items:center;margin-top:14px}
.search input{flex:1;min-height:var(--tap);padding:13px 16px;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.filterbar{margin-top:12px;display:none}
.filterbar.open{display:block}
.filterbar .field{margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.lead{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-soft);
  border-left:4px solid var(--low);border-radius:var(--r-m);padding:14px 15px;transition:transform .12s ease}
.lead:active{transform:scale(.99)}
.lead.t-hot{border-left-color:var(--hot)}
.lead.t-high{border-left-color:var(--high)}
.lead.t-med{border-left-color:var(--med)}
.lead .l1{display:flex;align-items:center;gap:10px}
.lead .nm{font-size:17px;font-weight:750;letter-spacing:-.2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .sc{font-size:20px;font-weight:820;letter-spacing:-.5px}
.lead .l2{font-size:13.5px;color:var(--ink-3);margin-top:3px;font-weight:550}
.lead .l3{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ---------- SHEET ---------- */
.sheet{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.sheet.open{display:block}
.sheet .sheet-top{position:sticky;top:0;z-index:5;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:60px}
.sheet .sheet-top .btn{min-height:44px;padding:0 14px;font-size:14.5px}
.sheet .sheet-body{max-width:900px;margin:0 auto;padding:16px 16px calc(120px + var(--safe-b))}
.hero-head h2{font-size:27px;font-weight:820;letter-spacing:-.7px;line-height:1.15}
.hero-head .meta{color:var(--ink-3);font-size:14.5px;margin-top:5px;font-weight:550}
.scorebox{display:flex;align-items:center;gap:16px;margin-top:16px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r-l);padding:16px 18px}
.scorebox .big{font-size:46px;font-weight:850;letter-spacing:-2px;line-height:.95}
.scorebox .rt{flex:1}
.scorebox .bar{height:8px;background:var(--bg-2);border-radius:999px;overflow:hidden;margin-top:9px}
.scorebox .bar i{display:block;height:100%;border-radius:999px}
.kv .r{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.kv .r:last-child{border-bottom:0}
.kv .k{width:104px;flex:0 0 104px;color:var(--ink-3);font-size:13px;font-weight:650;padding-top:2px}
.kv .v{flex:1;min-width:0;font-size:15px;font-weight:600;word-break:break-word}
.kv .v.dim,.kv .v .dim{color:var(--ink-3);font-weight:500}
.callbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.reasons{list-style:none;padding:0;margin:0}
.reasons li{display:flex;gap:9px;padding:7px 0;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.reasons li b{color:var(--good);flex:0 0 auto}
.reasons li.neg b{color:var(--high)}
.ammo{list-style:none;padding:0;margin:0}
.ammo li{position:relative;padding:12px 0 12px 30px;font-size:15px;line-height:1.5;border-bottom:1px solid var(--line-soft);color:var(--ink)}
.ammo li:last-child{border-bottom:0}
.ammo li:before{content:"";position:absolute;left:8px;top:19px;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.aigrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:660px){.aigrid{grid-template-columns:repeat(3,1fr)}}
.aigrid .btn{min-height:60px;font-size:14px;flex-direction:column;gap:3px;padding:0 8px;line-height:1.2;text-align:center}
.aigrid .btn .ico{font-size:19px}
.out{margin-top:14px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.out .oh{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.out .oh b{flex:1;font-size:13px;color:var(--ink-3);font-weight:750;min-width:120px}
.out textarea{width:100%;background:transparent;border:0;color:var(--ink);font-size:15px;line-height:1.6;min-height:210px;resize:vertical}
.notes{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.note{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 13px}
.note .t{font-size:11.5px;color:var(--ink-3);font-weight:650;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.note .t button{margin-left:auto;color:var(--ink-3);font-size:15px;line-height:1}
.note p{font-size:15px;line-height:1.5}

/* ---------- PIPELINE ---------- */
.pipe{display:flex;gap:12px;overflow-x:auto;padding:16px 16px 20px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.col{flex:0 0 264px;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:12px;scroll-snap-align:start}
.col h3{font-size:12.5px;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.col h3 i{font-style:normal;background:var(--surface-2);padding:2px 8px;border-radius:999px;font-size:11.5px;color:var(--ink-3)}
.pcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.pcard .pn{font-size:14.5px;font-weight:750;margin-bottom:2px}
.pcard .pm{font-size:12px;color:var(--ink-3);font-weight:550}
.pcard .pr{display:flex;gap:6px;margin-top:9px}
.pcard .pr button{flex:1;min-height:38px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:750;color:var(--ink-2)}
.pcard .pr button.open{flex:2;color:var(--brand)}

/* ---------- FOLLOW-UPS ---------- */
.fu{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:15px;margin-bottom:11px;border-left:4px solid var(--brand)}
.fu.over{border-left-color:var(--bad)}
.fu.today{border-left-color:var(--high)}
.fu h4{font-size:17px;font-weight:750;letter-spacing:-.2px}
.fu .when{font-size:12.5px;font-weight:700;margin-top:3px}
.fu .lastnote{font-size:14px;color:var(--ink-2);margin-top:9px;background:var(--bg-2);padding:9px 11px;border-radius:10px;line-height:1.45}
.fu .acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.fu .acts .btn{min-height:44px;font-size:13.5px;padding:0 6px}

/* ---------- CHAT ---------- */
.chat{display:flex;flex-direction:column;height:calc(100dvh - 62px - 92px - var(--safe-b));max-width:840px;margin:0 auto}
@media(min-width:1040px){.chat{height:calc(100dvh - 62px - 40px)}}
.chatlog{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:13px 15px;border-radius:16px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px;font-weight:550}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line-soft);border-bottom-left-radius:5px}
.msg .cp{display:block;margin-top:9px;font-size:11.5px;font-weight:750;color:var(--ink-3)}
.chatbar{display:flex;gap:9px;padding:10px 16px 12px;border-top:1px solid var(--line-soft);background:var(--bg)}
.chatbar textarea{flex:1;min-height:52px;max-height:150px;padding:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-m);font-size:16px;resize:none;line-height:1.4}
.chatbar .btn{min-height:52px;padding:0 18px}
.chatstart{padding:24px 16px;text-align:center}
.chatstart .wmini{font-size:22px;font-weight:850;letter-spacing:-.4px;margin-bottom:6px}
.chatstart p{color:var(--ink-3);font-size:14px;max-width:420px;margin:0 auto 18px;line-height:1.55}
.sugg{display:grid;gap:9px;grid-template-columns:1fr;max-width:520px;margin:0 auto}
@media(min-width:620px){.sugg{grid-template-columns:1fr 1fr}}
.sugg button{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:13px 14px;text-align:left;font-size:13.5px;color:var(--ink-2);line-height:1.45;min-height:56px}

/* ---------- MODAL / TOAST ---------- */
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .scrim{position:absolute;inset:0;background:rgba(15,3,8,.76)}
.modal .box{position:relative;width:100%;max-width:660px;max-height:92vh;max-height:92dvh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l) var(--r-l) 0 0;
  padding:20px 18px calc(24px + var(--safe-b));box-shadow:var(--shadow)}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:var(--r-l);max-height:88vh;max-height:88dvh}}
.modal h3{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.modal .lede{color:var(--ink-3);font-size:14px;margin-bottom:18px;line-height:1.5}
.modal .foot{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:0;background:var(--surface);padding-top:12px}
.modal .foot .btn{flex:1}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(90px + var(--safe-b));z-index:400;
  background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:999px;font-weight:750;font-size:14.5px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:1040px){.toast{bottom:28px}}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0 0}
.steps li{counter-increment:s;position:relative;padding:10px 0 10px 34px;font-size:14.5px;color:var(--ink-2);line-height:1.5;border-bottom:1px solid var(--line-soft)}
.steps li:last-child{border-bottom:0}
.steps li:before{content:counter(s);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:7px;background:var(--surface-2);color:var(--ink);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--ink)}
.warnbox{background:color-mix(in srgb,var(--high) 13%,transparent);border:1px solid color-mix(in srgb,var(--high) 34%,transparent);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:12px}
.okdot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);display:inline-block}
.okdot.ok{background:var(--good)}
.okdot.no{background:var(--bad)}
.twocol{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.twocol{grid-template-columns:1fr 1fr}}
.promptbox{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-m);padding:15px;display:flex;flex-direction:column}
.promptbox h4{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink-2);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.promptbox h4 .btn{margin-left:auto}
.promptbox textarea{flex:1;width:100%;background:transparent;border:0;color:var(--ink);font-size:13.5px;line-height:1.6;min-height:300px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- REBUTTAL DECK ---------- */
.rebbar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.rebnav{display:flex;align-items:center;gap:10px;margin-top:14px}
.rebnav .btn{flex:1;min-height:46px}
.rebcount{font-size:12.5px;color:var(--ink-3);font-weight:700;min-width:56px;text-align:center}
.rebrail{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.rebrail::-webkit-scrollbar{display:none}
.rebtab{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--ink-3);font-size:12.5px;font-weight:700;
  white-space:nowrap;min-height:40px;scroll-snap-align:center}
.rebtab.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.rebcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l);
  padding:18px 0 16px;margin-top:8px}
.rebcard .rebtrg{font-size:13.5px;color:var(--c3);font-weight:650;line-height:1.5;padding:0 18px}
.rebcard h2{font-size:24px;font-weight:820;letter-spacing:-.5px;padding:6px 18px 0;line-height:1.15}
.rebscroll{display:flex;gap:12px;overflow-x:auto;padding:16px 18px 8px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rebscroll::-webkit-scrollbar{display:none}
.rebblk{flex:0 0 min(84%,380px);scroll-snap-align:start;background:var(--bg-2);
  border:1px solid var(--line);border-radius:var(--r-m);padding:15px;position:relative;display:flex;flex-direction:column}
.rebblk .lbl{font-size:10.5px;font-weight:800;letter-spacing:.11em;color:var(--brand);
  text-transform:uppercase;margin-bottom:9px}
.rebblk p{font-size:16.5px;line-height:1.62;white-space:pre-wrap;flex:1}
.rebblk .cpy{margin-top:12px;align-self:flex-start;font-size:11.5px;font-weight:750;color:var(--ink-3);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:36px}
.rebfoot{display:flex;gap:8px;padding:6px 18px 0;flex-wrap:wrap}
.reblist{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.rebmini{text-align:left;background:var(--surface);border:1px solid var(--line-soft);
  border-left:3px solid var(--brand);border-radius:var(--r-m);padding:13px 15px}
.rebmini b{display:block;font-size:16px;font-weight:750}
.rebmini span{display:block;font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.45}
@media(min-width:900px){.rebblk{flex:0 0 340px}}

/* ---------- CALL COACH ---------- */
.reccol{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media(min-width:620px){.reccol{grid-template-columns:1.4fr 1fr}}
.recbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;
  border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);
  font-weight:750;font-size:15.5px;color:var(--ink)}
.recbtn .dot{width:12px;height:12px;border-radius:50%;background:var(--bad)}
.recbtn.live{background:color-mix(in srgb,var(--bad) 18%,transparent);border-color:var(--bad)}
.recbtn.live .dot{animation:pulse 1.1s ease-in-out infinite}
.recbtn em{font-style:normal;color:var(--ink-3);font-size:13px;font-weight:700}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.filechip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px}
.filechip span{flex:1;min-width:120px;font-size:13.5px;color:var(--ink-2);font-weight:600;word-break:break-all}

/* ---------- REBUTTAL DECK ---------- */
.rdeck{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:14px 16px 18px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rdeck::-webkit-scrollbar{display:none}
.rcard{flex:0 0 min(92vw,560px);scroll-snap-align:center;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-l);padding:20px 20px 18px;
  display:flex;flex-direction:column;max-height:none}
@media(min-width:1040px){.rcard{flex:0 0 min(46vw,520px)}}
.rcard h3{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.25;color:var(--brand)}
.rnote{font-size:12.5px;color:var(--ink-3);font-weight:650;margin-top:7px;font-style:italic}
.rsay{margin-top:15px;background:var(--bg-2);border:1px solid var(--line-soft);
  border-left:3px solid var(--brand);border-radius:12px;padding:14px 15px}
.rsay p{font-size:17px;line-height:1.62;white-space:pre-wrap;font-weight:520}
.rbr{margin-top:11px;background:var(--bg-2);border:1px solid var(--line-soft);
  border-left:3px solid var(--c1);border-radius:12px;padding:12px 15px}
.rbr p{font-size:15.5px;line-height:1.6;white-space:pre-wrap;color:var(--ink-2)}
.lbl{display:block;font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--ink-3);margin-bottom:6px}
.rcopy{margin-top:15px;align-self:flex-start}
.rnav{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:2px}
.rnav span{font-size:13px;font-weight:750;color:var(--ink-3);min-width:64px;text-align:center}
.rnav .btn{min-width:110px}

/* ---------- CALENDAR ---------- */
.calbar{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.calbar b{font-size:17px;font-weight:800;letter-spacing:-.3px;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.cdow{text-align:center;font-size:10.5px;font-weight:800;color:var(--ink-3);padding:4px 0;letter-spacing:.06em}
.cpad{min-height:56px}
.cday{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;
  min-height:56px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;gap:4px}
.cday .dn{font-size:14px;font-weight:700;color:var(--ink-2);line-height:1}
.cday.has{border-color:var(--line);background:var(--surface-2)}
.cday.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cday.today .dn{color:var(--brand);font-weight:850}
.cday .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:6px}
.cday .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cday .dots i.f{background:var(--brand)}
.cday .dots i.e{background:var(--c1)}
.cday .dots i.done{opacity:.32}
@media(min-width:760px){.cday{min-height:76px}.cpad{min-height:76px}.cday .dn{font-size:15px}}
.cgrp{margin-bottom:12px}
.cgh{font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.05em;padding:0 2px 7px}
.crow{display:flex;align-items:center;gap:11px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:12px;padding:12px 13px;margin-bottom:7px}
.crow.done{opacity:.5}
.crow.done b{text-decoration:line-through}
.crow b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow span:not(.cdot){display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:1px}
.cdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.cdot.f{background:var(--brand)}
.cdot.e{background:var(--c1)}

/* ============================================================
   MOTION · HOVER · HIGHLIGHTS
   ============================================================ */
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes sheen{0%{background-position:-180% 0}100%{background-position:280% 0}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 currentColor;opacity:1}50%{box-shadow:0 0 0 6px transparent;opacity:.65}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes drawIn{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}

.reveal{opacity:0;transform:translateY(20px)}
.reveal.in{animation:riseIn .58s cubic-bezier(.22,.9,.28,1) forwards}
.reveal.d1.in{animation-delay:.05s}
.reveal.d2.in{animation-delay:.10s}
.reveal.d3.in{animation-delay:.16s}
.reveal.d4.in{animation-delay:.22s}
.chart-line{stroke-dasharray:1200;animation:drawIn 1.5s ease forwards}
.arc{transition:transform .25s ease,filter .25s ease;transform-origin:50% 50%}
.arc:hover{transform:scale(1.045);filter:brightness(1.18)}

/* buttons get lift + a colour wash */
.btn{position:relative;overflow:hidden}
.btn:after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s ease}
.btn:hover:after{opacity:.07}
.btn:hover{transform:translateY(-2px);border-color:var(--brand)}
.btn:active{transform:scale(.97)}
.btn.pri:hover{box-shadow:0 10px 24px -8px var(--brand)}
.btn.mint{background:var(--acc-mint);color:#08241A;border-color:transparent}
.btn.mint:hover{box-shadow:0 10px 24px -8px var(--acc-mint)}
.btn.amber{background:var(--acc-amber);color:#2A1B00;border-color:transparent}
.btn.amber:hover{box-shadow:0 10px 24px -8px var(--acc-amber)}
.btn.lime{background:var(--acc-lime);color:#1B2600;border-color:transparent}
.btn.lime:hover{box-shadow:0 10px 24px -8px var(--acc-lime)}
.btn.sky{background:var(--acc-sky);color:#04202C;border-color:transparent}
.btn.violet{background:var(--acc-violet);color:#1A0A2A;border-color:transparent}
.btn.outline-mint{border-color:var(--acc-mint);color:var(--acc-mint)}
.btn.outline-amber{border-color:var(--acc-amber);color:var(--acc-amber)}
.btn.outline-sky{border-color:var(--acc-sky);color:var(--acc-sky)}

/* highlighter marks */
mark,.hl{background:linear-gradient(transparent 58%,var(--hl-lime) 58%);color:inherit;padding:0 3px;border-radius:2px;font-weight:750}
.hl-mint{background:linear-gradient(transparent 58%,var(--hl-mint) 58%);padding:0 3px;border-radius:2px;font-weight:750}
.hl-amber{background:linear-gradient(transparent 58%,var(--hl-amber) 58%);padding:0 3px;border-radius:2px;font-weight:750}

/* cards + panels lift and glow on hover */
.card,.panel,.lead,.stat,.fu,.pcard,.rcard,.promptbox{transition:transform .22s cubic-bezier(.22,.9,.28,1),box-shadow .22s ease,border-color .22s ease,background .22s ease}
.card:hover,.promptbox:hover{transform:translateY(-2px);border-color:var(--line);box-shadow:0 16px 34px -22px rgba(0,0,0,.7)}
.panel{position:relative}
.panel:before{content:"";position:absolute;left:0;top:0;height:3px;width:0;background:var(--acc-mint);transition:width .45s cubic-bezier(.22,.9,.28,1)}
.panel:nth-child(2):before{background:var(--acc-amber)}
.panel:nth-child(3):before{background:var(--acc-sky)}
.panel:nth-child(4):before{background:var(--acc-coral)}
.panel:nth-child(5):before{background:var(--acc-violet)}
.panel:nth-child(6):before{background:var(--acc-lime)}
.panel:hover:before{width:100%}
.panel:hover{background:var(--surface)}
.lead:hover{transform:translateX(4px);box-shadow:-4px 0 0 0 var(--acc-mint),0 14px 30px -22px rgba(0,0,0,.8)}
.lead.t-hot:hover{box-shadow:-4px 0 0 0 var(--hot),0 14px 30px -22px rgba(0,0,0,.8)}
.stat:hover{transform:translateY(-3px);border-color:var(--acc-mint);box-shadow:0 14px 28px -20px var(--acc-mint)}
.stat.accent:hover{border-color:var(--hot);box-shadow:0 14px 28px -20px var(--hot)}
.stat.money:hover{border-color:var(--acc-lime);box-shadow:0 14px 28px -20px var(--acc-lime)}
.fu:hover{transform:translateX(4px)}
.pcard:hover{transform:translateY(-2px);border-color:var(--acc-sky)}
.rcard:hover{border-color:var(--acc-amber)}
.chip{transition:transform .16s ease,background .2s ease,border-color .2s ease,color .2s ease}
.chip:hover{transform:translateY(-2px);border-color:var(--acc-mint);color:var(--ink)}
.chip.on:hover{border-color:transparent}
.sugg button{transition:transform .2s ease,border-color .2s ease,background .2s ease}
.sugg button:hover{transform:translateY(-3px);border-color:var(--acc-sky);background:var(--surface-2)}
.tabs button{transition:color .18s ease,transform .18s ease}
.tabs button:hover{color:var(--ink)}
.tabs button.on .ico{animation:floaty 2.6s ease-in-out infinite}
.rail button{transition:transform .16s ease,background .18s ease,color .18s ease}
.rail button:hover{transform:translateX(3px)}
.aigrid .btn:hover{border-color:var(--acc-amber)}
.aigrid .btn .ico{transition:transform .22s ease}
.aigrid .btn:hover .ico{transform:scale(1.18) translateY(-1px)}

/* stat numbers get a colour accent */
.stat b{background:linear-gradient(90deg,var(--ink),var(--ink));-webkit-background-clip:text;background-clip:text}
.panel .big b{position:relative}
.up{color:var(--acc-mint)}
.down{color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--acc-mint) 20%,transparent);color:var(--acc-mint)}
.okdot.ok{background:var(--acc-mint);animation:pulseDot 2.2s ease-in-out infinite}

/* section headers get a coloured tick */
.sect-h h2{position:relative;padding-left:12px}
.sect-h h2:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:14px;border-radius:2px;background:var(--acc-mint)}

/* topbar progress sheen on the brand row */
.topbar h1{background-size:200% 100%}

/* splash motion */
#splash .mark .wm{animation:popIn 1.1s cubic-bezier(.2,.9,.25,1) both}
#splash .mark .tag{animation:riseIn 1.1s .35s cubic-bezier(.2,.9,.25,1) both}
#splash .skip{animation:riseIn .9s .9s ease both}
#splash .skip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc-mint);margin-right:8px;vertical-align:middle;animation:pulseDot 1.8s ease-in-out infinite;color:var(--acc-mint)}
.mtnhead{cursor:pointer}
.mtnhead .ov .wm{transition:transform .5s cubic-bezier(.2,.9,.25,1)}
.mtnhead:hover .ov .wm{transform:translateY(-4px) scale(1.02)}

@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;animation:none!important}
  .chart-line{stroke-dasharray:none;animation:none}
  .tabs button.on .ico,.okdot.ok,#splash .skip .dot{animation:none}
}


/* ============================================================
   OS MODULES
   ============================================================ */
.seg{display:flex;gap:4px;background:var(--bg-2);border:1px solid var(--line-soft);
  border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:40px;padding:0 14px;border-radius:9px;font-size:13.5px;
  font-weight:700;color:var(--ink-3);white-space:nowrap;transition:background .18s ease,color .18s ease}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.6)}
.seg button:hover{color:var(--ink)}

pre.plain{white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:14.5px;
  line-height:1.6;color:var(--ink-2)}

/* priorities */
.prilist{display:flex;flex-direction:column;gap:10px}
.prio{display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line-soft);border-left:4px solid var(--ink-3);
  border-radius:var(--r-m);padding:14px 15px;transition:transform .2s ease,box-shadow .2s ease}
.prio:hover{transform:translateX(4px);box-shadow:0 14px 30px -22px rgba(0,0,0,.8)}
.prio.crit{border-left-color:var(--hot)}
.prio.imp{border-left-color:var(--acc-amber)}
.prio.info{border-left-color:var(--acc-sky)}
.prio .pico{font-size:22px;line-height:1.2}
.prio .pbody{flex:1;min-width:0}
.prio .pbody b{font-size:16px;font-weight:750;display:block}
.prio .pwhat{font-size:14.5px;color:var(--ink);margin-top:3px;line-height:1.45}
.prio .pwhy{font-size:13px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.prio .pact{font-size:13.5px;color:var(--ink-2);margin-top:8px;line-height:1.45}
.prio .pact span{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;
  background:var(--acc-mint);color:#08241A;padding:2px 6px;border-radius:4px;margin-right:7px;vertical-align:1px}

/* approvals */
.approw{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.approw:last-child{border-bottom:0}
.approw>div:first-child{flex:1;min-width:180px}
.approw b{font-size:14.5px;display:block}
.approw span{font-size:13px;color:var(--ink-3);display:block;margin-top:2px}
.approw code{display:block;font-size:11px;color:var(--ink-3);margin-top:5px;word-break:break-all;
  background:var(--bg-2);padding:5px 7px;border-radius:6px}
.apbtn{display:flex;gap:8px}

/* day list */
.daylist{display:flex;flex-direction:column}
.dayrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.dayrow:last-child{border-bottom:0}
.dtime{font-size:13px;font-weight:800;color:var(--ink-2);width:56px;flex:0 0 56px}
.dkind{width:8px;height:8px;border-radius:50%;background:var(--acc-sky);flex:0 0 8px}
.dkind.k-call{background:var(--acc-mint)}
.dkind.k-followup{background:var(--acc-amber)}
.dkind.k-film{background:var(--acc-violet)}
.dkind.k-review{background:var(--acc-lime)}
.dttl{flex:1;min-width:0;font-size:15px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tasks */
.taskrow{display:flex;gap:11px;align-items:flex-start}
.taskrow.done{opacity:.5}
.taskrow.done .tbody b{text-decoration:line-through}
.tick{width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:2px solid var(--line);
  margin-top:2px;transition:background .18s ease,border-color .18s ease}
.tick:hover{border-color:var(--acc-mint)}
.tick.on{background:var(--acc-mint);border-color:var(--acc-mint)}
.tick.on:after{content:"✓";color:#08241A;font-size:14px;font-weight:900;line-height:20px;display:block}
.tbody{flex:1;min-width:0}
.tbody b{font-size:15px;font-weight:700;display:block}
.exprow{display:flex;align-items:center;gap:11px}
.exprow .amt{font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}

/* vault */
.vault{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);
  overflow:hidden;cursor:pointer;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.vcard:hover{transform:translateY(-3px);border-color:var(--acc-violet);box-shadow:0 16px 32px -22px var(--acc-violet)}
.vthumb{position:relative;aspect-ratio:1/1;background:var(--bg-2);display:flex;align-items:center;
  justify-content:center;font-size:30px;color:var(--ink-3);overflow:hidden}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vdur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.68);color:#fff;font-size:10.5px;
  font-weight:750;padding:2px 6px;border-radius:5px;font-style:normal}
.vstat{position:absolute;left:6px;top:6px;font-size:9.5px;font-weight:800;padding:3px 7px;
  border-radius:5px;font-style:normal;background:var(--surface-2);color:var(--ink-2);letter-spacing:.04em}
.vstat.s-New{background:var(--acc-amber);color:#2A1B00}
.vstat.s-Ready{background:var(--acc-mint);color:#08241A}
.vstat.s-Posted{background:var(--acc-sky);color:#04202C}
.vstat.s-Scheduled{background:var(--acc-violet);color:#fff}
.vmeta{padding:10px 11px 12px}
.vmeta b{font-size:13px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmeta span{font-size:11.5px;color:var(--ink-3);display:block;margin-top:2px}
.vtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.vtags i{font-style:normal;font-size:10px;font-weight:650;background:var(--surface-2);
  color:var(--ink-3);padding:2px 6px;border-radius:4px}

/* posts */
.pthumb{width:88px;height:88px;object-fit:cover;border-radius:10px;flex:0 0 88px}
.phook{font-size:15.5px;font-weight:700;line-height:1.35}
.pcap{font-size:14px;color:var(--ink-2);margin-top:6px;line-height:1.5;white-space:pre-wrap}
.pcta{font-size:13.5px;color:var(--acc-mint);font-weight:700;margin-top:6px}
.ptags{font-size:12.5px;color:var(--acc-sky);margin-top:6px;word-break:break-word}

/* filming */
.shots{margin:10px 0 0;padding-left:20px}
.shots li{font-size:14.5px;color:var(--ink-2);padding:4px 0;line-height:1.45}
.why{font-size:13.5px;color:var(--ink-2);margin-top:10px;line-height:1.5}
.why span{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;
  background:var(--surface-2);color:var(--ink-3);padding:2px 6px;border-radius:4px;margin-right:7px;vertical-align:1px}
.muted{opacity:.55}

/* automations */
.tog{width:44px;height:26px;flex:0 0 44px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);position:relative;transition:background .2s ease}
.tog:after{content:"";position:absolute;left:3px;top:2px;width:18px;height:18px;border-radius:50%;
  background:var(--ink-3);transition:transform .2s ease,background .2s ease}
.tog.on{background:color-mix(in srgb,var(--acc-mint) 30%,transparent);border-color:var(--acc-mint)}
.tog.on:after{transform:translateX(18px);background:var(--acc-mint)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.flow i{font-style:normal;font-size:11px;font-weight:650;background:var(--bg-2);color:var(--ink-3);
  padding:3px 8px;border-radius:5px}
.flow b{color:var(--ink-3);font-size:11px}
.logrow.bad{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.logio{display:block;font-size:10.5px;color:var(--ink-3);margin-top:6px;word-break:break-all;
  background:var(--bg-2);padding:5px 7px;border-radius:6px}
.orgrow{display:flex;align-items:center;gap:10px}
.orgrow.on{border-color:var(--acc-mint)}
.savecard .kv .r{padding:9px 0}
.inscard .kv .r{padding:9px 0}


/* ============================================================
   INFORMATION ARCHITECTURE
   ============================================================ */
.navlist{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.navsec{border-radius:var(--r-m)}
.navsec .navtop{display:flex;align-items:center;gap:11px;padding:11px 12px;width:100%;
  border-radius:var(--r-m);color:var(--ink-2);min-height:46px;text-align:left;
  transition:background .18s ease,color .18s ease}
.navsec .navtop .lbl{font-size:14.5px;font-weight:680;letter-spacing:-.1px;line-height:1.2}
.navsec .navtop .ico{font-size:16px;line-height:1;flex:0 0 20px}
.navsec.on>.navtop .lbl{color:var(--brand-ink);font-weight:750}
.navsec.on>.navtop .ico{filter:saturate(0) brightness(0.2)}
.navsec .navtop:hover{background:var(--surface);color:var(--ink)}
.navsec.on>.navtop{background:var(--brand);color:var(--brand-ink)}
.navsec .navtop .ico{width:19px;text-align:center;font-size:15px}
.navsec.admin>.navtop{border:1px dashed var(--line)}
.navsec.admin.on>.navtop{border-color:transparent}
.navsub{display:flex;flex-direction:column;gap:1px;padding:6px 0 8px 34px}
.navsub button{text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:620;
  color:var(--ink-3);min-height:34px;transition:color .15s ease,background .15s ease}
.navsub button:hover{color:var(--ink);background:var(--surface)}
.navsub button.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}

.pagehead{padding:16px 0 0}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.crumbs button{color:var(--ink-3);font-weight:600;font-size:12px}
.crumbs button:hover{color:var(--brand)}
.crumbs i{font-style:normal;opacity:.5}
.crumbs span{color:var(--ink-2);font-weight:650}
.pagetitle{display:flex;align-items:flex-start;gap:12px;margin-top:8px;flex-wrap:wrap}
.pagetitle h2{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.pagetitle p{font-size:13.5px;color:var(--ink-3);margin-top:3px}
.pagetitle .askai{margin-left:auto;background:color-mix(in srgb,var(--acc-violet) 18%,transparent);
  border-color:color-mix(in srgb,var(--acc-violet) 40%,transparent);color:var(--ink);white-space:nowrap}
.pagetitle .askai:hover{border-color:var(--acc-violet)}
.subnav{display:flex;gap:4px;margin-top:14px;overflow-x:auto;padding-bottom:2px;
  border-bottom:1px solid var(--line-soft);scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:0 0 auto;padding:9px 13px;font-size:13.5px;font-weight:650;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;min-height:40px;transition:color .15s ease,border-color .15s ease}
.subnav button:hover{color:var(--ink)}
.subnav button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* command palette */
.palette{display:flex;flex-direction:column;max-height:74vh}
.palette input{width:100%;min-height:54px;padding:15px 16px;background:var(--bg-2);
  border:1px solid var(--line);border-radius:12px;font-size:16.5px}
.palres{overflow-y:auto;margin-top:12px;flex:1}
.palgroup{margin-bottom:14px}
.palgroup>b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:6px;padding-left:2px}
.palgroup button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;
  border-radius:10px;min-height:44px;transition:background .14s ease}
.palgroup button:hover{background:var(--surface-2)}
.palgroup button span{font-size:14.5px;font-weight:600;color:var(--ink);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palgroup button i{font-style:normal;font-size:12px;color:var(--ink-3);white-space:nowrap}
.palempty{padding:26px;text-align:center;color:var(--ink-3);font-size:14px}
.palfoot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--ink-3);text-align:center}
#globalSearch{font-weight:600}
@media(max-width:600px){#globalSearch span{display:none}}


/* ---------- integration center ---------- */
.intcard{padding:0;overflow:hidden}
.inthead{display:flex;align-items:center;gap:13px;padding:16px 18px;cursor:pointer;width:100%}
.inthead:hover{background:var(--surface-2)}
.intico{font-size:21px;width:30px;text-align:center;flex:0 0 30px}
.intmeta{flex:1;min-width:0}
.intmeta b{display:block;font-size:15.5px;font-weight:720}
.intmeta span{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.intchev{color:var(--ink-3);font-size:13px;flex:0 0 14px}
.intcard.open .inthead{border-bottom:1px solid var(--line-soft)}
.intcard>p.hint,.intcard>.warnbox,.intcard>.intneeds,.intcard>.intsteps,.intcard>.intacts{margin-left:18px;margin-right:18px}
.intcard>.intacts{margin-bottom:16px}
.intneeds,.intsteps{margin-top:14px}
.intneeds>b,.intsteps>b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.intneeds ul{margin:0;padding-left:18px}
.intneeds li{font-size:13.5px;color:var(--ink-2);padding:3px 0;line-height:1.45}
.intsteps ol{margin:0;padding-left:20px;counter-reset:st}
.intsteps li{font-size:14px;color:var(--ink-2);padding:7px 0;line-height:1.55}
.intsteps li b{color:var(--ink);font-weight:700}
.intacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- demo banner ---------- */
#demoBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));
  z-index:500;display:flex;align-items:center;gap:10px;
  background:var(--acc-mint);color:#08241A;padding:9px 14px;border-radius:999px;
  font-size:13px;font-weight:750;box-shadow:0 12px 28px -12px rgba(0,0,0,.6);max-width:92vw}
#demoBanner .dot{width:8px;height:8px;border-radius:50%;background:#08241A;animation:pulseDot 2s infinite}
#demoBanner button{background:rgba(0,0,0,.14);color:#08241A;font-weight:800;font-size:12px;
  padding:4px 10px;border-radius:999px}
#demoBanner i{font-style:normal;opacity:.7}
@media(min-width:1040px){#demoBanner{bottom:26px}}
body.demo-on .topbar{box-shadow:inset 0 3px 0 0 var(--acc-mint)}


/* ============================================================
   MATERIAL SYSTEM — woven ground, contour language, tactile
   surfaces. Texture is used selectively, never everywhere.
   ============================================================ */
body{
  background-color:var(--bg);
  background-image:var(--topo);
  background-repeat:no-repeat;
  background-position:center -60px;
  background-size:min(1600px,180%) auto;
  background-attachment:fixed;
}
html[data-theme="dark"] body{opacity:1}

/* the weave: micro crosshatch, almost invisible, felt not seen */
.weave{position:relative}
.weave:before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background-image:
    repeating-linear-gradient(0deg,rgba(40,37,33,.022) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(40,37,33,.022) 0 1px,transparent 1px 3px);
  opacity:.9;
}
html[data-theme="dark"] .weave:before{
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
}

/* ---------- typography: industrial product design ---------- */
body{font-feature-settings:"tnum" 1,"cv05" 1;letter-spacing:-.005em}
h1,h2,h3,.pagetitle h2,.hero-head h2{letter-spacing:-.022em;font-weight:640}
.sect-h h2,.panel .ttl,.intneeds>b,.intsteps>b,.palgroup>b{
  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.sect-h h2{padding-left:13px}
.sect-h h2:before{width:3px;height:11px;border-radius:0;background:var(--ink-3);opacity:.5}
.panel .ttl{text-align:left;margin-top:4px}
.panel .dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.stat span,.vmeta span,.note .t,.crumbs{letter-spacing:.02em}

/* ---------- surfaces: inset, embossed, restrained ---------- */
.card,.panel,.stat,.lead,.note,.fu,.pcard,.rcard,.promptbox,.intcard,.prio,.col{
  box-shadow:var(--shadow-in);
  background-image:none;
}
.card,.intcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l)}
.card:hover,.promptbox:hover{transform:none;box-shadow:var(--shadow-in),var(--shadow);border-color:var(--line)}
.stat{border-radius:var(--r-m);background:var(--surface)}
.stat:hover{transform:translateY(-1px);border-color:var(--line);box-shadow:var(--shadow-in),var(--shadow)}
.stat.accent:hover,.stat.money:hover{border-color:var(--line);box-shadow:var(--shadow-in),var(--shadow)}
.stat b{font-weight:600;letter-spacing:-.03em}
.lead{border-radius:var(--r-m);border-left-width:3px}
.lead:hover{transform:none;box-shadow:var(--shadow-in),var(--shadow);border-color:var(--line)}
.lead.t-hot:hover{box-shadow:var(--shadow-in),var(--shadow)}
.board{border-radius:var(--r-l);gap:1px}
.panel{background:var(--surface)}
.panel:hover{background:var(--surface)}
.panel:before{height:2px;background:var(--ink-3);opacity:.35}
.panel:nth-child(2):before,.panel:nth-child(3):before,.panel:nth-child(4):before,
.panel:nth-child(5):before,.panel:nth-child(6):before{background:var(--ink-3)}

/* ---------- buttons: press depth, not glow ---------- */
.btn{
  border-radius:var(--r-m);font-weight:600;letter-spacing:.005em;
  box-shadow:var(--shadow-in);
  transition:transform .1s cubic-bezier(.2,.8,.3,1),box-shadow .15s ease,background .15s ease,border-color .15s ease;
}
.btn:hover{transform:none;border-color:var(--line);background:var(--surface-2)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(40,37,33,.10)}
.btn:after{display:none}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.pri:hover{background:color-mix(in srgb,var(--brand) 88%,#000);box-shadow:var(--shadow-in),var(--shadow)}
.btn.mint{background:var(--acc-mint);color:#F7F5F0}
.btn.amber{background:var(--acc-amber);color:#2A2521}
.btn.lime{background:var(--acc-lime);color:#20240F}
.btn.sky{background:var(--acc-sky);color:#F7F5F0}
.btn.violet{background:var(--acc-violet);color:#241F2A}
.btn.mint:hover,.btn.amber:hover,.btn.lime:hover,.btn.sky:hover{box-shadow:var(--shadow-in),var(--shadow)}

/* ---------- navigation: subtly raised, never highlighted ---------- */
.rail{background:var(--bg-2);border-right:1px solid var(--line-soft)}
.navsec .navtop{border-radius:var(--r-m);font-weight:560}
.navsec .navtop:hover{background:var(--surface)}
.navsec.on>.navtop{
  background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-in),0 1px 2px rgba(40,37,33,.06);
  border:1px solid var(--line-soft);
}
.navsec.on>.navtop .lbl{color:var(--ink);font-weight:660}
.navsec.on>.navtop .ico{filter:none;opacity:.85}
.navsec .navtop .ico{opacity:.55;font-size:13px;font-weight:400;transform:translateY(-.5px)}
.navsub button.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-in)}
.navsub button.on:before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:2px;height:14px;background:var(--brand)}
.navsub button{position:relative}
.tabs{background:var(--bg-2);border-top:1px solid var(--line)}
.tabs button.on{color:var(--ink)}
.tabs button.on .ico{animation:none;transform:none}
.subnav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.brand b{font-weight:660;letter-spacing:.06em;font-size:15px}
.brand span{letter-spacing:.2em;font-size:9.5px;opacity:.7}

/* ---------- pills: flat, quiet ---------- */
.pill{border-radius:3px;font-weight:650;letter-spacing:.05em;font-size:10.5px;text-transform:uppercase;
  padding:4px 8px;background:var(--surface-2);border:1px solid var(--line-soft)}
.chip{border-radius:var(--r-s);font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
.seg{border-radius:var(--r-m);background:var(--bg-2)}
.seg button{border-radius:var(--r-s);font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-in)}

/* ---------- inputs: inset material ---------- */
.field input,.field select,.field textarea,.search input,.palette input{
  border-radius:var(--r-m);background:var(--surface);
  box-shadow:inset 0 1px 2px rgba(40,37,33,.05);
  border:1px solid var(--line);
}
.field>span{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}

/* ============================================================
   AI VISUAL LANGUAGE — contour movement, no glowing orb
   ============================================================ */
.aistatus{
  display:inline-flex;align-items:center;gap:9px;padding:7px 12px;
  border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);
  box-shadow:var(--shadow-in);font-size:10.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
}
.aistatus .rings{width:16px;height:16px;flex:0 0 16px;overflow:visible}
.aistatus .rings path{fill:none;stroke:var(--brand);stroke-width:1;opacity:.55}
.aistatus.busy .rings path{animation:contourPulse 2.4s ease-in-out infinite}
.aistatus.busy .rings path:nth-child(2){animation-delay:.28s}
.aistatus.busy .rings path:nth-child(3){animation-delay:.56s}
.aistatus.busy{color:var(--ink)}
@keyframes contourPulse{
  0%,100%{transform:scale(.82);opacity:.25}
  50%{transform:scale(1.06);opacity:.85}
}
.aistatus .rings path{transform-origin:50% 50%}

/* contour loader replaces the spinner everywhere */
.spin{
  width:22px;height:9px;border:0;border-radius:0;position:relative;display:inline-block;
  animation:none;vertical-align:-1px;
}
.spin:before,.spin:after{
  content:"";position:absolute;left:0;right:0;height:5px;
  border-top:1px solid currentColor;border-radius:50%;opacity:.5;
}
.spin:before{top:0;animation:contourDrift 1.5s ease-in-out infinite}
.spin:after{top:4px;animation:contourDrift 1.5s ease-in-out infinite .35s}
@keyframes contourDrift{
  0%,100%{transform:scaleX(.7);opacity:.25}
  50%{transform:scaleX(1);opacity:.8}
}

/* the greeting block on the command centre */
.greet{padding:22px 0 4px}
.greet .hello{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.greet h1{font-size:clamp(24px,3.2vw,34px);font-weight:600;letter-spacing:-.03em;margin-top:8px;line-height:1.18}
.greet .lines{margin-top:12px;max-width:640px}
.greet .lines p{font-size:15px;line-height:1.65;color:var(--ink-2);padding:3px 0 3px 16px;position:relative}
.greet .lines p:before{content:"";position:absolute;left:0;top:13px;width:7px;height:1px;background:var(--ink-3);opacity:.6}
.greet .row{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}

/* the terrain header sits flush, no rounded card */
.mtnhead{border-radius:0;border-bottom:1px solid var(--line-soft)}
.mtnhead .ov .tag{letter-spacing:.34em;font-size:9.5px;opacity:.8}

/* elevation bars used for scores and small charts */
.elev{display:flex;align-items:flex-end;gap:2px;height:22px}
.elev i{flex:1;background:var(--ink-3);opacity:.35;border-radius:1px 1px 0 0;transition:height .5s cubic-bezier(.2,.8,.3,1)}
.elev i.on{background:var(--brand);opacity:.9}

/* the score treatment: number plus contour elevation */
.lead .sc{font-weight:600;letter-spacing:-.03em}
.scorebox{border-radius:var(--r-l);background:var(--surface)}
.scorebox .big{font-weight:600;letter-spacing:-.05em}
.scorebox .bar{height:3px;border-radius:0;background:var(--line-soft)}
.scorebox .bar i{border-radius:0}

/* quieter reveals — movement stays, drama goes */
.reveal.in{animation:riseIn .5s cubic-bezier(.22,.9,.28,1) forwards}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chart-line{animation:drawIn 1.1s ease forwards}
.arc:hover{transform:scale(1.02);filter:none}
.prio:hover{transform:none;box-shadow:var(--shadow-in),var(--shadow)}
.fu:hover{transform:none}
.pcard:hover{transform:none;border-color:var(--line)}
.vcard:hover{transform:translateY(-2px);border-color:var(--line);box-shadow:var(--shadow-in),var(--shadow)}
.rail button:hover,.chip:hover,.sugg button:hover{transform:none}
.empty{border-radius:var(--r-l);border-style:solid;border-color:var(--line-soft);background:var(--surface)}
.warnbox{border-radius:var(--r-m);background:var(--surface-2);border-color:var(--line)}
mark,.hl{background:linear-gradient(transparent 62%,var(--hl-lime) 62%)}
.toast{border-radius:var(--r-m);font-weight:600;letter-spacing:.01em}
#demoBanner{border-radius:var(--r-m);background:var(--ink);color:var(--bg)}
#demoBanner .dot{background:var(--acc-mint)}
#demoBanner button{background:rgba(255,255,255,.14);color:var(--bg)}


/* delete buttons were reading as alerts; make them quiet until hovered */
.note .btn.danger,.taskrow .btn.danger,.exprow .btn.danger{
  background:transparent;border-color:transparent;color:var(--ink-3);

/* the lock/theme controls in the topbar */
.topbar .btn.ghost{border-color:var(--line-soft);background:var(--surface)}
/* section rules read better as hairlines than coloured ticks */
.sect-h{border-bottom:1px solid var(--line-soft);padding-bottom:8px;align-items:center}
.sect-h .n{margin-left:auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sect-h .btn{margin-left:10px}
/* stat numbers pick up the ink, colour reserved for state */
.stat.money b{color:var(--acc-mint)}
.stat.accent b{color:var(--hot)}
/* keep the terrain header from feeling like a banner */
.mtnhead{height:210px}
@media(min-width:1040px){.mtnhead{height:260px}}
.mtnhead .ov{bottom:14px}
.mtnhead .ov .wm{font-size:clamp(20px,3.4vw,34px);font-weight:600;letter-spacing:.01em}


/* ============================================================
   PASTEL ACCENT SYSTEM
   Each section carries one pastel. Colour identifies place,
   never decorates for its own sake.
   ============================================================ */
html[data-sec="command"]{--sec:var(--p6);--sec-soft:var(--p6-soft)}
html[data-sec="crm"]    {--sec:var(--p1);--sec-soft:var(--p1-soft)}

html[data-sec="bi"]     {--sec:var(--p2);--sec-soft:var(--p2-soft)}
html[data-sec="ai"]     {--sec:var(--p5);--sec-soft:var(--p5-soft)}
html[data-sec="settings"]{--sec:var(--p6);--sec-soft:var(--p6-soft)}
html[data-sec="sales"]  {--sec:var(--p4);--sec-soft:var(--p4-soft)}
/* default until a section is active; html[data-sec] overrides it */
:root{--sec:var(--p1);--sec-soft:var(--p1-soft)}

.sect-h h2:before{background:var(--sec);opacity:.9}
.subnav button.on{border-bottom-color:var(--sec);color:var(--ink)}
.pagetitle h2:after{content:"";display:block;width:34px;height:2px;background:var(--sec);margin-top:9px;opacity:.85}
.navsub button.on:before{background:var(--sec)}
.navsec.on>.navtop{border-left:2px solid var(--sec)}
.crumbs span{color:var(--ink-2)}

/* panels take the six pastels in sequence */
.panel:nth-child(6n+1):before{background:var(--p1)}
.panel:nth-child(6n+2):before{background:var(--p2)}
.panel:nth-child(6n+3):before{background:var(--p3)}
.panel:nth-child(6n+4):before{background:var(--p4)}
.panel:nth-child(6n+5):before{background:var(--p5)}
.panel:nth-child(6n+6):before{background:var(--p6)}
.panel:before{height:2px;opacity:1;width:28px}
.panel:hover:before{width:100%}

/* stat tiles get a soft pastel wash and a hairline */
.stats .stat{position:relative;overflow:hidden}
.stats .stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--sec);opacity:.85}
.stats .stat:nth-child(6n+1):before{background:var(--p1)}
.stats .stat:nth-child(6n+2):before{background:var(--p2)}
.stats .stat:nth-child(6n+3):before{background:var(--p3)}
.stats .stat:nth-child(6n+4):before{background:var(--p4)}
.stats .stat:nth-child(6n+5):before{background:var(--p5)}
.stats .stat:nth-child(6n+6):before{background:var(--p6)}
.stat:hover{background:var(--sec-soft)}

/* pills soften into the pastel family */
.pill.good{background:var(--p1-soft);color:var(--ink-2);border-color:color-mix(in srgb,var(--p1) 45%,transparent)}
.pill.med{background:var(--p3-soft);color:var(--ink-2);border-color:color-mix(in srgb,var(--p3) 45%,transparent)}
.pill.high{background:var(--p4-soft);color:var(--ink-2);border-color:color-mix(in srgb,var(--p4) 50%,transparent)}
.pill.hot{background:var(--p4-soft);color:var(--hot);border-color:color-mix(in srgb,var(--hot) 35%,transparent)}
.pill.bad{background:var(--p4-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,transparent)}

/* the lead score sits on a pastel elevation chip */
.lead .sc{padding:2px 9px;border-radius:var(--r-s);background:var(--sec-soft);
  border:1px solid color-mix(in srgb,var(--sec) 40%,transparent)}
.lead.t-hot{border-left-color:var(--p4)}
.lead.t-high{border-left-color:var(--p3)}
.lead.t-med{border-left-color:var(--p2)}
.lead.t-low{border-left-color:var(--p6)}

/* the greeting picks up the section pastel */
.greet .lines p:before{background:var(--sec);opacity:.9;width:9px}
.aistatus .rings path{stroke:var(--p1)}
.aistatus.busy .rings path{stroke:var(--p5)}

/* soft pastel wash behind section headers so pages read as places */
.pagehead{position:relative}
.pagehead:before{content:"";position:fixed;left:0;right:0;top:0;height:230px;
  background:linear-gradient(180deg,var(--sec-soft),transparent);opacity:.5;pointer-events:none;z-index:-1}

/* a little more material detail on cards */
.card{position:relative}
.card:after{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);pointer-events:none}
html[data-theme="dark"] .card:after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}

</style>

<script>
/* ============================================================
   LEAD DESK — core
   Single-file CRM. All data stays on this device.
   ============================================================ */
(function(){
"use strict";

/* ---------- storage (falls back to memory if Safari blocks it) ---------- */
var MEM={}, HAS_LS=(function(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; }
})();
function save(){
  var s=JSON.stringify(DB);
  if(HAS_LS){ try{ localStorage.setItem('leaddesk.v1',s); }catch(e){ HAS_LS=false; toast('Storage full — export a backup'); } }
  MEM['leaddesk.v1']=s;
}
function load(){
  var s=null;
  if(HAS_LS){ try{ s=localStorage.getItem('leaddesk.v1'); }catch(e){} }
  if(!s) s=MEM['leaddesk.v1'];
  if(!s) return null;
  try{ return JSON.parse(s); }catch(e){ return null; }
}

/* ---------- constants ---------- */
var STAGES=['New','Contacted','No answer','Follow-up','Interested','Proposal','Negotiating','Won','Lost'];
var CALL_STATUS=['Not called','No answer','Left voicemail','Spoke to owner','Gatekeeper blocked','Wrong number','Do not call'];
var WEB=[['none','No website found'],['social','Social page only'],['broken','Website broken or outdated'],['has','Has a working website'],['unknown','Not checked yet']];
var BOOK=[['none','No booking system found'],['form','Contact form only'],['has','Has online booking'],['unknown','Not checked yet']];
var SOURCES=['Google Maps','Facebook','Instagram','Yelp','Nextdoor','Craigslist','Referral','Drive-by','Marketplace','Other'];
var STATES=['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','PR'];
var HIGH_TICKET=['Painting contractor','Pressure washing','Landscaping','Tree service','Plumber','HVAC','General contractor','Roofing','Used auto dealer','Furniture store','Event rentals','Concrete / masonry','Fencing','Pool service','Solar','Flooring','Welding / fabrication','Moving company','Auto body shop','Junk removal'];
var BOOKING_HEAVY=['Pet grooming','Massage','Tattoo shop','Beauty salon','Barbershop','Nail salon','Mobile detailing','Mobile mechanic','Photography','Med spa','Personal training','Lash / brow studio','Dog training','Chiropractor','Auto glass'];
var CH_COLORS=['var(--p1)','var(--p4)','var(--p6)','var(--p3)','var(--p5)','var(--p2)','var(--c7)'];
var DEFAULT_INDUSTRIES=HIGH_TICKET.concat(BOOKING_HEAVY,[
  'Catering','Food truck','Event vendor','Party rentals','Smoke shop','Mobile repair','Cleaning service','Appliance repair','Locksmith','Towing','Pest control','Window cleaning','Handyman','Electrician','Garage door','Car wash','Bakery','Florist','Boutique','Barber college','Trucking','Notary','Bail bonds','Daycare','Church','Other'
]).sort();

var MODELS={
  claude:[['claude-sonnet-5','Claude Sonnet 5 (recommended)'],['claude-opus-5','Claude Opus 5 (best writing)'],['claude-haiku-4-5-20251001','Claude Haiku 4.5 (cheapest)']],
  openai:[['gpt-4o','GPT-4o (recommended)'],['gpt-4o-mini','GPT-4o mini (cheapest)'],['gpt-4.1','GPT-4.1']]
};

/* ---------- defaults ---------- */
function blankDB(){
  return {
    v:2,
    leads:[],
    chat:[],
    finder:'',
    prompts:{},
    coach:[],
    rebuttals:[],
    industries:DEFAULT_INDUSTRIES.slice(),
    settings:{
      theme:'light',
      provider:'openai',
      model:'gpt-4o',
      key:'',
      proxy:'',
      me:{name:'',company:'Nonmajority',phone:'',email:'',site:'',city:'',offer:'Custom websites and online booking systems for local businesses'},
      goal:3,
      territory:'',
      tone:'Direct and friendly. Short sentences. No hype.'
    }
  };
}
var DB=load()||blankDB();
if(!DB.settings.me) DB.settings.me=blankDB().settings.me;
if(!DB.industries||!DB.industries.length) DB.industries=DEFAULT_INDUSTRIES.slice();
if(!DB.chat) DB.chat=[];
/* the interface was redesigned around the ivory ground — move existing
   installs onto it once, while leaving the dark variant available */
if(DB.settings.themeV!==2){ DB.settings.theme='light'; DB.settings.themeV=2; }
if(!DB.coach) DB.coach=[];
if(!DB.rebuttals) DB.rebuttals=[];
if(DB.finder==null) DB.finder='';
if(!DB.prompts) DB.prompts={};
if(DB.settings.goal==null) DB.settings.goal=3;
if(DB.settings.territory==null) DB.settings.territory='';
if(!DB.settings.provider) DB.settings.provider='openai';

var state={view:'dash',open:null,q:'',filters:{},showFilters:false,gen:{}};

/* ---------- tiny helpers ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return 'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function fmtDate(s){
  if(!s) return '';
  var d=new Date(s+(s.length===10?'T12:00:00':''));
  if(isNaN(d)) return s;
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function relDay(s){
  if(!s) return '';
  var n=daysBetween(today(),s);
  if(n===0) return 'Today';
  if(n===1) return 'Tomorrow';
  if(n===-1) return 'Yesterday';
  if(n<0) return Math.abs(n)+' days overdue';
  return 'In '+n+' days';
}
function money(n){ n=Number(n||0); return '$'+n.toLocaleString(undefined,{maximumFractionDigits:0}); }
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },2200);
}
function copyText(txt,label){
  function done(){ toast((label||'Copied')+' — paste it anywhere'); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){ legacy(); });
  } else legacy();
  function legacy(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Select the text and copy manually'); }
    document.body.removeChild(ta);
  }
}
function labelOf(list,val){
  for(var i=0;i<list.length;i++) if(list[i][0]===val) return list[i][1];
  return val||'';
}

/* ============================================================
   LEAD SCORING  (0–100)
   ============================================================ */
function scoreLead(L){
  var s=22, R=[];
  function add(n,txt,neg){ s+=n; if(txt) R.push({neg:!!neg,text:txt}); }

  /* website — the biggest signal */
  if(L.web==='none') add(24,'No website found — this is the core opening');
  else if(L.web==='social') add(20,'Social page only, no real website to send customers to');
  else if(L.web==='broken') add(17,'Website is broken or badly outdated');
  else if(L.web==='has') add(-34,'Already has a working website — check it before pitching',true);

  /* booking */
  if(L.book==='none') add(14,'No online booking — customers have to call or DM');
  else if(L.book==='form') add(7,'Contact form only, no real booking flow');
  else if(L.book==='has') add(-14,'Already takes bookings online',true);

  /* demand signals */
  var rev=parseInt(L.reviews,10)||0, rate=parseFloat(L.rating)||0;
  if(rev>=100) add(7,rev+' reviews — steady customer flow');
  else if(rev>=30) add(5,rev+' reviews — real customer activity');
  else if(rev>=8) add(3,rev+' reviews on record');
  if(rate>=4.5) add(4,rate+' star rating — reputation worth showing off');
  else if(rate>=4.0) add(2,rate+' star rating');

  if(L.lastReview){
    var d=daysBetween(L.lastReview,today());
    if(d<=60) add(7,'Review activity in the last 2 months — business is active');
    else if(d<=180) add(3,'Reviews within the last 6 months');
    else if(d>540) add(-6,'No recent review activity — confirm they are still open',true);
  }

  /* reachability */
  if(L.owner) add(5,'Owner name on file — you can ask for them by name');
  if(L.phone) add(3,'Direct phone number available');
  if(L.email) add(2,'Email address available');

  /* social without a site */
  var social=!!(L.facebook||L.instagram||L.yelp);
  if(social&&(L.web==='none'||L.web==='social')) add(4,'Active on social but nowhere to convert that traffic');

  /* industry fit */
  if(HIGH_TICKET.indexOf(L.industry)>-1) add(6,'High-ticket work — one extra job pays for the site');
  else if(BOOKING_HEAVY.indexOf(L.industry)>-1) add(6,'Appointment-based — booking online is an obvious win');

  if((parseInt(L.attempts,10)||0)>=4) add(-4,'Contacted several times with no result',true);
  if(L.callStatus==='Do not call') add(-45,'Marked do not call',true);

  s=Math.max(0,Math.min(100,Math.round(s)));
  if(L.override!=null&&L.override!=='') s=Math.max(0,Math.min(100,parseInt(L.override,10)||0));
  return {score:s,reasons:R,manual:L.override!=null&&L.override!==''};
}
function tierOf(sc){
  if(sc>=90) return {k:'hot',label:'HOT',icon:'🔥',color:'var(--hot)'};
  if(sc>=75) return {k:'high',label:'HIGH',icon:'🟠',color:'var(--high)'};
  if(sc>=60) return {k:'med',label:'MEDIUM',icon:'🟡',color:'var(--med)'};
  return {k:'low',label:'LOW',icon:'⚪',color:'var(--low)'};
}
