/* ============================================================
   NONMAJORITY — software 3D mountains (canvas 2D, no libraries)
   plus the SVG chart builders for the dashboard board.
   ============================================================ */
(function(){
"use strict";
var REDUCED=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)||false;

/* ---------- colour helpers ---------- */
function cssVar(n){
  try{ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  catch(e){ return ''; }
}
function hex2rgb(h){
  h=(h||'').replace('#','').trim();
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length<6) return [120,40,64];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }
function rgb(c){ return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'; }
function rgba(c,a){ return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'; }

/* ---------- deterministic value noise ---------- */
function hash(x,y){
  var n=Math.sin(x*127.1+y*311.7)*43758.5453;
  return n-Math.floor(n);
}
function vnoise(x,y){
  var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  var u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  var a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y,oct){
  var s=0,amp=0.5,f=1;
  for(var i=0;i<(oct||5);i++){ s+=vnoise(x*f,y*f)*amp; f*=2.03; amp*=0.5; }
  return s;
}

/* ---------- terrain height field ---------- */
/* Ridged multifractal in TWO dimensions. The previous version varied
   only along x, which produced long walls instead of a field of peaks. */
function ridged2(x,z,oct,lac,gain){
  var amp=1,freq=1,sum=0,w=0;
  oct=oct||6; lac=lac||2.07; gain=gain||0.52;
  for(var i=0;i<oct;i++){
    var n=fbm(x*freq+i*13.7, z*freq+i*9.1, 2);
    var r=1-Math.abs(2*n-1);
    r=Math.pow(r,1.50);
    sum+=r*amp; w+=amp;
    amp*=gain; freq*=lac;
  }
  return sum/w;
}

/* One tuned terrain. TER holds every number that shapes it, so the whole
   range can be redialled from one object without touching the renderer. */
var TER={
  /* ground mass: high everywhere, so the foreground has real relief
     instead of flattening out into a skirt */
  mb:0.88, ma:0.14, mz:-2.0, mzw:8.0, mxw:16.0,
  /* a taller massif set well back — this is the mauve range on the skyline */
  m2a:0.80, m2z:7.0, m2w:3.0,
  /* low-frequency swell: some stretches rise into summits, others fall away */
  swBase:0.42, swAmp:1.05, swF:0.115,
  /* ridge octaves, coarse to fine */
  f0:0.34, gain:0.56, exp0:1.05,
  f1:1.15, w1:0.19,
  f2:3.20, w2:0.095,
  f3:8.50, w3:0.040
};

function H(x,z){
  var mass=TER.mb+TER.ma*Math.exp(-Math.pow((z+TER.mz)/TER.mzw,2))
                        *Math.exp(-Math.pow(x/TER.mxw,6));
  mass+=TER.m2a*Math.exp(-Math.pow((z-TER.m2z)/TER.m2w,2))
                *Math.exp(-Math.pow(x/TER.mxw,4));
  mass*=TER.swBase+TER.swAmp*fbm(x*TER.swF+7.3, z*TER.swF+2.9, 3);
  var det=ridged2(x*TER.f0+4.2, z*TER.f0+2.6, 6, 2.07, TER.gain);
  var h=Math.pow(det,TER.exp0)*mass*1.75;
  h+=Math.pow(ridged2(x*TER.f1+21, z*TER.f1+17, 4),1.8)*mass*TER.w1;
  h+=Math.pow(ridged2(x*TER.f2+37, z*TER.f2+29, 3),2.2)*mass*TER.w2;
  h+=Math.pow(ridged2(x*TER.f3+61, z*TER.f3+53, 3),2.6)*mass*TER.w3;
  h+=0.030*fbm(x*11.0+53,z*11.0+41,2);
  h-=0.06;
  return h>0?h:0;
}

/* ============================================================
   mountain(canvas, opts) → { stop(), recolor() }
   ============================================================ */
function mountain(cv,opts){
  opts=opts||{};
  var ctx=cv&&cv.getContext?cv.getContext('2d',{alpha:false}):null;
  if(!ctx) return {stop:function(){},recolor:function(){}};

  var NX=opts.nx||200, NZ=opts.nz||128;
  var STILL=!!opts.still;
  var W=0,H2=0,DPR=1,raf=0,dead=false;
  var t0=(window.performance&&performance.now?performance.now():Date.now());
  var COL={};
  var px=0,py=0,tpx=0,tpy=0;
  var cam={pitch:opts.pitch==null?0.55:opts.pitch,
           dist:opts.dist||11.0,
           foc:0,cx:0.5,
           cy:opts.cy==null?0.90:opts.cy};

  /* light direction — upper left, slightly toward camera */
  var LX=opts.lx==null?-0.56:opts.lx,
      LY=opts.ly==null? 0.66:opts.ly,
      LZ=opts.lz==null? 0.50:opts.lz;
  var HAZE_K=opts.hazeK==null?0.90:opts.hazeK,
      HAZE_P=opts.hazeP==null?1.80:opts.hazeP,
      HI_K  =opts.hiK  ==null?0.46:opts.hiK;

  function readColors(){
    COL.a   =hex2rgb(cssVar('--mtn-a')||'#84806F');
    COL.c   =hex2rgb(cssVar('--mtn-c')||'#C9B2C4');
    COL.sky =hex2rgb(cssVar('--mtn-sky')||'#EFE5D9');
    COL.sky2=hex2rgb(cssVar('--mtn-sky2')||'#F4DDCD');
    COL.skyL=hex2rgb(cssVar('--mtn-sky-low')||'#E6DBCD');
    COL.hi  =hex2rgb(cssVar('--mtn-hi')||'#F3EEF1');
    /* depth ramp, near to far */
    COL.d1=hex2rgb(cssVar('--mtn-d1')||'#AAB09A');
    COL.d2=hex2rgb(cssVar('--mtn-d2')||'#B3B7A0');
    COL.d3=hex2rgb(cssVar('--mtn-d3')||'#C6BFAC');
    COL.d4=hex2rgb(cssVar('--mtn-d4')||'#B9A6BA');
    COL.d5=hex2rgb(cssVar('--mtn-d5')||'#CCBCCE');
    COL.ramp=[COL.d1,COL.d2,COL.d3,COL.d4,COL.d5];
  }
  function fit(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    var r=cv.getBoundingClientRect();
    W=Math.max(200,r.width); H2=Math.max(120,r.height);
    cv.width=Math.round(W*DPR); cv.height=Math.round(H2*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.lineJoin='round'; ctx.lineCap='round';
  }

  /* The field runs wide so the silhouette reaches both edges with no dome,
     and the near row sits behind the camera line so the base of the range
     always runs off the bottom of the frame. */
  var X0=opts.x0==null?-16.0:opts.x0, X1=opts.x1==null?16.0:opts.x1;
  var Z0=opts.z0==null? -7.0:opts.z0, Z1=opts.z1==null?12.0:opts.z1;
  var VS=opts.vscale||2.15;
  var SKIRT=opts.skirt==null?-6.0:opts.skirt;
  var V=[],HMAX=0;
  (function build(){
    for(var iz=0;iz<=NZ;iz++){
      var row=[];
      for(var ix=0;ix<=NX;ix++){
        var x=X0+(X1-X0)*ix/NX, z=Z0+(Z1-Z0)*iz/NZ;
        var y=(H(x,z)*1.05-0.30)*VS;
        if(y>HMAX) HMAX=y;
        row.push([x,y,z]);
      }
      V.push(row);
    }
  })();

  /* Projection. Positive z is away from the camera, so far geometry rides
     up the frame and the near rows fall off the bottom edge. */
  function P(v,yw,roll){
    var cyw=Math.cos(yw), syw=Math.sin(yw);
    var cp=Math.cos(cam.pitch+roll), sp=Math.sin(cam.pitch+roll);
    var x=v[0]*cyw + v[2]*syw;
    var z0=-v[0]*syw + v[2]*cyw;
    var y=v[1];
    var y2= y*cp + z0*sp;
    var z2=-y*sp + z0*cp;
    var d=z2+cam.dist;
    var s=cam.foc/Math.max(0.4,d);
    return {x:W*cam.cx + x*s + px*22, y:H2*cam.cy - y2*s + py*12, d:d};
  }
  function nrm(a,b,c){
    var u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], v2=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
    var n=[u[1]*v2[2]-u[2]*v2[1],u[2]*v2[0]-u[0]*v2[2],u[0]*v2[1]-u[1]*v2[0]];
    var l=Math.hypot(n[0],n[1],n[2])||1;
    return [n[0]/l,n[1]/l,n[2]/l];
  }

  /* pastel sky: peach overhead easing to cream at the skyline */
  function sky(){
    var g=ctx.createLinearGradient(0,0,0,H2);
    g.addColorStop(0,rgb(COL.sky2));
    g.addColorStop(0.62,rgb(COL.sky));
    g.addColorStop(1,rgb(COL.skyL));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H2);
  }

  var quads=[];
  function draw(el){
    var drift=opts.drift?1:0;
    var yaw=(opts.yaw||0)+((REDUCED||STILL)?0:Math.sin(el*0.055)*0.10+el*0.006);
    var roll=(REDUCED||STILL)?0:Math.sin(el*0.037)*0.010;
    cam.cx=0.5+((REDUCED||STILL)?0:Math.sin(el*0.045)*0.030*drift);
    px+=(tpx-px)*0.06; py+=(tpy-py)*0.06;
    cam.foc=Math.min(W,H2*2.6)*(opts.focK||0.46);
    if(!REDUCED&&!STILL) cam.dist=(opts.dist||11.0)+Math.sin(el*0.048)*0.18;

    sky();

    var cp=Math.cos(cam.pitch), dnear=Z0*cp+cam.dist, dfar=Z1*cp+cam.dist;
    var dspan=Math.max(0.001,dfar-dnear);

    quads.length=0;
    var iz,ix;
    for(iz=0;iz<NZ;iz++){
      for(ix=0;ix<NX;ix++){
        var a=V[iz][ix], b=V[iz][ix+1], c=V[iz+1][ix+1], d=V[iz+1][ix];
        var pa=P(a,yaw,roll), pb=P(b,yaw,roll), pc=P(c,yaw,roll), pd=P(d,yaw,roll);
        var n=nrm(a,b,c);
        var dt=n[0]*LX+n[1]*LY+n[2]*LZ; if(dt<0) dt=0;
        var li=0.34+0.80*dt; if(li<0.08) li=0.08;
        quads.push({p:[pa,pb,pc,pd],dep:(pa.d+pb.d+pc.d+pd.d)/4,li:li,
                    hy:(a[1]+b[1]+c[1]+d[1])/4,sk:false,
                    tint:vnoise(a[0]*0.55+9.1,a[2]*0.55+4.3)});
      }
    }
    /* one skirt on the near row so the base of the range never shows a seam
       or a strip of background at the bottom of the frame */
    for(ix=0;ix<NX;ix++){
      var v1=V[0][ix], v2=V[0][ix+1];
      var s1=[v1[0],SKIRT,v1[2]], s2=[v2[0],SKIRT,v2[2]];
      var q1=P(v1,yaw,roll), q2=P(v2,yaw,roll), q3=P(s2,yaw,roll), q4=P(s1,yaw,roll);
      quads.push({p:[q1,q2,q3,q4],dep:(q1.d+q2.d)/2-0.02,li:0.42,hy:-9,sk:true,tint:0.5});
    }

    quads.sort(function(p,q){ return q.dep-p.dep; });

    for(var i=0;i<quads.length;i++){
      var f=quads[i],col;
      var dn=(f.dep-dnear)/dspan; if(dn<0) dn=0; if(dn>1) dn=1;
      if(f.sk){
        col=mix(COL.d1,COL.a,0.34);
      } else {
        /* depth picks the hue — sage close, mauve far */
        var seg=dn*4, si=seg|0; if(si>3) si=3;
        col=mix(COL.ramp[si],COL.ramp[si+1],seg-si);
        /* elevation lifts it toward the pale ridge tint */
        var hn=f.hy/(HMAX||1); if(hn<0) hn=0; if(hn>1) hn=1;
        hn=hn+(f.tint-0.5)*0.09; if(hn<0) hn=0; if(hn>1) hn=1;
        col=mix(col,COL.hi,Math.pow(hn,1.4)*HI_K);
        var lit=Math.pow(Math.max(0,f.li),1.05);
        col=mix(mix(col,COL.a,0.40),col,Math.min(1,lit*1.24));
        if(lit>0.80) col=mix(col,COL.hi,Math.min(0.40,(lit-0.80)*1.9));
      }
      var haze=Math.min(0.92,Math.max(0,Math.pow(dn,HAZE_P)*HAZE_K));
      col=mix(col,mix(COL.sky,COL.c,0.30),haze);
      ctx.beginPath();
      ctx.moveTo(f.p[0].x,f.p[0].y);
      ctx.lineTo(f.p[1].x,f.p[1].y);
      ctx.lineTo(f.p[2].x,f.p[2].y);
      ctx.lineTo(f.p[3].x,f.p[3].y);
      ctx.closePath();
      ctx.fillStyle=rgb(col);
      ctx.fill();
      ctx.strokeStyle=rgb(mix(col,COL.a,0.16*(1-haze)));
      ctx.lineWidth=0.4;
      ctx.stroke();
    }
  }

  function frame(now){
    if(dead) return;
    draw((now-t0)/1000);
    raf=requestAnimationFrame(frame);
  }

  function onMove(e){
    var r=cv.getBoundingClientRect();
    tpx=((e.clientX-r.left)/Math.max(1,r.width)-0.5)*2;
    tpy=((e.clientY-r.top)/Math.max(1,r.height)-0.5)*2;
  }
  function onLeave(){ tpx=0; tpy=0; }

  readColors(); fit();
  var onR=function(){ fit(); if(STILL) draw(0); };
  window.addEventListener('resize',onR);
  if(opts.parallax&&!REDUCED&&!STILL){
    window.addEventListener('pointermove',onMove,{passive:true});
    cv.addEventListener('pointerleave',onLeave);
  }
  if(STILL) draw(0); else raf=requestAnimationFrame(frame);

  return {
    stop:function(){
      dead=true; cancelAnimationFrame(raf);
      window.removeEventListener('resize',onR);
      window.removeEventListener('pointermove',onMove);
    },
    recolor:function(){ readColors(); if(STILL) draw(0); }
  };
}

/* ---------- extruded wordmark ---------- */
function wordmark(el,text,depth){
  if(!el) return;
  el.textContent=text;
  var base=hex2rgb(cssVar('--mtn-b')||'#8A2846');
  var deep=hex2rgb(cssVar('--mtn-a')||'#5C1B33');
  var n=depth||16, out=[];
  for(var i=1;i<=n;i++){
    var c=mix(base,deep,i/n);
    out.push((i*0.55).toFixed(1)+'px '+(i*0.55).toFixed(1)+'px 0 '+rgb(c));
  }
  out.push('0 '+(n+4)+'px '+(n+12)+'px rgba(40,37,33,.16)');
  el.style.textShadow=out.join(',');
  el.style.color=cssVar('--ink')||'#fff';
}

/* ============================================================
   SVG CHARTS
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function lineChart(o){
  var W=340,Hh=170,PL=30,PR=8,PT=8,PB=40;
  var series=o.series||[], labels=o.labels||[];
  var all=[];
  series.forEach(function(s){ s.values.forEach(function(v){ all.push(v); }); });
  if(o.goal!=null) all.push(o.goal);
  var max=Math.max(1,Math.ceil(Math.max.apply(null,all.concat([1]))*1.25));
  var n=labels.length||1, iw=W-PL-PR, ih=Hh-PT-PB;
  function X(i){ return PL + (n<2?iw/2:iw*i/(n-1)); }
  function Y(v){ return PT + ih - (v/max)*ih; }

  var s='<svg viewBox="0 0 '+W+' '+Hh+'" preserveAspectRatio="none" role="img">';
  for(var t=0;t<=4;t++){
    var v=max*t/4, y=Y(v);
    s+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-soft)" stroke-width="1"/>';
    s+='<text x="'+(PL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="7" fill="var(--ink-3)">'+Math.round(v)+'</text>';
  }
  if(o.goal!=null){
    s+='<line x1="'+PL+'" y1="'+Y(o.goal).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(o.goal).toFixed(1)+'" stroke="var(--acc-amber)" stroke-width="1.2" stroke-dasharray="4 4"/>';
    s+='<text x="'+(W-PR)+'" y="'+(Y(o.goal)-4).toFixed(1)+'" text-anchor="end" font-size="7" fill="var(--acc-amber)" font-weight="700">GOAL</text>';
  }
  series.forEach(function(ser,si){
    var pts=ser.values.map(function(v,i){ return X(i).toFixed(1)+','+Y(v).toFixed(1); }).join(' ');
    if(ser.fill){
      s+='<polygon points="'+PL+','+Y(0).toFixed(1)+' '+pts+' '+X(n-1).toFixed(1)+','+Y(0).toFixed(1)+
         '" fill="'+ser.color+'" opacity="0.10"/>';
    }
    s+='<polyline class="chart-line" points="'+pts+'" fill="none" stroke="'+ser.color+'" stroke-width="'+(ser.thin?1.2:2.1)+'" '+
       (ser.dash?'stroke-dasharray="3 3" ':'')+'stroke-linejoin="round" stroke-linecap="round" opacity="'+(ser.fade?0.45:1)+'"/>';
  });
  var step=Math.max(1,Math.ceil(n/12));
  labels.forEach(function(l,i){
    if(i%step) return;
    var x=X(i);
    s+='<text x="'+x.toFixed(1)+'" y="'+(Hh-PB+16)+'" font-size="6.5" fill="var(--ink-3)" text-anchor="end" transform="rotate(-45 '+x.toFixed(1)+' '+(Hh-PB+16)+')">'+esc(l)+'</text>';
  });
  return s+'</svg>';
}

function donut(o){
  var items=(o.items||[]).filter(function(i){ return i.value>0; });
  var total=items.reduce(function(a,i){ return a+i.value; },0);
  var W=300,Hh=180,cx=W/2,cy=Hh/2,R=58,r=36;
  if(!total) return '';
  var s='<svg viewBox="0 0 '+W+' '+Hh+'" role="img">';
  var ang=-Math.PI/2, gap=0.022;
  items.forEach(function(it,idx){
    var sweep=(it.value/total)*Math.PI*2;
    var a0=ang+gap/2, a1=ang+sweep-gap/2;
    if(a1>a0){
      var large=(a1-a0)>Math.PI?1:0;
      var x0=cx+Math.cos(a0)*R, y0=cy+Math.sin(a0)*R;
      var x1=cx+Math.cos(a1)*R, y1=cy+Math.sin(a1)*R;
      var x2=cx+Math.cos(a1)*r, y2=cy+Math.sin(a1)*r;
      var x3=cx+Math.cos(a0)*r, y3=cy+Math.sin(a0)*r;
      s+='<path class="arc" d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+R+' '+R+' 0 '+large+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+
         ' L'+x2.toFixed(1)+' '+y2.toFixed(1)+' A'+r+' '+r+' 0 '+large+' 0 '+x3.toFixed(1)+' '+y3.toFixed(1)+
         ' Z" fill="'+it.color+'"><title>'+esc(it.label)+': '+it.value+'</title></path>';
    }
    ang+=sweep;
  });
  s+='<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">'+esc(o.center||total)+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="7.5" font-weight="700" fill="var(--ink-3)" letter-spacing="1">'+esc(o.centerLabel||'TOTAL')+'</text>';
  return s+'</svg>';
}

function legend(items){
  return '<div class="legend">'+items.filter(function(i){ return i.value>0; }).map(function(i){
    return '<span><i style="background:'+i.color+'"></i>'+esc(i.label)+' '+i.value+'</span>';
  }).join('')+'</div>';
}

window.LDV={mountain:mountain,wordmark:wordmark,lineChart:lineChart,donut:donut,legend:legend,REDUCED:REDUCED};

/* ============================================================
   NONMAJORITY — TRANSPORT LAYER  (Phase 1)

   Every AI request in the whole app goes through this one file.
   Nothing else is allowed to call a provider directly.

   Two modes:
     gateway  — through your Cloudflare Worker. Key stays server-side.
     direct   — key from this device. Only for you, before the
                Worker is deployed. Blocked once a client is on it.
   ============================================================ */
(function(){
"use strict";
var L=window.LD, DB=L.DB;

/* ---------- config lives in settings ---------- */
function cfg(){
  var s=DB.settings;
  if(!s.gw) s.gw={url:'',code:'',mode:'auto'};
  return s.gw;
}
function bizId(){
  /* stable, URL-safe, scoped per business — the Worker keys everything off this */
  var id=DB.activeOrg||'default';
  return String(id).replace(/[^A-Za-z0-9_-]/g,'').slice(0,64) || 'default';
}
function bizName(){
  try{
    var o=(window.LDOS&&LDOS.orgById)?LDOS.orgById(DB.activeOrg):null;
    return (o&&o.name)||'Business';
  }catch(e){ return 'Business'; }
}
function gatewayReady(){
  var c=cfg();
  return !!(c.url&&c.code);
}
function directReady(){
  return !!DB.settings.key;
}
function mode(){
  var c=cfg();
  /* an explicit override only wins when it is actually backed by real
     credentials - otherwise it used to be possible to get permanently
     stuck forcing "gateway" mode with no code and no way to fall back
     to a working Cloud Sync connection */
  if(c.mode==='gateway'&&gatewayReady()) return 'gateway';
  if(c.mode==='direct'&&directReady()) return 'direct';
  if(window.LDCLOUD&&LDCLOUD.ready()) return 'gateway';
  return gatewayReady()?'gateway':(directReady()?'direct':'none');
}

/* ---------- task routing, mirrored from the Worker ----------
   Features name a TASK. No feature names a model, ever. */
var TASK_MODEL={
  reason:{openai:'gpt-4o',claude:'claude-sonnet-5'},
  write:{openai:'gpt-4o',claude:'claude-sonnet-5'},
  fast:{openai:'gpt-4o-mini',claude:'claude-haiku-4-5-20251001'},
  vision:{openai:'gpt-4o',claude:'claude-sonnet-5'}
};
function directModel(task){
  var p=DB.settings.provider==='claude'?'claude':'openai';
  var row=TASK_MODEL[task]||TASK_MODEL.write;
  /* an explicit model choice in Settings wins for the direct path */
  return DB.settings.model||row[p];
}

/* ---------- the one HTTP function ---------- */
function chat(o){
  return new Promise(function(res,rej){
    var task=TASK_MODEL[o.task]?o.task:'write';
    var feature=o.feature||'unknown';
    var m=mode();

    if(m==='none'){
      rej(new Error('AI is not connected. Connect Cloud Sync in Settings, or add a gateway address and access code.'));
      return;
    }

    if(m==='gateway'){
      var c=cfg();
      var useCloud=window.LDCLOUD&&LDCLOUD.ready();
      var base=(useCloud?LDCLOUD.cfg().apiUrl:c.url).replace(/\/+$/,'');
      var gwHeaders=useCloud
        ?{'Content-Type':'application/json','Authorization':'Bearer '+LDCLOUD.cfg().token}
        :{'Content-Type':'application/json','Authorization':'Bearer '+c.code,
          'X-Business-Id':bizId(),'X-Business-Name':bizName()};
      post(base+'/v1/ai/chat',gwHeaders,JSON.stringify({
        task:task,feature:feature,system:o.system||'',messages:o.messages||[],
        tools:o.tools||undefined,maxTokens:o.maxTokens||1500
      }),function(txt,headers){
        lastRoute={model:headers['x-model-used']||'',provider:headers['x-provider-used']||'',
                   fallback:headers['x-was-fallback']==='1'};
        res(parse(txt));
      },rej);
      return;
    }

    /* direct path — your device only */
    var st=DB.settings;
    var isClaude=st.provider==='claude';
    var url,headers,body;
    var model=directModel(task);
    if(isClaude){
      url='https://api.anthropic.com/v1/messages';
      headers={'Content-Type':'application/json','x-api-key':st.key,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
      body={model:model,max_tokens:o.maxTokens||1500,messages:toClaude(o.messages||[])};
      if(o.system) body.system=o.system;
      if(o.tools&&o.tools.length) body.tools=o.tools.map(toClaudeTool);
    } else {
      url='https://api.openai.com/v1/chat/completions';
      headers={'Content-Type':'application/json','Authorization':'Bearer '+st.key};
      body={model:model,max_tokens:o.maxTokens||1500,
        messages:o.system?[{role:'system',content:o.system}].concat(o.messages||[]):(o.messages||[])};
      if(o.tools&&o.tools.length){ body.tools=o.tools; body.tool_choice='auto'; }
    }
    lastRoute={model:model,provider:isClaude?'anthropic':'openai',fallback:false};
    post(url,headers,JSON.stringify(body),function(txt){ res(parse(txt)); },rej);
  });
}

var lastRoute={model:'',provider:'',fallback:false};

function post(url,headers,body,ok,rej){
  fetch(url,{method:'POST',headers:headers,body:body})
    .then(function(r){
      var hh={};
      try{ r.headers.forEach(function(v,k){ hh[k.toLowerCase()]=v; }); }catch(e){}
      return r.text().then(function(t){
        if(!r.ok){
          var d=null; try{ d=JSON.parse(t); }catch(e){}
          var msg=(d&&d.error&&(d.error.message||d.error.type))||('Request failed ('+r.status+')');
          if(r.status===401) msg=mode()==='gateway'&&window.LDCLOUD&&LDCLOUD.ready()
            ?'Your Cloud Sync session has expired. Reconnect it in Settings.'
            :'The gateway rejected your access code. Check it in Settings.';
          if(r.status===402) msg=msg||'AI budget for this month is used up.';
          if(r.status===429) msg='Too many requests in a minute. Wait a moment.';
          var e2=new Error(msg); e2.status=r.status; throw e2;
        }
        return {txt:t,headers:hh};
      });
    })
    .then(function(o){ ok(o.txt,o.headers); })
    .catch(function(e){
      var msg=String(e.message||e);
      if(/Failed to fetch|NetworkError|Load failed/i.test(msg)){
        msg=mode()==='gateway'
          ? 'Could not reach your gateway. Check the address in Settings and that the Worker is deployed.'
          : 'Could not reach the AI. Check your internet and your key.';
      }
      rej(new Error(msg));
    });
}

/* ---------- response handling: one shape for the whole app ---------- */
function parse(txt){
  var d=null; try{ d=JSON.parse(txt); }catch(e){}
  if(!d) return {text:String(txt||'').trim(),toolCalls:[],raw:null};

  /* OpenAI */
  if(d.choices&&d.choices.length){
    var m=d.choices[0].message||{};
    return {
      text:m.content||'',
      toolCalls:(m.tool_calls||[]).map(function(c){
        var args={}; try{ args=JSON.parse(c.function.arguments||'{}'); }catch(e){}
        return {id:c.id,name:c.function.name,args:args};
      }),
      assistantMsg:m, shape:'openai', raw:d, usage:d.usage||null
    };
  }
  /* Anthropic */
  if(d.content&&d.content.length){
    return {
      text:d.content.filter(function(b){ return b.type==='text'; })
                    .map(function(b){ return b.text; }).join('\n'),
      toolCalls:d.content.filter(function(b){ return b.type==='tool_use'; })
                         .map(function(b){ return {id:b.id,name:b.name,args:b.input||{}}; }),
      assistantMsg:{role:'assistant',content:d.content}, shape:'claude', raw:d, usage:d.usage||null
    };
  }
  if(typeof d.text==='string') return {text:d.text.trim(),toolCalls:[],raw:d};
  return {text:'',toolCalls:[],raw:d};
}

/* the app writes OpenAI shape; convert only when talking direct to Claude */
function toClaude(messages){
  var out=[];
  messages.forEach(function(m){
    if(m.role==='system') return;
    var role=m.role==='assistant'?'assistant':'user';
    if(typeof m.content==='string'){ out.push({role:role,content:m.content}); return; }
    if(Array.isArray(m.content)){
      out.push({role:role,content:m.content.map(function(p){
        if(p.type==='image_url'){
          var u=(p.image_url&&p.image_url.url)||'';
          var mt=(/^data:([^;]+)/.exec(u)||[])[1]||'image/jpeg';
          return {type:'image',source:{type:'base64',media_type:mt,data:u.split(',')[1]||''}};
        }
        return p;
      })});
      return;
    }
    out.push({role:'user',content:String(m.content==null?'':m.content)});
  });
  return out;
}
function toClaudeTool(t){
  var f=t.function||t;
  return {name:f.name,description:f.description,
    input_schema:f.parameters||f.input_schema||{type:'object',properties:{}}};
}

/* tool results, in whichever shape the last reply used */
function toolResultMessages(shape,calls,results){
  if(shape==='claude'){
    return [{role:'user',content:calls.map(function(c,i){
      return {type:'tool_result',tool_use_id:c.id,content:JSON.stringify(results[i])};
    })}];
  }
  return calls.map(function(c,i){
    return {role:'tool',tool_call_id:c.id,content:JSON.stringify(results[i])};
  });
}

/* ---------- transcription ---------- */
function transcribe(blob,filename){
  return new Promise(function(res,rej){
    var m=mode();
    var fd=new FormData();
    fd.append('file',blob,filename||'call.m4a');
    var url,headers={};
    if(m==='gateway'){
      var c=cfg();
      url=c.url.replace(/\/+$/,'')+'/v1/ai/transcribe';
      headers={'Authorization':'Bearer '+c.code,'X-Business-Id':bizId(),'X-Business-Name':bizName()};
    } else if(m==='direct'&&DB.settings.provider==='openai'&&DB.settings.key){
      url='https://api.openai.com/v1/audio/transcriptions';
      headers={'Authorization':'Bearer '+DB.settings.key};
      fd.append('model','whisper-1');
      fd.append('response_format','text');
    } else {
      rej(new Error('Voice needs the gateway, or an OpenAI key on this device.'));
      return;
    }
    fetch(url,{method:'POST',headers:headers,body:fd})
      .then(function(r){
        return r.text().then(function(t){
          if(!r.ok){
            var msg=t; try{ var d=JSON.parse(t); msg=(d.error&&d.error.message)||t; }catch(e){}
            throw new Error(msg||('Transcription failed ('+r.status+')'));
          }
          return t;
        });
      })
      .then(function(t){
        var out=t;
        try{ var d=JSON.parse(t); if(d&&d.text) out=d.text; }catch(e){}
        out=String(out).trim();
        if(!out) throw new Error('Nothing was transcribed. The recording may be silent.');
        res(out);
      })
      .catch(function(e){
        var msg=String(e.message||e);
        if(/Failed to fetch|NetworkError|Load failed/i.test(msg))
          msg='Could not reach the transcription service.';
        rej(new Error(msg));
      });
  });
}

/* ---------- usage + health ---------- */
function usage(month){
  var c=cfg();
  if(!gatewayReady()) return Promise.reject(new Error('No gateway configured.'));
  return fetch(c.url.replace(/\/+$/,'')+'/v1/usage'+(month?('?month='+month):''),{

/* ---------- automatic backup ---------- */
var backupTimer=null, lastBackupHash='';
function snapshot(){
  try{
    if(window.LDOS&&LDOS.syncBack) LDOS.syncBack();
    var copy=JSON.parse(JSON.stringify(DB));
    /* secrets never go into a backup */
    if(copy.settings){
      copy.settings.key='';
      if(copy.settings.gw) copy.settings.gw.code='';
      copy.settings.voiceKey='';
    }
    copy._backupAt=new Date().toISOString();
    return JSON.stringify(copy);
  }catch(e){ return null; }
}
function hash(s){
  var h=5381;
  for(var i=0;i<s.length;i+=7) h=((h<<5)+h+s.charCodeAt(i))|0;
  return String(h)+':'+s.length;
}
function backupNow(force){
  return new Promise(function(res,rej){
    if(!gatewayReady()){ rej(new Error('No gateway configured.')); return; }
    var snap=snapshot();
    if(!snap){ rej(new Error('Could not build a snapshot.')); return; }
    var hh=hash(snap);
    if(!force&&hh===lastBackupHash){ res({ok:true,skipped:'nothing changed'}); return; }
    var c=cfg();
    fetch(c.url.replace(/\/+$/,'')+'/v1/backup',{
      method:'POST',
      headers:{'Authorization':'Bearer '+c.code,'X-Business-Id':bizId(),
               'X-Business-Name':bizName(),'Content-Type':'application/json'},
      body:snap
    }).then(function(r){
      return r.json().then(function(d){
        if(!r.ok) throw new Error((d.error&&d.error.message)||'Backup failed.');
        lastBackupHash=hh;
        DB.settings.lastBackup=d.saved_at;
        DB.settings.lastBackupBytes=d.bytes;
        try{ L.save(); }catch(e){}
        res(d);
      });
    }).catch(function(e){ rej(new Error(String(e.message||e))); });
  });
}
function scheduleBackup(){
  if(!gatewayReady()) return;
  clearTimeout(backupTimer);
  backupTimer=setTimeout(function(){
    backupNow(false).catch(function(){ /* silent — never interrupt work */ });
  },90000);   // 90s after the last change
}
function restoreLatest(){
  var c=cfg();
  if(!gatewayReady()) return Promise.reject(new Error('No gateway configured.'));
  return fetch(c.url.replace(/\/+$/,'')+'/v1/backup/latest',{
    headers:{'Authorization':'Bearer '+c.code,'X-Business-Id':bizId()}
  }).then(function(r){
    return r.json().then(function(d){
      if(!r.ok) throw new Error((d.error&&d.error.message)||'No backup found.');
      return d;
    });
  });
}
function backupList(){
  var c=cfg();
  if(!gatewayReady()) return Promise.reject(new Error('No gateway configured.'));
  return fetch(c.url.replace(/\/+$/,'')+'/v1/backup/list',{
    headers:{'Authorization':'Bearer '+c.code,'X-Business-Id':bizId()}
  }).then(function(r){ return r.json(); });
}

/* every save nudges the backup timer */
var _save=L.save;
L.save=function(){ _save.apply(this,arguments); try{ scheduleBackup(); }catch(e){} };

window.LDNET={
  chat:chat,transcribe:transcribe,usage:usage,health:health,
  businessSettings:businessSettings,setByok:setByok,
  backupNow:backupNow,restoreLatest:restoreLatest,backupList:backupList,snapshot:snapshot,
  toolResultMessages:toolResultMessages,
  mode:mode,gatewayReady:gatewayReady,directReady:directReady,cfg:cfg,bizId:bizId,
  lastRoute:function(){ return lastRoute; },
  TASK_MODEL:TASK_MODEL
};
})();

/* ============================================================
   NONMAJORITY OS — tenancy, action registry, permissions,
   audit log, media store, business memory, automations.
   ============================================================ */
(function(){
"use strict";
var L=window.LD, DB=L.DB;

/* ============================================================
   1. MULTI-BUSINESS (tenancy)
   Every record lives inside a workspace. DB.leads always points
   at the ACTIVE workspace, so every existing module keeps working.
   ============================================================ */
var BUCKETS=['leads','tasks','events','expenses','vendors','assets','posts','metrics',
             'insights','savings','gaps','filming','automations','aiLog','briefs','reviews',
             'chat','prompts'];

function blankSpace(){
  return {leads:[],tasks:[],events:[],expenses:[],vendors:[],assets:[],posts:[],metrics:[],
          insights:[],savings:[],gaps:[],filming:[],automations:[],aiLog:[],briefs:[],reviews:[],
          chat:[],prompts:{},finder:'',coach:'',coachOut:'',
          memory:blankMemory()};
}
function blankMemory(){
  return {
    profile:{name:'',industry:'',city:'',services:'',products:'',goals:'',customers:'',founded:''},
    prefs:{hoursStart:'08:00',hoursEnd:'18:00',days:'Mon-Fri',callWindow:'9am-11am and 2pm-4pm',
           tone:'',autoLevel:'high',postPlatforms:'Instagram, TikTok, Facebook, YouTube Shorts'},
    knowledge:{pricing:'',objections:'',faqs:'',policies:'',differentiators:''}
  };
}

function migrate(){
  if(DB.spaces&&DB.orgs&&DB.activeOrg) return;
  var id='w'+Date.now().toString(36);
  DB.orgs=[{id:id,name:(DB.settings&&DB.settings.me&&DB.settings.me.company)||'My Business',
            industry:'',created:L.today()}];
  DB.activeOrg=id;
  DB.spaces={};
  var sp=blankSpace();
  /* carry the existing single-business data straight in — nothing is lost */
  sp.leads=DB.leads||[];
  sp.chat=DB.chat||[];
  sp.prompts=DB.prompts||{};
  sp.finder=DB.finder||'';
  sp.coach=DB.coach||'';
  sp.coachOut=DB.coachOut||'';
  if(DB.settings&&DB.settings.me){
    sp.memory.profile.name=DB.settings.me.company||'';
    sp.memory.profile.city=DB.settings.me.city||'';
    sp.memory.profile.services=DB.settings.me.offer||'';
  }
  sp.memory.prefs.tone=(DB.settings&&DB.settings.tone)||'';
  DB.spaces[id]=sp;
}
function space(){
  if(!DB.spaces[DB.activeOrg]) DB.spaces[DB.activeOrg]=blankSpace();
  var sp=DB.spaces[DB.activeOrg];
  BUCKETS.forEach(function(b){ if(sp[b]==null) sp[b]= (b==='prompts')?{}:[]; });
  if(!sp.memory) sp.memory=blankMemory();

  if(!sp.memory.prefs) sp.memory.prefs=blankMemory().prefs;
  if(!sp.memory.knowledge) sp.memory.knowledge=blankMemory().knowledge;
  return sp;
}

function bind(){

  DB.leads=sp.leads; DB.chat=sp.chat; DB.prompts=sp.prompts;
  DB.finder=sp.finder; DB.coach=sp.coach; DB.coachOut=sp.coachOut;
}

  sp.leads=DB.leads; sp.chat=DB.chat; sp.prompts=DB.prompts;
  sp.finder=DB.finder; sp.coach=DB.coach; sp.coachOut=DB.coachOut;

function switchOrg(id){
  syncBack();
  DB.activeOrg=id;
  bind();
  L.save(); L.go('command');
  L.toast('Switched to '+(orgById(id)||{}).name);
}
function orgById(id){
  for(var i=0;i<DB.orgs.length;i++) if(DB.orgs[i].id===id) return DB.orgs[i];
  return null;
}
function addOrg(name,industry){
  var id='w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  DB.orgs.push({id:id,name:name,industry:industry||'',created:L.today()});
  DB.spaces[id]=blankSpace();
  DB.spaces[id].memory.profile.name=name;
  DB.spaces[id].memory.profile.industry=industry||'';
  syncBack(); DB.activeOrg=id; bind(); L.save();
  return id;
}
function deleteOrg(id){
  if(DB.orgs.length<2) return false;
  DB.orgs=DB.orgs.filter(function(o){ return o.id!==id; });
  delete DB.spaces[id];
  if(DB.activeOrg===id){ DB.activeOrg=DB.orgs[0].id; bind(); }
  L.save(); return true;
}

/* ---- helpers used by actions ---- */
function toMin(t){ var m=/^(\d{1,2}):(\d{2})$/.exec(str(t)||'09:00'); return m?(+m[1]*60 + +m[2]):540; }
function findConflict(date,time,mins,skipId){
  var s=toMin(time), e=s+(mins||30);
  var hit=null;
  space().events.forEach(function(v){
    if(v.id===skipId||v.date!==date) return;
    var vs=toMin(v.time), ve=vs+(v.mins||30);
    if(s<ve&&vs<e) hit=v;
  });
  return hit;
}

/* ============================================================
   6. THE DISPATCHER — nothing touches data except through here
   ============================================================ */
var pendingApprovals=[];
function runAction(name,input,opts){
  opts=opts||{};
  var t0=Date.now();
  var def=ACTIONS[name];
  if(!def){
    logAI({action:name,tool:name,scope:'read',input:JSON.stringify(input),ok:false,result:'unknown action'});
    return {ok:false,error:'Unknown action: '+name};
  }
  if(needsApproval(def.scope)&&!opts.approved){
    var p={id:uid('ap'),action:name,input:input,desc:def.desc,scope:def.scope,t:new Date().toISOString()};
    pendingApprovals.push(p);
    logAI({action:name,tool:name,scope:def.scope,input:JSON.stringify(input),
      ok:true,approval:true,granted:false,result:'waiting for your approval',
      summary:def.desc});
    return {ok:false,pending:true,approvalId:p.id,error:'needs your approval'};
  }
  try{
    var out=def.run(input||{});
    L.save();
    logAI({action:name,tool:name,scope:def.scope,input:JSON.stringify(input),
      result:JSON.stringify(out),ok:true,approval:needsApproval(def.scope),
      granted:!!opts.approved,ms:Date.now()-t0,summary:summarise(name,input,out)});
    return {ok:true,result:out};
  }catch(err){
    logAI({action:name,tool:name,scope:def.scope,input:JSON.stringify(input),
      result:String(err.message||err),ok:false,ms:Date.now()-t0});
    return {ok:false,error:String(err.message||err)};
  }
}
function approve(id){
  var p=null;
  pendingApprovals=pendingApprovals.filter(function(x){ if(x.id===id){ p=x; return false; } return true; });
  if(!p) return {ok:false,error:'not found'};
  return runAction(p.action,p.input,{approved:true});
}
function rejectApproval(id){
  pendingApprovals=pendingApprovals.filter(function(x){ return x.id!==id; });
  logAI({action:'approval.rejected',tool:'approval',scope:'sensitive',ok:true,result:'you declined'});
  return {ok:true};
}
function summarise(name,i,o){
  i=i||{}; o=o||{};
  switch(name){
    case 'createLead': return 'Added lead '+(o.business||'')+' (score '+o.score+')';
    case 'updateLead': return 'Updated '+(o.changed||[]).join(', ')+' on a lead';
    case 'addLeadNote': return 'Logged a note on a lead';
    case 'deleteLead': return 'Deleted lead '+(o.deleted||'');
    case 'createTask': return 'Created task "'+(o.title||'')+'" due '+(o.due||'');
    case 'completeTask': return 'Completed a task';
    case 'createEvent': return 'Scheduled "'+(o.title||'')+'" on '+(o.date||'')+' at '+(o.time||'');
    case 'rescheduleEvent': return 'Moved an event to '+(o.date||'')+' '+(o.time||'');
    case 'cancelEvent': return 'Cancelled '+(o.cancelled||'');
    case 'scheduleFollowUp': return 'Set follow-up with '+(o.lead||'')+' for '+(o.date||'');
    case 'createExpense': return 'Recorded '+L.money(o.amount)+' to '+(o.vendor||'');
    case 'categorizeExpense': return 'Filed an expense under '+(o.category||'');
    case 'createSavingsOpportunity': return 'Found a possible saving of '+L.money(o.monthly)+'/mo ('+(o.confidence||'')+' confidence)';
    case 'tagContent': return 'Analysed and tagged a content asset';
    case 'recommendPost': return 'Recommended posting '+(o.asset||'')+' on '+(o.platform||'');
    case 'createFilmingTask': return 'Added "'+(o.title||'')+'" to the filming list';
    case 'createContentGap': return 'Flagged a content gap: '+(o.gap||'');
    case 'createInsight': return 'Insight: '+(o.title||'');
    case 'recordSocialMetrics': return 'Recorded '+(o.platform||'')+' numbers';
    default: return name;
  }
}

   7. TOOL SCHEMAS for the model
   ============================================================ */
function typeOf(desc){
  if(/^number/.test(desc)) return {type:'number'};
  if(/^boolean/.test(desc)) return {type:'boolean'};
  if(/^array/.test(desc)) return {type:'array',items:{type:'string'}};
  if(/^object/.test(desc)) return {type:'object'};
  return {type:'string'};
}
function openaiTools(names){
  return (names||Object.keys(ACTIONS)).map(function(n){
    var d=ACTIONS[n], props={}, req=[];
    Object.keys(d.schema).forEach(function(k){
      var desc=d.schema[k];
      props[k]=Object.assign(typeOf(desc),{description:desc});
      if(/required/.test(desc)) req.push(k);
    });
    return {type:'function',function:{name:n,description:d.desc,
      parameters:{type:'object',properties:props,required:req}}};
  });
}
function claudeTools(names){
  return (names||Object.keys(ACTIONS)).map(function(n){
    var d=ACTIONS[n], props={}, req=[];
    Object.keys(d.schema).forEach(function(k){
      var desc=d.schema[k];
      props[k]=Object.assign(typeOf(desc),{description:desc});
      if(/required/.test(desc)) req.push(k);
    });
    return {name:n,description:d.desc,input_schema:{type:'object',properties:props,required:req}};
  });
}

/* ============================================================
   8. MEDIA STORE (IndexedDB) — real files, on the device
   ============================================================ */
var IDB=null, IDB_FAIL=false;
function openDB(){
  return new Promise(function(res,rej){
    if(IDB) return res(IDB);
    if(IDB_FAIL||!window.indexedDB) return rej(new Error('no storage'));
    var r=indexedDB.open('nonmajority-media',1);
    r.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files');
    };
    r.onsuccess=function(){ IDB=r.result; res(IDB); };
    r.onerror=function(){ IDB_FAIL=true; rej(new Error('storage blocked')); };
  });
}
function putFile(key,blob){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction('files','readwrite');
      tx.objectStore('files').put(blob,key);
      tx.oncomplete=function(){ res(key); };
      tx.onerror=function(){ rej(new Error('could not save the file')); };
    });
  });
}
function getFile(key){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction('files','readonly');
      var rq=tx.objectStore('files').get(key);
      rq.onsuccess=function(){ res(rq.result||null); };
      rq.onerror=function(){ rej(new Error('could not read the file')); };
    });
  });
}
function delFile(key){
  return openDB().then(function(db){
    return new Promise(function(res){
      var tx=db.transaction('files','readwrite');
      tx.objectStore('files').delete(key);
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ res(false); };
    });
  });
}
function storageUse(){
  if(navigator.storage&&navigator.storage.estimate) return navigator.storage.estimate();
  return Promise.resolve(null);
}

function fire(trigger,payload){
  var list=space().automations.filter(function(a){ return a.enabled&&a.on===trigger; });
  var done=[];
  list.forEach(function(a){
    try{
      var r=runAutomation(a,payload);
      if(r){ a.runs=(a.runs||0)+1; a.last=new Date().toISOString(); done.push(a.name); }
    }catch(e){}
  });
  if(done.length) L.save();
  return done;
}
function runAutomation(a,p){
  p=p||{};
  if(a.on==='lead.hot'||a.on==='lead.created'){
    var l=p.lead; if(!l) return false;
    var sc=L.scoreLead(l).score;
    if(a.on==='lead.hot'&&sc<90) return false;
    if(a.act==='createTask'){
      return runAction('createTask',{title:'Call '+(l.business||'lead')+' — '+sc+'/100',
        due:L.today(),priority:sc>=90?'critical':'important',leadId:l.id,kind:'call',
        notes:'Automation: '+a.name}).ok;
    }
    if(a.act==='scheduleFollowUp'&&!l.nextFollow){
      var d=new Date(); d.setDate(d.getDate()+(sc>=90?1:2));
      return runAction('scheduleFollowUp',{id:l.id,date:d.toISOString().slice(0,10),
        why:'Automation: '+a.name}).ok;
    }
  }
  if(a.on==='lead.stale'){
    var s=p.lead; if(!s) return false;
    return runAction('createTask',{title:'Re-engage '+(s.business||'lead'),due:L.today(),
      priority:'important',leadId:s.id,kind:'followup',notes:'No contact in 14 days'}).ok;
  }
  if(a.on==='expense.created'&&a.act==='categorizeExpense'){
    var x=p.expense; if(!x||x.category!=='Uncategorised') return false;
    var guess=guessCategory(x.vendor);
    if(!guess) return false;
    return runAction('categorizeExpense',{id:x.id,category:guess}).ok;
  }
  if(a.on==='content.uploaded'&&a.act==='analyzeAsset'){
    if(window.LDOS&&LDOS.analyzeAsset&&p.asset){ LDOS.analyzeAsset(p.asset.id); return true; }
  }
  return false;
}

/* ============================================================
   10. STALE SWEEP — runs on load, once a day
   ============================================================ */
function dailySweep(){
  var sp=space();
  if(sp.lastSweep===L.today()) return;
  sp.lastSweep=L.today();
  DB.leads.forEach(function(l){
    if(l.stage==='Won'||l.stage==='Lost') return;
    if(!l.lastContacted) return;
    if(L.daysBetween(l.lastContacted,L.today())>=14){
      var already=sp.tasks.some(function(t){ return t.leadId===l.id&&!t.done&&t.kind==='followup'; });
      if(!already) fire('lead.stale',{lead:l});
    }
  });
  fire('day.start',{});
  L.save();
}

(function(){

/* ============================================================
   PHASE 2A — NEW BUCKETS
   ============================================================ */
var NEW_BUCKETS=['customers','appointments','invoices','payments','custreviews','comms','events_log','conversations','templates','followUps'];
(function extend(){

/* ============================================================
   PHASE 2B — FOUR PERMISSION LEVELS
     read      inspect data
     recommend suggest something
     draft     prepare an action, do not commit it outward
     execute   actually do it
   ============================================================ */
var LEVEL_ORDER={read:0,recommend:1,draft:2,execute:3};

/* anything here always asks, whatever the automation level */
var ALWAYS_APPROVE={
  deleteLead:1, cancelEvent:1, deleteCustomer:1, cancelAppointment:1,
  sendMessage:1, sendReviewRequest:1, voidInvoice:1, refundPayment:1,
  setBudget:1
};

/* re-label the existing registry onto the four levels */
(function relabel(){
  /* Honest classification. DRAFT prepares something you can undo or
     ignore. EXECUTE changes money, the outside world, or destroys data
     — those always stop for you. Getting this wrong in either direction
     is bad: too loose is unsafe, too tight and the AI stalls constantly. */
  var SCOPE_OF={
    scoreLead:'read',
    createSavingsOpportunity:'recommend', createContentGap:'recommend',
    createInsight:'recommend', recommendPost:'recommend',
    createLead:'draft', updateLead:'draft', addLeadNote:'draft',
    createTask:'draft', completeTask:'draft', createEvent:'draft',
    scheduleFollowUp:'draft', createExpense:'draft', categorizeExpense:'draft',
    tagContent:'draft', createFilmingTask:'draft', recordSocialMetrics:'draft',
    createCustomer:'draft', updateCustomer:'draft', convertLeadToCustomer:'draft',
    createAppointment:'draft', completeAppointment:'draft', missAppointment:'draft',
    createInvoice:'draft', logCommunication:'draft', draftMessage:'draft',
    recordReview:'draft', sendReviewRequest:'draft',
    /* these move money, cancel on someone, send outward, or delete */
    recordPayment:'execute', voidInvoice:'execute', setBudget:'execute',
    rescheduleAppointment:'execute', cancelAppointment:'execute',
    cancelEvent:'execute', rescheduleEvent:'execute',
    sendMessage:'execute', deleteLead:'execute', deleteCustomer:'execute'
  };
  Object.keys(OS.ACTIONS).forEach(function(k){
    var a=OS.ACTIONS[k];
    if(SCOPE_OF[k]) a.scope=SCOPE_OF[k];
    else if(a.scope==='write') a.scope='draft';
    else if(a.scope==='sensitive'){ a.scope='execute'; a.always=true; }
    if(ALWAYS_APPROVE[k]) a.always=true;
  });
  OS.SCOPE_OF=SCOPE_OF;
})();

function allowed(scope,name){
  if(name&&OS.ACTIONS[name]&&OS.ACTIONS[name].always) return false;
  var lv=OS.autoLevel();
  var need=LEVEL_ORDER[scope];
  if(need==null) return false;
  if(need<=LEVEL_ORDER.recommend) return true;          // read + recommend always fine
  if(need===LEVEL_ORDER.draft) return lv!=='low';        // drafting is safe unless recommend-only
  return lv==='high';                                    // execute needs the top setting
}
OS.allowed=allowed;
OS.needsApproval=function(scope,name){ return !allowed(scope,name); };
OS.LEVEL_ORDER=LEVEL_ORDER;
OS.ALWAYS_APPROVE=ALWAYS_APPROVE;

/* ============================================================
   PHASE 2C — CANONICAL EVENT BUS
   Emitted from inside the registry, so an action taken by the AI
   and the same action taken by you raise the identical event.
   ============================================================ */
var EVENTS=['LEAD_CREATED','LEAD_UPDATED','LEAD_CONTACTED','LEAD_QUALIFIED','LEAD_UNRESPONSIVE',
'APPOINTMENT_CREATED','APPOINTMENT_RESCHEDULED','APPOINTMENT_CANCELLED','APPOINTMENT_MISSED','APPOINTMENT_COMPLETED',
'CUSTOMER_CREATED','CUSTOMER_UPDATED','SALE_CREATED','PAYMENT_RECEIVED','INVOICE_OVERDUE','JOB_COMPLETED',
'REVIEW_REQUESTED','REVIEW_RECEIVED','CONTENT_UPLOADED','CONTENT_ANALYZED','CONTENT_POSTED',
'SOCIAL_METRICS_UPDATED','EXPENSE_CREATED','REVENUE_CREATED','TASK_CREATED','TASK_COMPLETED',
'AI_RECOMMENDATION_CREATED','AI_ACTION_COMPLETED'];

/* which action raises which event */
var ACTION_EVENT={
  createLead:'LEAD_CREATED', updateLead:'LEAD_UPDATED', addLeadNote:'LEAD_CONTACTED',
  scheduleFollowUp:'LEAD_UPDATED', createTask:'TASK_CREATED', completeTask:'TASK_COMPLETED',
  createEvent:'APPOINTMENT_CREATED', rescheduleEvent:'APPOINTMENT_RESCHEDULED', cancelEvent:'APPOINTMENT_CANCELLED',
  createExpense:'EXPENSE_CREATED', tagContent:'CONTENT_ANALYZED', recommendPost:'AI_RECOMMENDATION_CREATED',
  createInsight:'AI_RECOMMENDATION_CREATED', createSavingsOpportunity:'AI_RECOMMENDATION_CREATED',
  createContentGap:'AI_RECOMMENDATION_CREATED', createFilmingTask:'AI_RECOMMENDATION_CREATED',
  recordSocialMetrics:'SOCIAL_METRICS_UPDATED',
  createCustomer:'CUSTOMER_CREATED', updateCustomer:'CUSTOMER_UPDATED',
  convertLeadToCustomer:'CUSTOMER_CREATED',
  createAppointment:'APPOINTMENT_CREATED', rescheduleAppointment:'APPOINTMENT_RESCHEDULED',
  cancelAppointment:'APPOINTMENT_CANCELLED', completeAppointment:'APPOINTMENT_COMPLETED',
  missAppointment:'APPOINTMENT_MISSED',
  createInvoice:'SALE_CREATED', recordPayment:'PAYMENT_RECEIVED',
  sendReviewRequest:'REVIEW_REQUESTED', recordReview:'REVIEW_RECEIVED',
  logCommunication:'LEAD_CONTACTED', draftMessage:'AI_RECOMMENDATION_CREATED'
};

var handlers={};
function on(ev,fn){ (handlers[ev]=handlers[ev]||[]).push(fn); }
function emit(ev,payload){
  var s=sp();
  s.events_log.unshift({id:uid('ev'),t:new Date().toISOString(),event:ev,
    ref:(payload&&(payload.id||(payload.record&&payload.record.id)))||'',
    summary:eventSummary(ev,payload)});
  if(s.events_log.length>300) s.events_log.length=300;

  (handlers[ev]||[]).forEach(function(fn){
    try{ fn(payload||{}); }catch(e){}
  });
  /* legacy automation triggers keep working */
  var legacy={LEAD_CREATED:'lead.created',CONTENT_UPLOADED:'content.uploaded',EXPENSE_CREATED:'expense.created'};
  if(legacy[ev]){ try{ OS.fire(legacy[ev],payload||{}); }catch(e){} }
  return ev;
}
function eventSummary(ev,p){
  p=p||{};
  var r=p.record||{};
  switch(ev){
    case 'LEAD_CREATED': return 'New lead: '+(r.business||'');
    case 'CUSTOMER_CREATED': return 'New customer: '+(r.name||'');
    case 'APPOINTMENT_CREATED': return 'Booked: '+(r.title||'')+' on '+(r.date||'');
    case 'APPOINTMENT_COMPLETED': return 'Completed: '+(r.title||'');
    case 'APPOINTMENT_MISSED': return 'No-show: '+(r.title||'');
    case 'SALE_CREATED': return 'Invoice '+money(r.total)+' to '+(r.customerName||'');
    case 'PAYMENT_RECEIVED': return 'Paid '+money(r.amount)+' by '+(r.customerName||'');
    case 'REVIEW_REQUESTED': return 'Review requested from '+(r.customerName||'');
    case 'REVIEW_RECEIVED': return (r.rating?r.rating+'★ ':'')+'review from '+(r.customerName||'');
    default: return ev.toLowerCase().replace(/_/g,' ');
  }
}

/* wrap the dispatcher so every successful action emits its event */
var _run=OS.runAction;
OS.runAction=function(name,input,opts){
  opts=opts||{};
  /* The original dispatcher only understood read/recommend/write/sensitive.
     Phase 2 introduced four levels, so the permission decision is made here,
     with the new policy, and the result is handed down. Anything this policy
     does NOT allow is passed through unapproved so it still stops for you. */
  var def=OS.ACTIONS[name];
  if(def&&!opts.approved&&allowed(def.scope,name)){
    opts={approved:true,autoApproved:true};
  }
  var res=_run(name,input,opts);
  if(res&&res.ok){
    var ev=ACTION_EVENT[name];
    if(ev) emit(ev,{action:name,input:input,record:res.result,id:res.result&&res.result.id});
    emit('AI_ACTION_COMPLETED',{action:name,record:res.result});
  }
  return res;
};

function define(name,scope,desc,schema,run){

}

define('createAppointment','execute','Book an appointment and put it on the calendar.',

define('rescheduleAppointment','execute','Move an appointment.',
  {id:'string (required)',date:'YYYY-MM-DD',time:'HH:MM'},
  function(i){
    var a=findIn('appointments',i.id); if(!a) throw new Error('appointment not found');

define('completeAppointment','execute','Mark an appointment done. This is what starts the money and review flow.',
  {id:'string (required)',value:'number',notes:'string'},
  function(i){

    if(i.value!=null) a.value=num(i.value);

/* ---------- INVOICES + PAYMENTS + REVENUE ---------- */
define('createInvoice','execute','Raise an invoice for work done.',
  {customerId:'string',appointmentId:'string',service:'string (required)',
   amount:'number (required)',dueDate:'YYYY-MM-DD',notes:'string'},
  function(i){
    if(!str(i.service).trim()) throw new Error('service is required');
    if(!num(i.amount)) throw new Error('amount is required');
    var c=i.customerId?findIn('customers',i.customerId):null;
    var ap=i.appointmentId?findIn('appointments',i.appointmentId):null;
    if(!c&&ap&&ap.customerId) c=findIn('customers',ap.customerId);
    var due=str(i.dueDate);
    if(!due){ var d=new Date(); d.setDate(d.getDate()+14); due=d.toISOString().slice(0,10); }
    var inv={id:uid('in'),number:'INV-'+String(sp().invoices.length+1001),
      customerId:c?c.id:'',customerName:c?c.name:'',appointmentId:str(i.appointmentId),
      service:str(i.service),total:num(i.amount),paid:0,
      status:'open',issued:L.today(),dueDate:due,notes:str(i.notes),created:L.today()};
    sp().invoices.unshift(inv);
    return {id:inv.id,number:inv.number,total:inv.total,customerName:inv.customerName,dueDate:inv.dueDate};
  });
define('recordPayment','execute','Record money received against an invoice.',
  {invoiceId:'string (required)',amount:'number (required)',method:'string',date:'YYYY-MM-DD'},
  function(i){
    var inv=findIn('invoices',i.invoiceId); if(!inv) throw new Error('invoice not found');
    var amt=num(i.amount);
    if(!amt) throw new Error('amount is required');
    if(amt>(inv.total-inv.paid)+0.009) throw new Error('That is more than the '+money(inv.total-inv.paid)+' still outstanding.');
    var p={id:uid('pay'),invoiceId:inv.id,customerId:inv.customerId,customerName:inv.customerName,
      amount:amt,method:str(i.method)||'unspecified',date:str(i.date)||L.today(),
      service:inv.service,created:L.today()};
    sp().payments.unshift(p);
    inv.paid=Math.round((inv.paid+amt)*100)/100;
    inv.status=inv.paid>=inv.total-0.009?'paid':'partial';
    if(inv.status==='paid') inv.paidAt=p.date;
    /* the customer's lifetime value is the sum of what they have actually paid */
    if(p.customerId){
      var cust=findIn('customers',p.customerId);
      if(cust){
        cust.lifetimeValue=Math.round((num(cust.lifetimeValue)+amt)*100)/100;
        cust.lastPaid=p.date;
        cust.jobs=(num(cust.jobs)||0)+(inv.status==='paid'?1:0);
      }
    }
    emit('REVENUE_CREATED',{record:p});
    return {id:p.id,amount:p.amount,invoice:inv.number,invoiceStatus:inv.status,
      outstanding:Math.round((inv.total-inv.paid)*100)/100,customerName:p.customerName};
  });
define('voidInvoice','execute','Void an invoice.',{id:'string (required)',reason:'string'},
  function(i){
    var inv=findIn('invoices',i.id); if(!inv) throw new Error('invoice not found');
    if(inv.paid>0) throw new Error('That invoice has payments against it. Refund those first.');
    inv.status='void'; inv.voidReason=str(i.reason);
    return {voided:inv.number};
  });

/* ============================================================
   PHASE 3B — REVENUE ROLL-UPS  (computed, never stored twice)
   ============================================================ */
function revenue(){
  var s=sp(), pays=s.payments;
  var total=pays.reduce(function(a,p){ return a+num(p.amount); },0);
  var byMonth={},byService={},bySource={},byCustomer={};
  pays.forEach(function(p){
    byMonth[p.date.slice(0,7)]=(byMonth[p.date.slice(0,7)]||0)+num(p.amount);
    var svc=p.service||'Unspecified';
    byService[svc]=(byService[svc]||0)+num(p.amount);
    byCustomer[p.customerName||'Unknown']=(byCustomer[p.customerName||'Unknown']||0)+num(p.amount);
    var c=p.customerId?findIn('customers',p.customerId):null;
    var src=(c&&c.source)||'Unspecified';
    bySource[src]=(bySource[src]||0)+num(p.amount);
  });
  var open=s.invoices.filter(function(i){ return i.status==='open'||i.status==='partial'; });
  var outstanding=open.reduce(function(a,i){ return a+(num(i.total)-num(i.paid)); },0);
  var overdue=open.filter(function(i){ return i.dueDate&&i.dueDate<L.today(); });
  var custCount=Object.keys(byCustomer).length;
  var appts=s.appointments;
  var completed=appts.filter(function(a){ return a.status==='completed'; }).length;
  var booked=appts.length;
  var missed=appts.filter(function(a){ return a.status==='missed'; }).length;
  var leadsAll=DB.leads.length;
  var wonLeads=DB.leads.filter(function(l){ return l.stage==='Won'; }).length;

  return {
    total:total, byMonth:byMonth, byService:byService, bySource:bySource, byCustomer:byCustomer,
    outstanding:outstanding, overdue:overdue, openInvoices:open.length,
    avgCustomerValue:custCount?total/custCount:0,
    customers:s.customers.length,
    apptCompletionRate:booked?completed/booked:null,
    noShowRate:booked?missed/booked:null,
    leadCloseRate:leadsAll?wonLeads/leadsAll:null,
    repeatCustomers:Object.keys(byCustomer).filter(function(k){
      return s.payments.filter(function(p){ return (p.customerName||'Unknown')===k; }).length>1;
    }).length
  };
}
function reviewStats(){
  var rs=sp().custreviews;
  var got=rs.filter(function(r){ return r.status==='received'&&r.rating; });
  var req=rs.filter(function(r){ return r.status==='requested'; });
  return {
    requested:rs.length, received:got.length, pending:req.length,
    avg:got.length?got.reduce(function(a,r){ return a+num(r.rating); },0)/got.length:null,
    responseRate:rs.length?got.length/rs.length:null,
    fiveStar:got.filter(function(r){ return r.rating===5; }).length,
    lowStar:got.filter(function(r){ return r.rating<=3; }).length
  };
}

   These are what make the loop actually run.

on('APPOINTMENT_CREATED',function(p){
  var a=p.record; if(!a||!a.date) return;
  var d=new Date(a.date+'T12:00:00'); d.setDate(d.getDate()-1);
  OS.runAction('createTask',{title:'Remind '+(a.customerName||'customer')+' about '+a.title,
    due:d.toISOString().slice(0,10),priority:'important',kind:'followup',
    notes:'Appointment '+a.date+' at '+a.time});
});
on('JOB_COMPLETED',function(p){
  var a=p.record; if(!a) return;
  /* invoice the work if it has a value and none exists yet */
  var already=sp().invoices.filter(function(i){ return i.appointmentId===a.id; }).length;
  if(!already&&num(a.value)>0){
    OS.runAction('createInvoice',{customerId:a.customerId,appointmentId:a.id,
      service:a.service||a.title,amount:a.value,notes:'Raised automatically on job completion'});
  }
  /* and queue the review request as a task rather than firing it off */
  if(a.customerId){
    OS.runAction('createTask',{title:'Ask '+(a.customerName||'customer')+' for a review',
      due:L.today(),priority:'normal',kind:'admin',
      notes:'Job completed '+L.today()+'. Nothing is sent automatically.'});
  }
});
on('PAYMENT_RECEIVED',function(p){
  var pay=p.record; if(!pay||!pay.customerId) return;
  var c=findIn('customers',pay.customerId);
  if(c&&!c.reviewRequested){
    OS.runAction('createTask',{title:'Review request: '+c.name,due:L.today(),
      priority:'normal',kind:'admin',notes:'Paid '+money(pay.amount)+'. Send the request yourself.'});
  }
});
on('APPOINTMENT_MISSED',function(p){
  var a=p.record; if(!a) return;
  OS.runAction('createTask',{title:'Re-book '+(a.customerName||a.title)+' after no-show',
    due:L.today(),priority:'important',kind:'call',notes:'Missed '+a.date});
});
on('REVIEW_RECEIVED',function(p){
  var r=p.record; if(!r) return;
  if(num(r.rating)<=3){
    OS.runAction('createTask',{title:'Follow up on '+r.rating+'★ review from '+(r.customerName||'a customer'),
      due:L.today(),priority:'critical',kind:'call',notes:r.text||''});
  }
});

/* overdue invoices, once a day */
function invoiceSweep(){
  var s=sp(), td=L.today();
  s.invoices.forEach(function(i){
    if((i.status==='open'||i.status==='partial')&&i.dueDate&&i.dueDate<td&&!i.overdueFlagged){
      i.overdueFlagged=td;
      emit('INVOICE_OVERDUE',{record:i});
      OS.runAction('createTask',{title:'Chase '+i.number+' — '+money(i.total-i.paid)+' from '+(i.customerName||'customer'),
        due:td,priority:'important',kind:'admin',notes:'Was due '+i.dueDate});
    }
  });
  L.save();
}
var _sweep=OS.dailySweep;
OS.dailySweep=function(){ _sweep(); try{ invoiceSweep(); }catch(e){} };

/* ============================================================
   NONMAJORITY — AI reasoning layer
   context engine · agent loop with tools · vision · generators

(function(){
"use strict";
var L=window.LD, OS=window.LDOS, DB=L.DB;
function sp(){ return OS.space(); }
function n2(v){ return Number(v)||0; }

/* ============================================================
   CONTEXT ENGINE — structured business state, never a data dump
   ============================================================ */
function businessContext(opts){
  opts=opts||{};
  var s=sp(), mem=s.memory, cfg=OS.industryCfg(), td=L.today();
  var org=OS.orgById(DB.activeOrg)||{name:'My Business'};
  var out=[];

  out.push('BUSINESS PROFILE');
  out.push('Name: '+(mem.profile.name||org.name));
  if(mem.profile.industry) out.push('Industry: '+mem.profile.industry);
  if(mem.profile.city) out.push('Location: '+mem.profile.city);
  if(mem.profile.services) out.push('Services: '+mem.profile.services);
  if(mem.profile.products) out.push('Products: '+mem.profile.products);
  if(mem.profile.customers) out.push('Target customer: '+mem.profile.customers);
  if(mem.profile.goals) out.push('Goals: '+mem.profile.goals);
  if(mem.profile.founded) out.push('Operating since: '+mem.profile.founded);
  out.push('Industry vocabulary: a lead is a "'+cfg.leadWord+'", a sale is a "'+cfg.unit+'"');
  out.push('Typical next actions in this industry: '+cfg.actions.join(', '));
  out.push('KPIs that matter here: '+cfg.kpis.join(', '));

  out.push('\nWORKING PREFERENCES');
  out.push('Hours: '+mem.prefs.hoursStart+'–'+mem.prefs.hoursEnd+' ('+mem.prefs.days+')');
  if(mem.prefs.callWindow) out.push('Best calling window: '+mem.prefs.callWindow);
  if(mem.prefs.postPlatforms) out.push('Posts to: '+mem.prefs.postPlatforms);
  out.push('Automation level: '+OS.autoLevel()+' (sensitive actions always ask first)');

  var k=mem.knowledge;
  if(k.pricing||k.objections||k.faqs||k.policies||k.differentiators){
    out.push('\nBUSINESS KNOWLEDGE');
    if(k.pricing) out.push('Pricing: '+k.pricing);
    if(k.differentiators) out.push('Differentiators: '+k.differentiators);
    if(k.objections) out.push('Common objections: '+k.objections);
    if(k.faqs) out.push('FAQs: '+k.faqs);
    if(k.policies) out.push('Policies: '+k.policies);
  }

  /* ---- leads ---- */
  var live=DB.leads.filter(function(x){ return x.stage!=='Won'&&x.stage!=='Lost'; });
  var scored=DB.leads.map(function(x){ return {x:x,s:L.scoreLead(x).score}; })
                     .sort(function(a,b){ return b.s-a.s; });
  out.push('\nPIPELINE ('+DB.leads.length+' total, '+live.length+' live)');
  L.STAGES.forEach(function(st){
    var n=DB.leads.filter(function(x){ return x.stage===st; }).length;
    if(n) out.push('  '+st+': '+n);
  });
  var val=live.filter(function(x){ return ['Interested','Proposal','Negotiating'].indexOf(x.stage)>-1; })
              .reduce(function(a,x){ return a+n2(x.value); },0);
  out.push('  Open pipeline value: '+L.money(val));
  out.push('  Won value: '+L.money(DB.leads.filter(function(x){ return x.stage==='Won'; })
                                            .reduce(function(a,x){ return a+n2(x.value); },0)));

  var top=scored.filter(function(o){ return ['Won','Lost'].indexOf(o.x.stage)<0; })
                .slice(0,opts.leads||18);
  if(top.length){
    out.push('\nLEADS (id | name | score | stage | website | booking | last contact | next follow-up)');
    top.forEach(function(o){
      var x=o.x;
      out.push('  '+x.id+' | '+(x.business||'Untitled')+' | '+o.s+' | '+x.stage+
        ' | '+L.labelOf(L.WEB,x.web)+' | '+L.labelOf(L.BOOK,x.book)+
        ' | '+(x.lastContacted||'never')+' | '+(x.nextFollow||'none')+
        (x.city?' | '+x.city:'')+(x.value?' | '+L.money(x.value):'')+
        (x.notes&&x.notes.length?' | last note: '+x.notes[0].text.slice(0,80):''));
    });
  }
  var overdue=live.filter(function(x){ return x.nextFollow&&x.nextFollow<td; });
  var noTouch=live.filter(function(x){ return x.callStatus==='Not called'; });
  var stale=live.filter(function(x){ return x.lastContacted&&L.daysBetween(x.lastContacted,td)>=14; });
  out.push('\nLEAD ALERTS');
  out.push('  Overdue follow-ups: '+overdue.length+(overdue.length?' ('+overdue.slice(0,6).map(function(x){ return x.business; }).join(', ')+')':''));
  out.push('  Never contacted: '+noTouch.length);
  out.push('  Stale 14+ days: '+stale.length);

  /* ---- customers ---- */
  if(s.customers&&s.customers.length){
    out.push('\nCUSTOMERS ('+s.customers.length+' total, id | name | phone | status | last seen)');
    s.customers.slice(0,60).forEach(function(c){
      out.push('  '+c.id+' | '+(c.name||'Untitled')+' | '+(c.phone||'—')+' | '+(c.status||'active')+' | '+(c.lastSeen||c.firstSeen||'—'));
    });
    var noContactDays=14;
    var custStale=s.customers.filter(function(c){
      var last=c.lastSeen||c.firstSeen; if(!last) return true;
      return L.daysBetween(last,td)>=noContactDays;
    });
    out.push('  Not contacted in '+noContactDays+'+ days: '+custStale.length+
      (custStale.length?' ('+custStale.slice(0,6).map(function(c){ return c.name; }).join(', ')+')':''));
  } else out.push('\nCUSTOMERS: none yet.');

  /* ---- schedule ---- */
  var todayEv=(DB.events||[]).filter(function(e){ return e.date===td; })
                      .sort(function(a,b){ return OS.toMin(a.time)-OS.toMin(b.time); });
  var upcomingEv=(DB.events||[]).filter(function(e){ return e.date>td; })
                      .sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:OS.toMin(a.time)-OS.toMin(b.time)); });
  var openTasks=s.tasks.filter(function(t){ return !t.done; });
  out.push('\nSCHEDULE');
  out.push('  Calendar events today: '+todayEv.length);
  todayEv.forEach(function(e){ out.push('    '+e.time+' '+e.title+' ('+(e.kind||'event')+', id '+e.id+')'); });
  out.push('  Upcoming calendar events (next 7, id | date | time | title):');
  upcomingEv.slice(0,7).forEach(function(e){ out.push('    '+e.id+' | '+e.date+' | '+e.time+' | '+e.title); });
  out.push('  Open tasks: '+openTasks.length+', due today or overdue: '+
    openTasks.filter(function(t){ return t.due<=td; }).length);
  openTasks.filter(function(t){ return t.due<=td; }).slice(0,10).forEach(function(t){
    out.push('    ['+t.priority+'] '+t.title+' (due '+t.due+', id '+t.id+')');
  });

  /* ---- appointments ---- */
  if(s.appointments&&s.appointments.length){
    var apBooked=s.appointments.filter(function(a){ return a.status==='booked'&&a.date>=td; })
      .sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:OS.toMin(a.time)-OS.toMin(b.time)); });
    out.push('\nAPPOINTMENTS ('+s.appointments.length+' total, '+apBooked.length+' upcoming and booked)');
    out.push('  Upcoming (id | date | time | title | customer | status):');
    apBooked.slice(0,10).forEach(function(a){
      out.push('    '+a.id+' | '+a.date+' | '+a.time+' | '+a.title+' | '+(a.customerName||'—')+' | '+a.status);
    });
  } else out.push('\nAPPOINTMENTS: none yet.');

  /* ---- money ---- */
  if(s.expenses.length){
    var months={};
    s.expenses.forEach(function(e){ var m=e.date.slice(0,7); months[m]=(months[m]||0)+n2(e.amount); });
    var cats={};
    s.expenses.forEach(function(e){ cats[e.category]=(cats[e.category]||0)+n2(e.amount); });
    var rec=s.expenses.filter(function(e){ return e.recurring; });
    out.push('\nEXPENSES ('+s.expenses.length+' recorded)');
    Object.keys(months).sort().slice(-4).forEach(function(m){ out.push('  '+m+': '+L.money(months[m])); });
    out.push('  By category: '+Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; })
      .slice(0,10).map(function(c){ return c+' '+L.money(cats[c]); }).join(', '));
    out.push('  Recurring: '+rec.length+' totalling '+L.money(rec.reduce(function(a,e){ return a+n2(e.amount); },0))+'/period');
    out.push('  Vendors: '+Object.keys(s.expenses.reduce(function(a,e){ a[e.vendor]=1; return a; },{})).slice(0,20).join(', '));
    out.push('  Recent (id | vendor | amount | category | date | recurring):');
    s.expenses.slice(0,14).forEach(function(e){
      out.push('    '+e.id+' | '+e.vendor+' | '+L.money(e.amount)+' | '+e.category+' | '+e.date+' | '+(e.recurring?'yes':'no'));
    });
  } else out.push('\nEXPENSES: none recorded yet.');

  /* ---- content ---- */
  out.push('\nCONTENT VAULT ('+s.assets.length+' assets)');
  if(s.assets.length){
    var byStatus={};
    s.assets.forEach(function(a){ byStatus[a.status]=(byStatus[a.status]||0)+1; });
    out.push('  Status: '+Object.keys(byStatus).map(function(k){ return k+' '+byStatus[k]; }).join(', '));
    s.assets.slice(0,20).forEach(function(a){
      out.push('    '+a.id+' | '+a.name+' | '+a.kind+' | '+(a.seconds?a.seconds+'s':'')+
        ' | '+a.status+' | '+(a.category||'uncategorised')+
        (a.tags&&a.tags.length?' | tags: '+a.tags.join(', '):'')+
        (a.quality?' | quality '+a.quality+'/10':''));
    });
  } else out.push('  Nothing uploaded yet.');

  if(s.posts.length){
    out.push('\nPOSTS ('+s.posts.length+')');
    s.posts.slice(0,12).forEach(function(p){
      out.push('  '+p.id+' | '+p.platform+' | '+p.status+' | '+p.date+' | '+(p.hook||'').slice(0,60));
    });
  }

  /* ---- social ---- */
  if(s.metrics.length){
    var plat={};
    s.metrics.forEach(function(m){
      var p=plat[m.platform]=plat[m.platform]||{views:0,likes:0,comments:0,shares:0,saves:0,n:0,followers:0};
      p.views+=n2(m.views); p.likes+=n2(m.likes); p.comments+=n2(m.comments);
      p.shares+=n2(m.shares); p.saves+=n2(m.saves); p.followers+=n2(m.followers); p.n++;
    });
    out.push('\nSOCIAL PERFORMANCE (owner-entered, '+s.metrics.length+' records)');
    Object.keys(plat).forEach(function(k){
      var p=plat[k];
      var eng=p.views?((p.likes+p.comments+p.shares+p.saves)/p.views*100).toFixed(1)+'%':'n/a';
      out.push('  '+k+': '+p.n+' records, '+p.views.toLocaleString()+' views, engagement '+eng+
        ', +'+p.followers+' followers');
    });
    out.push('  Recent records:');
    s.metrics.slice(0,10).forEach(function(m){
      out.push('    '+m.date+' '+m.platform+(m.label?' "'+m.label+'"':'')+
        ' views '+m.views+' likes '+m.likes+' comments '+m.comments+' shares '+m.shares+' saves '+m.saves);
    });
  } else out.push('\nSOCIAL PERFORMANCE: no numbers connected yet. Do not estimate any.');

  if(s.insights.length){
    out.push('\nOPEN INSIGHTS: '+s.insights.filter(function(i){ return i.status==='open'; }).length);
  }
  if(s.savings.length){
    var open=s.savings.filter(function(x){ return x.status==='open'; });
    out.push('OPEN SAVINGS IDEAS: '+open.length+' worth up to '+
      L.money(open.reduce(function(a,x){ return a+n2(x.monthly); },0))+'/mo');
  }
  if(s.filming.length){
    out.push('FILMING LIST: '+s.filming.filter(function(f){ return f.status==='open'; }).length+' open');
  }
  out.push('\nTODAY IS '+td+'.');
  return out.join('\n');
}

/* ============================================================
   AGENT LOOP — the AI calls real tools against real data
   ============================================================ */
/* runs the model with tools until it stops calling them */
function agent(o){
  var msgs=(o.messages||[]).slice();
  var sys=(o.system||GROUND)+'\n\n'+businessContext(o.ctx||{});
  var toolNames=o.tools||Object.keys(OS.ACTIONS);
  var used=[], hops=0, MAX=o.maxHops||5, lastText='';

  function step(){
    hops++;
    if(hops>MAX){ o.onDone(lastText||'Stopped after '+MAX+' steps.',used); return; }
    window.LDNET.chat({
      task:o.task||'reason',
      feature:o.feature||'agent',
      system:sys,
      messages:msgs,
      tools:OS.openaiTools(toolNames),
      maxTokens:o.maxTok||2000
    }).then(function(r){
      if(r.text) lastText=r.text;
      if(!r.toolCalls.length){ o.onDone(r.text||lastText||'',used); return; }
      msgs.push(r.assistantMsg);
      var results=r.toolCalls.map(function(c){
        var res=OS.runAction(c.name,c.args);
        used.push({name:c.name,args:c.args,res:res});
        return res.ok?res.result:{error:res.error,pending:!!res.pending};
      });
      msgs=msgs.concat(window.LDNET.toolResultMessages(r.shape,r.toolCalls,results));
      step();
    }).catch(function(e){ o.onErr(String(e.message||e)); });
  }
  step();
}

/* plain completion, no tools */
function ask(system,user,onDone,onErr,maxTok,withCtx,task,feature){
  var full=(system||GROUND)+(withCtx===false?'':'\n\n'+businessContext({}));
  window.LDNET.chat({
    task:task||'reason', feature:feature||'ask',
    system:full, messages:[{role:'user',content:user}], maxTokens:maxTok||1800
  }).then(function(r){
    if(!r.text) throw new Error('The AI returned an empty response.');
    onDone(r.text);
  }).catch(function(e){ onErr(String(e.message||e)); });
}

function vision(dataUrl,system,prompt,onDone,onErr,maxTok,feature){
  window.LDNET.chat({
    task:'vision', feature:feature||'vision',

}
function firstJSON(txt){
  var t=String(txt).replace(/```json|```/g,'').trim();
  var i=t.indexOf('{'), j=t.lastIndexOf('}');
  var k=t.indexOf('['), m=t.lastIndexOf(']');
  if(k>-1&&(k<i||i===-1)){ i=k; j=m; }
  if(i<0||j<i) return null;
  try{ return JSON.parse(t.slice(i,j+1)); }catch(e){ return null; }
}

function analyzeAsset(id,onDone,onErr){
  var a=sp().assets.filter(function(x){ return x.id===id; })[0];
  if(!a) return onErr&&onErr('asset not found');
  if(!a.thumb) return onErr&&onErr('no preview frame to analyse');
  var cfg=OS.industryCfg(), mem=sp().memory.profile;
  var system='You analyse a single frame from a business\'s content library and return JSON only. '+
    'Describe only what is actually visible. Never invent products, people, text or branding you cannot see. '+
    'The business is: '+(mem.name||'unknown')+(mem.industry?', industry '+mem.industry:'')+
    (mem.services?', services: '+mem.services:'')+'.';
  var prompt='Return ONLY this JSON, no prose, no code fences:\n'+
    '{"description":"one sentence on what is visible",ّ"tags":["5-8 short tags"],'+
    '"category":"one of: product, service, before-after, testimonial, behind-the-scenes, educational, promo, team, location, other",'+
    '"topic":"what it is about in 2-4 words",'+
    '"platforms":["which of Instagram, TikTok, Facebook, YouTube Shorts this suits"],'+
    '"quality":1-10 integer for how usable this looks as marketing content,'+
    '"notes":"one short line on how to use it or what is weak about it"}'.replace('ّ','');
  vision(a.thumb,system,prompt,function(out){
    var j=firstJSON(out);
    if(!j){ if(onErr) onErr('Could not read the analysis.'); return; }
    OS.runAction('tagContent',{id:a.id,tags:j.tags,description:j.description,category:j.category,
      platforms:j.platforms,quality:j.quality,topic:j.topic});
    if(j.notes) a.aiNotes=j.notes;
    a.status='Ready';
    L.save();
    if(onDone) onDone(a);
  },function(e){ if(onErr) onErr(e); },900,'content_analysis');
}

function readMetricsShot(dataUrl,platformHint,onDone,onErr){
  var system='You read analytics screenshots and return JSON only. Transcribe only numbers you can actually see. '+
    'Never estimate, never fill a field you cannot read. Use null for anything not visible.';
  var prompt='Read this analytics screenshot'+(platformHint?' from '+platformHint:'')+'.\n'+
    'Return ONLY a JSON array, one object per post or per period shown:\n'+
    '[{"platform":"Instagram|TikTok|Facebook|YouTube Shorts|other",ّ"label":"post name or period label if shown",'+
    '"date":"YYYY-MM-DD or null","views":n,"reach":n,"likes":n,"comments":n,"shares":n,"saves":n,'+
    '"followers":n,"clicks":n,"watchSec":n}]\n'+
    'Convert 1.2K to 1200 and 3.4M to 3400000. Use null where the number is not visible.'.replace('ّ','');
  vision(dataUrl,system,prompt,function(out){
    var j=firstJSON(out);
    if(!j) return onErr('Could not read numbers from that screenshot.');
    var rows=[].concat(j), added=[];
    rows.forEach(function(r){
      if(!r||!r.platform) return;
      var clean={platform:r.platform,label:r.label||'',date:r.date||L.today()};
      ['views','reach','likes','comments','shares','saves','followers','clicks','watchSec'].forEach(function(k){
        clean[k]=(r[k]==null)?0:Number(r[k])||0;
      });
      var res=OS.runAction('recordSocialMetrics',clean);
      if(res.ok) added.push(res.result);
    });
    onDone(added);
  },onErr,1400,'social_screenshot');
}

function parseStatement(text,onDone,onErr){
  var system='You turn pasted bank or card statement text into structured expense rows. '+
    'Transcribe only rows actually present. Never invent a vendor or an amount. Ignore credits, refunds and payments to the card.';
  var prompt='Return ONLY a JSON array:\n'+
    '[{"vendor":"merchant name cleaned up","amount":number,"date":"YYYY-MM-DD",'+
    '"category":"best guess from: Software, Phone & internet, Fuel, Materials & tools, Insurance, '+
    'Equipment rental, Advertising, Supplies, Fees & payroll, Shipping, Meals, Licenses & taxes, Other",'+
    '"recurring":true or false based on whether it looks like a subscription}]\n\nSTATEMENT:\n'+text;
  L.callAIx(system,[{role:'user',content:prompt}],function(out){
    var j=firstJSON(out);
    if(!j) return onErr('Could not find any rows in that.');
    var rows=[].concat(j), added=0;
    rows.forEach(function(r){
      if(!r||!r.vendor||!r.amount) return;
      var res=OS.runAction('createExpense',r);
      if(res.ok){ added++; OS.fire('expense.created',{expense:sp().expenses[0]}); }
    });
    onDone(added);
  },onErr,2500,'fast','expense_statement');
}

/* ============================================================
   CALL COACH
   ============================================================ */
var SRec=null, listening=false;
function speechOK(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function paintMic(){
  var b=$('#micBtn'); if(!b) return;
  b.textContent=listening?'■  Stop dictation':'🎙  Dictate the call';
  b.classList.toggle('pri',listening);
}
function startDictation(){
  var C=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!C){ L.toast('This browser will not dictate — paste or upload instead'); return; }
  try{
    SRec=new C();
    SRec.continuous=true; SRec.interimResults=true; SRec.lang='en-US';
    var base=(($('#coachText')||{}).value||'');
    if(base&&!/\s$/.test(base)) base+=' ';
    SRec.onresult=function(e){
      var fin='',int='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) fin+=e.results[i][0].transcript+' ';
        else int+=e.results[i][0].transcript;
      }
      if(fin) base+=fin;
      var el=$('#coachText');
      if(el){ el.value=base+int; state.coachText=el.value; el.scrollTop=el.scrollHeight; }
    };
    SRec.onerror=function(ev){
      listening=false; paintMic();
      L.toast(ev.error==='not-allowed'?'Microphone blocked — allow it in Safari settings':'Dictation stopped');
    };
    SRec.onend=function(){ if(listening){ try{ SRec.start(); }catch(e){} } };
    SRec.start(); listening=true; paintMic();
    L.toast('Listening — talk normally');
  }catch(e){ L.toast('Could not start the microphone'); }
}
function stopDictation(){
  listening=false;
  if(SRec){ try{ SRec.stop(); }catch(e){} }
  paintMic();
  var el=$('#coachText'); if(el){ el.value=el.value.trim(); state.coachText=el.value; }
}
function transcribeFile(file){
  state.coachBusy='Transcribing the recording…'; L.render();
  window.LDNET.transcribe(file,file.name||'call.m4a').then(function(text){
    DB.coachTx=text;
    state.coachBusy=false; L.save(); L.render();
    L.toast('Transcribed — now grade it');
  }).catch(function(e){
    state.coachBusy=false; L.render(); L.toast(String(e.message||e).slice(0,90));
  });
}
