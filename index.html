/* ---------- banner + quick toggle ---------- */
function mountBanner(){
  var b=document.getElementById('demoBanner');
  if(isOn()){
    if(!b){
      b=document.createElement('div');
      b.id='demoBanner'; b.className='demobanner';
      b.innerHTML='<span>🔒 DEMO MODE — private information protected</span>'+
        '<button data-goto="settings.privacy">Settings</button>';
      document.body.appendChild(b);
    }
    document.documentElement.setAttribute('data-demo','on');
  } else {
    if(b&&b.parentNode) b.parentNode.removeChild(b);
    document.documentElement.removeAttribute('data-demo');
  }
}
function mountQuickToggle(){
  var row=document.querySelector('.topbar .row');
  if(!row) return;
  var btn=row.querySelector('#demoQuick');
  if(!btn){
    btn=document.createElement('button');
    btn.className='btn sm ghost'; btn.id='demoQuick'; btn.title='Privacy';
    var search=row.querySelector('#globalSearch');
    if(search) row.insertBefore(btn,search); else row.appendChild(btn);
  }
  btn.innerHTML=isOn()?'🔒':'🔓';
  btn.classList.toggle('pri',isOn());
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;

  if(t.id==='startDemo'||t.id==='demoQuick'&&!isOn()){
    startDemo(); L.toast('Demo Mode on — safe to present'); return;
  }
  if(t.id==='endDemo'||(t.id==='demoQuick'&&isOn())){
    if(locked()){
      L.modal('<h3>Demo Lock is on</h3>'+
        '<p class="lede">Turning Demo Mode off puts your real business data back on screen. '+
        'If you are still sharing your screen, do not do this yet.</p>'+
        '<div class="foot"><button class="btn" data-close>Stay in Demo Mode</button>'+
        '<button class="btn danger" id="forceEnd">Show real data</button></div>');
      return;
    }
    L.modal('<h3>End the presentation?</h3>'+
      '<p class="lede">Your real business data goes back on screen straight away.</p>'+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn danger" id="forceEnd">End presentation</button></div>');
    return;
  }
  if(t.id==='forceEnd'){ L.closeModal(); endDemo(); L.toast('Back to your real data'); return; }

  if(t.dataset.demolock){ P().lock=!P().lock; L.save(); L.render();
    L.toast(P().lock?'Demo Lock on':'Demo Lock off'); return; }

  if(t.id==='resetDemo'){
    L.modal('<h3>Reset demo environment?</h3>'+
      '<p class="lede">This rebuilds the demo business from scratch. Your real business data will not be affected.</p>'+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn pri" id="doResetDemo">Reset</button></div>');
    return;
  }
  if(t.id==='doResetDemo'){ L.closeModal(); resetDemoData(); L.toast('Demo data rebuilt'); return; }

  if(t.id==='runPrivacyCheck'){
    var r=privacyCheck();

    if(r.safe){
      box.innerHTML='<div class="warnbox" style="background:color-mix(in srgb,var(--acc-mint) 12%,transparent);'+
        'border-color:color-mix(in srgb,var(--acc-mint) 34%,transparent)">'+
        '<b style="color:var(--acc-mint)">🟢 Safe to present.</b><br>Checked: '+esc(r.checked.join(', '))+'.</div>';

            '<p class="hint" style="margin-top:4px">'+esc(i.fix)+'</p></div>';

function store(){
  var s=sp();

}
function rec(id){
  var st=store();
  if(!st[id]) st[id]={id:id,status:'not_connected',account:'',lastSync:'',lastError:'',
    scopes:[],connectedAt:'',hint:''};
  return st[id];
}
function setStatus(id,status,extra){
  var r=rec(id);

  OS.logAI({action:'integration.'+status,tool:id,scope:'read',ok:true,
    summary:PROVIDERS_BY_ID[id]?PROVIDERS_BY_ID[id].name+' → '+label(status):id});
  L.save();
}
function label(s){
  return {not_connected:'Not connected',setup_required:'Setup required',connecting:'Connecting',
    connected:'Connected',syncing:'Syncing',sync_error:'Sync error',
    auth_expired:'Authorisation expired',permission_required:'Permission required',
    disconnected:'Disconnected',blocked:'Needs provider approval'}[s]||s;
}
function pillClass(s){
  if(s==='connected') return 'good';
  if(s==='sync_error'||s==='auth_expired') return 'bad';
  if(s==='setup_required'||s==='permission_required'||s==='blocked') return 'high';

}

/* ---------- live status, honestly derived ---------- */
function statusOf(p){
  var r=rec(p.id);
  if(p.id==='csv') return 'connected';
  if(p.id==='backup') return (window.LDNET&&LDNET.gatewayReady())?'connected':'setup_required';
  if(p.gateway){
    if(!(window.LDNET&&LDNET.gatewayReady())) return 'setup_required';
    return r.status==='connected'?'connected':'setup_required';
  }
  if(p.status==='needs_approval') return r.status==='connected'?'connected':'blocked';
  if(p.status==='needs_backend'||p.status==='not_built') return 'setup_required';
  return r.status||'not_connected';
}
function canTest(p){ return p.gateway&&window.LDNET&&LDNET.gatewayReady(); }

/* ============================================================
   NONMAJORITY — TOPOGRAPHIC DESIGN LANGUAGE
   Contour lines as the signature element, an AI status that
   reads as a system indicator, and the operational greeting.
   ============================================================ */
(function(){
"use strict";
var L=window.LD, OS=window.LDOS, IA=window.LDIA, BIZ=window.LDBIZ, DB=L.DB, $=L.$, esc=L.esc;
function sp(){ return OS.space(); }

/* ---------- deterministic terrain, so the page never reshuffles ---------- */
function hash(x,y){ var n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,y){
  var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  var u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return hash(xi,yi)*(1-u)*(1-v)+hash(xi+1,yi)*u*(1-v)+
         hash(xi,yi+1)*(1-u)*v+hash(xi+1,yi+1)*u*v;
}
function fbm(x,y){
  var s=0,a=.5,f=1;
  for(var i=0;i<4;i++){ s+=vnoise(x*f,y*f)*a; f*=2.02; a*=.5; }
  return s;
}

/* Contour lines drawn as stacked ridge paths. Low contrast by design —
   they should register as material, not as decoration. */
function contourSVG(o){
  o=o||{};
  var W=o.w||1600, H=o.h||900, lines=o.lines||26;
  var stroke=o.stroke||'rgba(40,37,33,0.055)';
  var seed=o.seed||0;
  var paths=[];
  for(var i=0;i<lines;i++){
    var t=i/lines;
    var base=H*(0.16+t*0.86);
    var amp=(1-t)*H*0.10+H*0.018;
    var d='M -20 '+base.toFixed(1);
    for(var x=0;x<=W+20;x+=W/64){
      var n=fbm((x/W)*3.1+seed, t*3.4+seed*0.7);
      var y=base - (n-0.5)*amp*2 - Math.sin((x/W)*3.14159*1.6+t*2.2)*amp*0.42;
      d+=' L '+x.toFixed(1)+' '+y.toFixed(1);
    }
    var op=(0.28+0.72*(1-t)).toFixed(2);
    paths.push('<path d="'+d+'" fill="none" stroke="'+stroke+'" stroke-width="'+
      (t<0.35?1.1:0.85).toFixed(2)+'" opacity="'+op+'"/>');
  }
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
    paths.join('')+'</svg>';
  return 'url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';
}

function applyTopo(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var stroke=dark?'rgba(240,235,225,0.045)':'rgba(40,37,33,0.055)';
  document.documentElement.style.setProperty('--topo',contourSVG({stroke:stroke,seed:3.7}));
}

/* ---------- AI operating status ---------- */
function ringsSVG(){
  return '<svg class="rings" viewBox="0 0 16 16">'+
    '<path d="M2 8a6 6 0 0 1 12 0"/>'+
    '<path d="M4 9.5a4 4 0 0 1 8 0"/>'+
    '<path d="M6 11a2 2 0 0 1 4 0"/></svg>';
}
function aiBusy(){

            L.state.expBusy||L.state.planBusy||L.state.filmBusy||L.state.gapBusy||
            L.state.socialBusy||L.state.chatBusy||L.state.vaultBusy);
}
function aiStatus(){
  var ready=window.LDNET&&LDNET.mode()!=='none';
  var busy=aiBusy();
  var text=!ready?'AI OFFLINE':(busy?'AI WORKING':'AI OPERATING');
  return '<span class="aistatus'+(busy?' busy':'')+'">'+ringsSVG()+text+'</span>';
}

/* ---------- operational summary, built from real records ---------- */
function summaryLines(){
  var s=sp(), td=L.today(), out=[];
  var live=DB.leads.filter(function(l){ return l.stage!=='Won'&&l.stage!=='Lost'; });
  var hot=live.filter(function(l){ return L.scoreLead(l).score>=90; }).length;
  var untouched=live.filter(function(l){ return l.callStatus==='Not called'; }).length;
  var overdue=live.filter(function(l){ return l.nextFollow&&l.nextFollow<td; }).length;
  var tasksDue=s.tasks.filter(function(t){ return !t.done&&t.due<=td; }).length;
  var appts=s.appointments.filter(function(a){ return a.date===td&&a.status==='booked'; }).length;
  var ready=s.assets.filter(function(a){ return a.status==='Ready'; }).length;
  var unpaid=s.invoices.filter(function(i){ return (i.status==='open'||i.status==='partial')&&i.dueDate<td; });
  var pend=OS.pending().length;

  if(pend) out.push(pend+' action'+(pend===1?'':'s')+' waiting on your approval.');
  if(hot) out.push(hot+' lead'+(hot===1?' is':'s are')+' scoring above 90.');
  if(untouched) out.push(untouched+' lead'+(untouched===1?' has':'s have')+' never been contacted.');
  if(overdue) out.push(overdue+' follow-up'+(overdue===1?' is':'s are')+' overdue.');
  if(appts) out.push(appts+' appointment'+(appts===1?'':'s')+' on the calendar today.');
  if(tasksDue) out.push(tasksDue+' task'+(tasksDue===1?' is':'s are')+' due.');
  if(unpaid.length) out.push(L.money(unpaid.reduce(function(a,i){
    return a+(Number(i.total||0)-Number(i.paid||0)); },0))+' is past due across '+unpaid.length+' invoice'+(unpaid.length===1?'':'s')+'.');
  if(ready) out.push(ready+' piece'+(ready===1?'':'s')+' of content ready to post.');
  if(!out.length) out.push('Nothing needs you right now.');
  return out.slice(0,4);
}
function greeting(){
  var h=new Date().getHours();
  return h<12?'Good morning':h<18?'Good afternoon':'Good evening';

      '<button class="btn sm" data-askai="command">Ask AI</button>'+
      '<button class="btn sm" data-goto="command.priorities">Today\'s priorities</button>'+
    '</div></div></div>';
}

/* ---------- elevation bar, the small-chart primitive ---------- */
function elevation(value,max,bars){
  bars=bars||12; max=max||100;
  var filled=Math.round((Math.max(0,Math.min(max,value))/max)*bars);
  var out='<div class="elev">';
  for(var i=0;i<bars;i++){
    var h=28+Math.round(Math.abs(Math.sin(i*0.9))*46)+i*2;
    out+='<i class="'+(i<filled?'on':'')+'" style="height:'+Math.min(100,h)+'%"></i>';
  }
  return out+'</div>';
}

/* ---------- weave a few surfaces, not all of them ---------- */
function applyWeave(){
  ['.mtnhead','.scorebox','.greet'].forEach(function(sel){
    L.$$(sel).forEach(function(el){ el.classList.add('weave'); });
  });
}

/* ---------- decorate after every paint ----------
   The router calls its own internal render, so hooking L.render alone
   misses navigation. Wrapping both covers every path. */
function decorate(){
  applyTopo();
  var cur=IA&&IA.currentPage?IA.currentPage():null;
  if(cur&&cur.sec.id==='command'&&cur.pg.id==='overview'){
    var head=document.querySelector('#view .mtnhead');
    if(head&&!document.querySelector('.greet')){
      head.insertAdjacentHTML('afterend',greetBlock());

var prevRender=L.render;
L.render=function(){ prevRender.apply(this,arguments); decorate(); };
if(IA&&IA.goto){
  var prevGoto=IA.goto;
  IA.goto=function(a,b){ prevGoto(a,b); decorate(); };
  L.goto=IA.goto;
}
setTimeout(function(){ applyTopo(); decorate(); },80);

window.LDT={contourSVG:contourSVG,applyTopo:applyTopo,aiStatus:aiStatus,
  summaryLines:summaryLines,greetBlock:greetBlock,elevation:elevation};
})();

/* ============================================================
   NONMAJORITY — SUBSCRIPTIONS + CALENDLY
   ============================================================ */
(function(){
"use strict";
var L=window.LD, OS=window.LDOS, IA=window.LDIA, BIZ=window.LDBIZ, DB=L.DB,
    state=L.state, $=L.$, $$=L.$$, esc=L.esc;
function sp(){ return OS.space(); }
function n2(v){ return Number(v)||0; }
function store(){ var s=sp(); if(!s.subs) s.subs=[]; return s.subs; }

/* ============================================================
   1. SUBSCRIPTIONS — recurring auto-pay charges
   ============================================================ */
var CYCLES=[['monthly','Monthly',1],['quarterly','Quarterly',3],['yearly','Yearly',12],
            ['weekly','Weekly',0.23]];
function cycleMonths(c){
  for(var i=0;i<CYCLES.length;i++) if(CYCLES[i][0]===c) return CYCLES[i][2];
  return 1;
}
function monthlyCost(s){ return n2(s.amount)/cycleMonths(s.cycle); }
function annualCost(s){ return monthlyCost(s)*12; }

function nextCharge(s){
  if(!s.firstCharge) return '';
  var months=cycleMonths(s.cycle);
  var d=new Date(s.firstCharge+'T12:00:00');
  if(isNaN(d)) return '';
  var today=new Date(L.today()+'T12:00:00');
  if(s.cycle==='weekly'){
    while(d<today) d.setDate(d.getDate()+7);
  } else {
    var guard=0;
    while(d<today&&guard++<400) d.setMonth(d.getMonth()+Math.max(1,Math.round(months)));
  }
  return d.toISOString().slice(0,10);
}
function daysUntil(iso){ return iso?L.daysBetween(L.today(),iso):null; }

OS.ACTIONS.createSubscription={
  name:'createSubscription',scope:'draft',
  desc:'Record a recurring auto-pay subscription.',
  schema:{vendor:'string (required)',amount:'number (required)',
    cycle:'monthly|quarterly|yearly|weekly',firstCharge:'YYYY-MM-DD',
    category:'string',method:'string',purpose:'string',cancelUrl:'string'},
  run:function(i){
    if(!String(i.vendor||'').trim()) throw new Error('vendor is required');
    if(!n2(i.amount)) throw new Error('amount is required');
    var s={id:OS.uid('sub'),vendor:String(i.vendor),amount:n2(i.amount),
      cycle:['monthly','quarterly','yearly','weekly'].indexOf(i.cycle)>-1?i.cycle:'monthly',
      firstCharge:String(i.firstCharge||L.today()),
      category:String(i.category||OS.guessCategory(i.vendor)||'Software'),
      method:String(i.method||''),purpose:String(i.purpose||''),
      cancelUrl:String(i.cancelUrl||''),status:'active',created:L.today(),
      lastLogged:''};
    store().unshift(s);
    return {id:s.id,vendor:s.vendor,monthly:Math.round(monthlyCost(s)*100)/100};
  }
};
OS.ACTIONS.cancelSubscription={
  name:'cancelSubscription',scope:'draft',
  desc:'Mark a subscription cancelled so it stops counting against your spend.',
  schema:{id:'string (required)'},
  run:function(i){
    var s=store().filter(function(x){ return x.id===i.id; })[0];
    if(!s) throw new Error('subscription not found');
    s.status='cancelled'; s.cancelledAt=L.today();
    return {vendor:s.vendor,saved:Math.round(monthlyCost(s)*100)/100};
  }
};
if(OS.SCOPE_OF){ OS.SCOPE_OF.createSubscription='draft'; OS.SCOPE_OF.cancelSubscription='draft'; }

/* logging a charge writes a real expense, so spending stays in one place */
function logCharge(id,dateOverride){
  var s=store().filter(function(x){ return x.id===id; })[0];
  if(!s) return;
  var when=dateOverride||nextCharge(s)||L.today();
  var res=OS.runAction('createExpense',{vendor:s.vendor,amount:s.amount,date:when,
    category:s.category,method:s.method,purpose:s.purpose||'Subscription charge'});
  if(res.ok){
    var e=sp().expenses[0];
    if(e){ e.recurring=true; e.subId=s.id; }
    s.lastLogged=when;
    L.save();
    L.toast('Logged '+L.money(s.amount)+' to '+s.vendor);
  }
  L.render();
}

/* the daily sweep flags charges that are due */
var _sweep=OS.dailySweep;
OS.dailySweep=function(){
  _sweep();
  var td=L.today();
  store().forEach(function(s){
    if(s.status!=='active') return;
    var due=nextCharge(s);
    var d=daysUntil(due);
    if(d!==null&&d<=3&&d>=0&&s.warned!==due){
      s.warned=due;
      OS.runAction('createTask',{title:s.vendor+' renews '+(d===0?'today':'in '+d+' day'+(d===1?'':'s')),
        due:due,priority:'normal',kind:'admin',
        notes:L.money(s.amount)+' '+s.cycle+'. Cancel before this date if you no longer use it.'});
    }
  });
  L.save();
};

/* ---------- view ---------- */
function vSubs(){
  var list=store(), active=list.filter(function(s){ return s.status==='active'; });
  var h='<div class="wrap">';
  h+='<div class="sect-h"><h2>Subscriptions</h2><span class="n">'+active.length+' active</span>'+
     '<div style="flex:1"></div><button class="btn sm pri" id="addSub">Add subscription</button></div>';

  if(!list.length){
    return h+'<div class="empty" style="margin-top:14px"><b>Nothing tracked yet</b>'+
      'Log every auto-pay charge here and the CRM tells you what renews next, what it costs a year, '+
      'and reminds you before it bills.'+
      '<button class="btn pri" id="addSub2">Add your first subscription</button></div></div>';
  }

  var mo=active.reduce(function(a,s){ return a+monthlyCost(s); },0);
  var yr=active.reduce(function(a,s){ return a+annualCost(s); },0);
  var soon=active.map(function(s){ return {s:s,d:daysUntil(nextCharge(s))}; })
    .filter(function(o){ return o.d!==null&&o.d<=14; })
    .sort(function(a,b){ return a.d-b.d; });

  h+='<div class="stats">'+
    '<div class="stat"><b>'+active.length+'</b><span>Active</span></div>'+
    '<div class="stat money"><b>'+L.money(mo)+'</b><span>Per month</span></div>'+
    '<div class="stat money"><b>'+L.money(yr)+'</b><span>Per year</span></div>'+
    '<div class="stat"><b>'+soon.length+'</b><span>Renewing in 14 days</span></div></div>';

  if(soon.length){
    h+='<div class="sect-h"><h2>Renewing soon</h2><span class="n">'+soon.length+'</span></div>'+
      '<div class="notes">'+soon.map(function(o){
        var s=o.s, due=nextCharge(s);
        return '<div class="note exprow"><div class="tbody"><b>'+esc(s.vendor)+'</b>'+
          '<span class="t">'+(o.d===0?'charges today':'in '+o.d+' day'+(o.d===1?'':'s'))+
          ' · '+esc(L.fmtDate(due))+' · '+esc(s.cycle)+'</span></div>'+
          '<span class="amt">'+L.money(s.amount)+'</span>'+
          '<button class="btn sm mint" data-logsub="'+s.id+'">Log it</button></div>';
      }).join('')+'</div>';
  }

  /* category split */
  var cats={};
  active.forEach(function(s){ cats[s.category]=(cats[s.category]||0)+monthlyCost(s); });
  var keys=Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; });
  if(keys.length>1){
    var items=keys.slice(0,7).map(function(k,i){
      return {label:k,value:Math.round(cats[k]),color:L.CH_COLORS[i%L.CH_COLORS.length]};
    });
    h+='<div class="board" style="grid-template-columns:1fr;margin-top:14px"><div class="panel">'+
      '<div class="dt">Monthly</div><div class="ttl">SUBSCRIPTIONS BY CATEGORY</div>'+
      '<div class="chart">'+window.LDV.donut({items:items,center:L.money(mo),centerLabel:'PER MONTH'})+'</div>'+
      window.LDV.legend(items)+'</div></div>';
  }

  h+='<div class="sect-h"><h2>All subscriptions</h2></div>';
  h+='<table class="mtable"><tr><th>Vendor</th><th>Amount</th><th>Cycle</th><th>Next charge</th><th>Per year</th><th></th></tr>'+
    list.map(function(s){
      var due=nextCharge(s), d=daysUntil(due);
      var cancelled=s.status!=='active';
      return '<tr'+(cancelled?' style="opacity:.5"':'')+'>'+
        '<td>'+esc(s.vendor)+(cancelled?' <span class="pill flat">cancelled</span>':'')+
          '<div style="font-size:11.5px;color:var(--ink-3)">'+esc(s.category)+'</div></td>'+
        '<td class="val"><span class="num">'+L.money(s.amount)+'</span></td>'+
        '<td class="val" style="font-size:12px">'+esc(s.cycle)+'</td>'+
        '<td class="val" style="font-size:12px">'+(cancelled?'—':esc(L.fmtDate(due))+
          (d!==null&&d<=7?' <span class="pill high">'+(d===0?'today':d+'d')+'</span>':''))+'</td>'+
        '<td class="val"><span class="num">'+L.money(cancelled?0:annualCost(s))+'</span></td>'+
        '<td class="val">'+(cancelled?'':
          '<button class="btn sm" data-logsub="'+s.id+'">Log</button> '+
          '<button class="btn sm ghost" data-cancelsub="'+s.id+'">Cancel</button>')+'</td></tr>';
    }).join('')+'</table>';

  h+='<p class="hint">Logging a charge writes a real expense, so subscriptions and spending stay in one ledger. '+
     'You get a task three days before anything renews.</p>';
  return h+'</div>';
}

  schema:{leadId:'string',customerId:'string'},
  run:function(i){
    if(!hasCalendly()) throw new Error('No booking link saved. Add it in Settings → Integrations → Calendly.');
    var who='';
    if(i.leadId){ var l=L.find(i.leadId); if(l) who=l.owner||l.business||''; }
    var body=(who?who+', ':'')+'here is my calendar if you want to grab a time that suits you: '+calLink();
    var r=OS.ACTIONS.draftMessage.run({leadId:i.leadId,customerId:i.customerId,
      channel:'sms',body:body});
    return {draftId:r.id,link:calLink()};
  }
};
if(OS.SCOPE_OF) OS.SCOPE_OF.sendBookingLink='draft';

/* register with the Integration Center */
if(window.LDINT&&window.LDINT.PROVIDERS){
  window.LDINT.PROVIDERS.push({
    id:'calendly',cat:'calendar',name:'Calendly',icon:'◷',
    does:'Share your booking link from any message, and pull booked meetings into the calendar.',
    needs:['A Calendly account','Your public scheduling link','A personal access token, only for automatic sync'],
    auth:'apikey',status:'partial',
    steps:[
      'Open <b>calendly.com</b> and sign in.',
      'Copy your public scheduling link from the top of the dashboard. It looks like <b>calendly.com/yourname/30min</b>.',
      'Paste it into the box below and save. That alone makes it available in every message the AI writes.',
      'For automatic sync, go to <b>Integrations &amp; apps → API &amp; webhooks → Personal access tokens</b>.',
      'Create a token and copy it.',
      'Add it to your Cloudflare Worker as a secret named <b>CALENDLY_TOKEN</b>.',
      'Point a Calendly webhook at <b>YOUR-WORKER-URL/v1/calendly/webhook</b> for the <b>invitee.created</b> event.'
    ],
    note:'The link works right now with no account connection. Automatic sync of booked meetings needs the Worker deployed and the webhook endpoint written.'
  });
  window.LDINT.PROVIDERS_BY_ID&&(window.LDINT.PROVIDERS_BY_ID.calendly=
    window.LDINT.PROVIDERS[window.LDINT.PROVIDERS.length-1]);
}

/* the Calendly card gets its own link field inside the Integration Center */
if(window.LDINT){
  var _stat=window.LDINT.statusOf;
  window.LDINT.statusOf=function(p){
    if(p.id==='calendly') return hasCalendly()?'connected':'setup_required';
    return _stat(p);
  };
}
function calendlyPanel(){
  var c=calCfg();
  return '<div class="card"><b style="font-size:16px">Calendly booking link</b>'+
    '<p class="hint">Paste your public scheduling link. Once saved, the AI offers it whenever it suggests a call, '+
    'and you get a one-tap copy on every lead.</p>'+
    '<label class="field" style="margin-top:12px"><span>Your scheduling link</span>'+
    '<input data-set="calendly.link" placeholder="https://calendly.com/yourname/30min" value="'+esc(c.link||'')+'"></label>'+
    '<label class="field"><span>What to call it</span>'+
    '<input data-set="calendly.eventName" placeholder="30 minute call" value="'+esc(c.eventName||'')+'"></label>'+
    '<div style="display:flex;gap:10px"><button class="btn pri" style="flex:1" id="saveCalendly">Save</button>'+
    (hasCalendly()?'<button class="btn mint" style="flex:1" id="copyCalendly">Copy link</button>'+
      '<a class="btn" style="flex:1" href="'+esc(calLink())+'" target="_blank" rel="noopener">Open</a>':'')+
    '</div></div>';
}

/* ============================================================
   WIRING
   ============================================================ */
if(IA){
  var money=IA.sectionById('money');
  if(money&&!money.pages.some(function(p){ return p.id==='subs'; })){
    money.pages.splice(3,0,{id:'subs',label:'Subscriptions',custom:'subs'});
    IA.CUSTOM.subs=vSubs;
  }
  var prevInt=IA.CUSTOM.integrations;
  IA.CUSTOM.integrations=function(){
    var base=prevInt?prevInt():'';
    return base.replace('</div>', calendlyPanel()+'</div>');
  };
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-logsub],[data-cancelsub]');
  if(el){
    if(el.dataset.logsub){ logCharge(el.dataset.logsub); return; }
    if(el.dataset.cancelsub){
      var r=OS.runAction('cancelSubscription',{id:el.dataset.cancelsub});
      L.render();
      L.toast(r.ok?('Cancelled — '+L.money(r.result.saved)+'/mo back'):'Could not cancel');
      return;
    }
  }
  var b=e.target.closest('button'); if(!b||!b.id) return;

  if(b.id==='addSub'||b.id==='addSub2'){
    L.modal('<h3>New subscription</h3><p class="lede">Auto-pay charges you want tracked and warned about.</p>'+
      '<div class="grid2">'+
      f('vendor','Who charges you','Adobe Creative Cloud')+
      f('amount','Amount','54.99','number')+
      sel('cycle','How often',CYCLES.map(function(c){ return [c[0],c[1]]; }))+
      f('firstCharge','First or last charge date',L.today(),'date')+
      f('category','Category','Software')+
      f('method','Paid with','Business card')+
      '</div>'+
      f('cancelUrl','Cancellation page (optional)','https://…')+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn pri" id="saveSub">Add</button></div>');
    $('#saveSub').onclick=function(){
      var o={};
      $$('[data-sf]').forEach(function(el2){ o[el2.dataset.sf]=el2.value.trim(); });
      if(!o.vendor||!o.amount){ L.toast('Vendor and amount are required'); return; }
      var r=OS.runAction('createSubscription',o);
      L.closeModal(); L.render();
      L.toast(r.ok?('Tracking '+o.vendor+' — '+L.money(r.result.monthly)+'/mo'):(r.error||'Could not add'));
    };
    return;
  }
  if(b.id==='saveCalendly'){
    $$('[data-set]').forEach(function(el2){
      var p=el2.dataset.set.split('.');
      if(p[0]==='calendly'){ calCfg()[p[1]]=el2.value.trim(); }
    });
    L.save(); L.render();
    L.toast(hasCalendly()?'Booking link saved':'Paste your link first');
    return;
  }
  if(b.id==='copyCalendly'){ L.copyText(calLink(),'Booking link copied'); return; }
},false);

function f(k,label,ph,type){
  return '<label class="field"><span>'+esc(label)+'</span><input data-sf="'+k+'" type="'+(type||'text')+'" '+
    (type==='number'?'inputmode="decimal" ':'')+(type==='date'?'value="'+esc(ph)+'" ':'placeholder="'+esc(ph)+'" ')+
    '></label>';
}
function sel(k,label,opts){
  return '<label class="field"><span>'+esc(label)+'</span><select data-sf="'+k+'">'+
    L.opts(opts,'monthly')+'</select></label>';
}

window.LDSUB={store:store,nextCharge:nextCharge,monthlyCost:monthlyCost,annualCost:annualCost,
  vSubs:vSubs,logCharge:logCharge,calCfg:calCfg,hasCalendly:hasCalendly,calLink:calLink};
})();

</script>
</body>
