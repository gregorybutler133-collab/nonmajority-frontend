/* ============================================================
   CALENDAR
   ============================================================ */
function ym(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthCursor(){
  if(!state.cal) state.cal=ym(new Date());
  var p=state.cal.split('-');
  return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,1);
}
function eventsOn(key){
  var out=[];
  DB.leads.forEach(function(x){
    if(x.nextFollow===key&&x.stage!=='Won'&&x.stage!=='Lost')
      out.push({type:'follow',id:x.id,title:x.business||'Untitled lead',sub:'Follow-up'});
  });
  (DB.events||[]).forEach(function(e){
    if(e.date===key) out.push({type:'event',id:e.id,title:e.title,sub:e.time||'Task',done:e.done});
  });
  return out;
}
function vCal(){
  var cur=monthCursor(), y=cur.getFullYear(), m=cur.getMonth();
  var start=new Date(y,m,1).getDay();
  var days=new Date(y,m+1,0).getDate();
  var td=L.today();
  var label=new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});

  var h='<div class="wrap"><div class="calbar">'+
    '<button class="btn sm" data-mon="-1" aria-label="Previous month">‹</button>'+
    '<b>'+esc(label)+'</b>'+
    '<button class="btn sm" data-mon="1" aria-label="Next month">›</button>'+
    '<div style="flex:1"></div>'+
    '<button class="btn sm" data-mon="0">Today</button>'+
    '<button class="btn sm pri" data-newev="'+td+'">+ Add</button></div>';

  h+='<div class="cal">';
  ['S','M','T','W','T','F','S'].forEach(function(d){ h+='<div class="cdow">'+d+'</div>'; });
  for(var i=0;i<start;i++) h+='<div class="cpad"></div>';
  for(var d2=1;d2<=days;d2++){
    var key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
    var ev=eventsOn(key);
    h+='<button class="cday'+(key===td?' today':'')+(ev.length?' has':'')+'" data-day="'+key+'">'+
      '<span class="dn">'+d2+'</span><span class="dots">'+
      ev.slice(0,4).map(function(e){ return '<i class="'+(e.type==='follow'?'f':'e')+(e.done?' done':'')+'"></i>'; }).join('')+
      '</span></button>';
  }
  h+='</div>';

  var upcoming=[];
  for(var k=0;k<21;k++){
    var dd=new Date(); dd.setHours(12,0,0,0); dd.setDate(dd.getDate()+k);
    var kk=dd.toISOString().slice(0,10);
    var e2=eventsOn(kk);
    if(e2.length) upcoming.push({key:kk,items:e2});
  }
  var od={};
  DB.leads.forEach(function(x){
    if(x.nextFollow&&x.nextFollow<td&&x.stage!=='Won'&&x.stage!=='Lost'){
      (od[x.nextFollow]=od[x.nextFollow]||[]).push({type:'follow',id:x.id,title:x.business||'Untitled',sub:'Follow-up'});
    }
  });
  (DB.events||[]).forEach(function(e){
    if(e.date<td&&!e.done) (od[e.date]=od[e.date]||[]).push({type:'event',id:e.id,title:e.title,sub:e.time||'Task'});
  });
  var overdue=Object.keys(od).sort().map(function(k2){ return {key:k2,items:od[k2]}; });

  if(overdue.length){
    h+='<div class="sect-h"><h2 style="color:var(--bad)">Overdue</h2><span class="n">'+overdue.length+' day'+(overdue.length===1?'':'s')+'</span></div>'+dayList(overdue);
  }
  h+='<div class="sect-h"><h2>Next three weeks</h2><span class="n">'+upcoming.length+' day'+(upcoming.length===1?'':'s')+'</span></div>';
  h+=upcoming.length?dayList(upcoming):'<div class="empty"><b>Nothing scheduled</b>Set follow-up dates on your leads, or add a task with the + button.</div>';
  return h+'</div>';

  function dayList(arr){
    return arr.map(function(g){
      return '<div class="cgrp"><div class="cgh">'+esc(L.fmtDate(g.key))+' · '+esc(L.relDay(g.key))+'</div>'+
        g.items.map(function(e){
          return '<div class="crow'+(e.done?' done':'')+'">'+
            '<span class="cdot '+(e.type==='follow'?'f':'e')+'"></span>'+
            '<div style="flex:1;min-width:0"><b>'+esc(e.title)+'</b><span>'+esc(e.sub)+'</span></div>'+
            (e.type==='follow'
              ? '<button class="btn sm" data-open="'+e.id+'">Open</button>'
              : '<button class="btn sm" data-evdone="'+e.id+'">'+(e.done?'Undo':'Done')+'</button>'+
                '<button class="btn sm" data-evdel="'+e.id+'" aria-label="Delete" style="color:var(--ink-3)">×</button>')+
            '</div>';
        }).join('')+'</div>';

function dayKey(d){ return d.toISOString().slice(0,10); }

function shortDate(k){

}
function delta(now,prev){
  if(!prev) return now?{cls:'up',txt:'new'}:{cls:'flatd',txt:'—'};
  var p=Math.round(((now-prev)/prev)*100);
  return {cls:p>0?'up':p<0?'down':'flatd',txt:(p>0?'▲ ':p<0?'▼ ':'')+Math.abs(p)+'%'};
}
function seriesByDay(dates,days,offset){
  var out=[],labels=[];
  for(var i=days-1;i>=0;i--){
    var k=dayKey(shiftDays(-(i+(offset||0))));
    labels.push(shortDate(k));
    out.push(dates.filter(function(d){ return d===k; }).length);
  }
  return {values:out,labels:labels};
}

/* ---------- LEADS ---------- */
function matches(x,f,q){
  if(q){
    var hay=[x.business,x.owner,x.city,x.state,x.industry,x.phone,x.email,x.address,x.source].join(' ').toLowerCase();
    if(hay.indexOf(q.toLowerCase())<0) return false;
  }
  var t=L.tierOf(L.scoreLead(x).score).k;
  if(f.tier&&f.tier!==t) return false;
  if(f.industry&&f.industry!==x.industry) return false;
  if(f.city&&(x.city||'').toLowerCase()!==f.city.toLowerCase()) return false;
  if(f.state&&f.state!==x.state) return false;
  if(f.stage&&f.stage!==x.stage) return false;
  if(f.web&&f.web!==x.web) return false;
  if(f.book&&f.book!==x.book) return false;
  if(f.call&&f.call!==x.callStatus) return false;
  if(f.source&&f.source!==x.source) return false;
  if(f.owner==='yes'&&!x.owner) return false;
  if(f.owner==='no'&&x.owner) return false;
  if(f.due==='today'&&!(x.nextFollow&&x.nextFollow<=L.today())) return false;
  if(f.due==='week'){ if(!x.nextFollow) return false; if(L.daysBetween(L.today(),x.nextFollow)>7) return false; }
  if(f.due==='none'&&x.nextFollow) return false;
  return true;
}

  return DB.leads.filter(function(x){ return matches(x,state.filters,state.q); })

/* ---------- FOLLOW-UPS ---------- */
function vFollow(){
  var td=L.today();
  var live=DB.leads.filter(function(x){ return x.stage!=='Won'&&x.stage!=='Lost'; });
  var dated=live.filter(function(x){ return x.nextFollow; }).sort(function(a,b){ return a.nextFollow<b.nextFollow?-1:1; });
  var over=dated.filter(function(x){ return x.nextFollow<td; });
  var now=dated.filter(function(x){ return x.nextFollow===td; });
  var soon=dated.filter(function(x){ return x.nextFollow>td; });
  var never=live.filter(function(x){ return !x.nextFollow&&x.callStatus!=='Not called'; });
  var h='<div class="wrap">';
  if(!dated.length&&!never.length){
    return h+'<div style="height:16px"></div><div class="empty"><b>Nothing scheduled</b>'+
      'Open any lead, set a follow-up date, and it shows up here on the day.</div></div>';
  }
  h+=grp('Overdue',over,'over')+grp('Today',now,'today')+grp('Coming up',soon,'')+grp('Contacted, no date set',never,'');
  return h+'</div>';

  function grp(title,arr,cls){
    if(!arr.length) return '';
    return '<div class="sect-h"><h2>'+title+'</h2><span class="n">'+arr.length+'</span></div>'+
      arr.map(function(x){
        var t=L.tierOf(L.scoreLead(x).score);
        var note=x.notes&&x.notes.length?x.notes[0].text:'';
        return '<div class="fu '+cls+'"><h4>'+esc(x.business||'Untitled lead')+
          ' <span class="pill '+t.k+'">'+t.icon+' '+t.label+'</span></h4>'+
          '<div class="when" style="color:'+(cls==='over'?'var(--bad)':cls==='today'?'var(--high)':'var(--ink-3)')+'">'+
          (x.nextFollow?esc(L.relDay(x.nextFollow))+' · '+esc(L.fmtDate(x.nextFollow)):'No date set')+
          (x.lastContacted?' · last contact '+esc(L.fmtDate(x.lastContacted)):'')+'</div>'+
          (note?'<div class="lastnote">'+esc(note)+'</div>':'')+
          '<div class="acts">'+
            (x.phone?'<a class="btn" href="tel:'+esc(x.phone)+'">Call</a>':'<button class="btn" data-open="'+x.id+'">Open</button>')+
            '<button class="btn amber" data-fugen="'+x.id+'">Follow-up</button>'+
            '<button class="btn mint" data-fudone="'+x.id+'">Done</button></div></div>';
      }).join('');
  }
}

var TITLES={dash:['Dashboard','Where things stand'],leads:['Leads','Sorted by score'],
  follow:['Follow-ups','Who is waiting on you'],pipe:['Pipeline','Move it forward'],
  finder:['Lead Finder','Build a hunting list'],prompts:['Site Prompts','Base44 and Claude'],
  chat:['Assistant','Ask it anything'],set:['Settings','Keys, details, backups']};
function titleOf(v){ return (L.titles&&L.titles[v])||TITLES[v]||TITLES.dash; }
var headMtn=null, lastRoute='';
function snapFocus(){
  var a=document.activeElement;
  if(!a||!a.tagName) return null;
  var tag=a.tagName.toLowerCase();
  if(tag!=='input'&&tag!=='textarea'&&tag!=='select') return null;
  var key=a.id?('#'+a.id):
    (a.dataset.set?'[data-set="'+a.dataset.set+'"]':
    (a.dataset.fld?'[data-fld="'+a.dataset.fld+'"]':
    (a.dataset.up?'[data-up="'+a.dataset.up+'"]':
    (a.dataset.filt?'[data-filt="'+a.dataset.filt+'"]':null))));
  if(!key) return null;
  var st=null,en=null;
  try{ st=a.selectionStart; en=a.selectionEnd; }catch(e){}
  return {key:key,st:st,en:en};
}
function restoreFocus(f){
  if(!f) return;
  var el=null;
  try{ el=document.querySelector(f.key); }catch(e){}
  if(!el) return;
  try{
    el.focus({preventScroll:true});
    if(f.st!=null&&el.setSelectionRange) el.setSelectionRange(f.st,f.en);
  }catch(e){}
}
function snapChatBottom(){
  var lg=document.getElementById('chatlog');
  if(!lg) return null;
  return {
    atBottom:(lg.scrollHeight-lg.scrollTop-lg.clientHeight) < 40,
    scrollTop:lg.scrollTop
  };
}

   AI ENGINE
   ============================================================ */
function leadFacts(x){
  var f=[];
  function p(k,v){ if(v!==''&&v!=null) f.push(k+': '+v); }
  p('Business name',x.business);
  p('Industry',x.industry);
  p('City',[x.city,x.state].filter(Boolean).join(', '));
  p('Owner name',x.owner);
  p('Phone on file',x.phone?'yes':'');
  p('Email on file',x.email?'yes':'');
  p('Google rating',x.rating);
  p('Number of reviews',x.reviews);
  p('Most recent review',x.lastReview?L.fmtDate(x.lastReview):'');
  p('Website status',L.labelOf(L.WEB,x.web));
  p('Website URL',x.webUrl);
  p('Online booking status',L.labelOf(L.BOOK,x.book));
  p('Facebook',x.facebook?'active page':'');
  p('Instagram',x.instagram?'active page':'');
  p('Yelp',x.yelp?'listed':'');
  p('Lead source',x.source);
  p('Pipeline stage',x.stage);
  p('Call status',x.callStatus);
  p('Times contacted',x.attempts||0);
  p('Last contacted',x.lastContacted?L.fmtDate(x.lastContacted):'never');
  p('Next follow-up planned',x.nextFollow?L.fmtDate(x.nextFollow):'');
  if(x.ammo.length) p('Existing talking points',x.ammo.join(' | '));
  if(x.notes.length) f.push('My notes (newest first):\n'+x.notes.slice(0,8).map(function(n){ return '  ['+L.fmtDate(n.t)+'] '+n.text; }).join('\n'));
  return f.join('\n');
}
function meBlock(){
  var m=DB.settings.me,f=[];
  if(m.name) f.push('My name: '+m.name);
  if(m.company) f.push('My business: '+m.company);
  if(m.offer) f.push('What I sell: '+m.offer);
  if(m.city) f.push('I am based in: '+m.city);
  if(m.phone) f.push('My phone: '+m.phone);
  if(m.email) f.push('My email: '+m.email);
  if(m.site) f.push('My website: '+m.site);
  return f.length?f.join('\n'):'(I have not filled in my own details yet — leave the sign-off blank rather than inventing one.)';
}
var SYS='You write outreach for a freelance web designer who builds websites and online booking systems for local small businesses. '+
'You are given a lead record. Hard rules, no exceptions:\n'+
'- Use ONLY facts present in the lead record. Never invent reviews, ratings, owner names, prices, services, customer complaints, years in business, or problems with their current website.\n'+
'- If a field is missing, say nothing about it. Do not guess and do not use placeholders like [name] or [city].\n'+
'- Never claim a business has no website or no booking system unless the record says so. If the status is "Not checked yet", do not mention it at all.\n'+
'- If the record says they already have a working website, do not pitch a first website. Pitch an improvement or online booking instead, and stay humble about it.\n'+
'- No hype, no superlatives, no "I hope this email finds you well", no fake urgency, no made-up statistics.\n'+
'- Sound like a real person typing quickly, not a marketing template.\n'+
'- Output only the finished message. No preamble, no explanation, no markdown formatting, no quotation marks around it.';

var TASKS={
  email:{title:'Cold email',prompt:
    'Write a short cold email. Under 110 words. Format exactly like this:\n\nSubject: <one short subject line, no colons after the first one>\n\n<email body>\n\n'+
    'The body opens by naming the business and one specific true thing from the record. One sentence on what a website or booking page would change for their customers. One simple question as the close, like asking if they want to see a quick example. Sign off with my name and business only if I provided them.'},
  text:{title:'Text message',prompt:
    'Write one SMS. Two or three sentences, under 320 characters. Say who I am, name their business, one concrete reason I reached out, and one easy question. No links unless my website is in my details. No emojis.'},
  call:{title:'Cold call script',prompt:
    'Write a cold call opener in five short labelled parts:\n\nGREETING\nREASON FOR CALLING\nWHAT I NOTICED\nTHE OPPORTUNITY\nMY QUESTION\n\n'+
    'Each part is one or two spoken sentences, written the way a person actually talks on the phone. Then add a line break and:\n\nIF THEY SAY NO RIGHT AWAY\n<one short graceful exit that leaves the door open>'},
  ammo:{title:'Sales ammo',prompt:
    'List 3 to 5 talking points I can use on this lead. One per line, each starting with "- ". Each one must trace back to something actually in the record. '+
    'Frame them as what their customer experiences right now, not as insults about the business. No intro line, no closing line, just the bullets.'},
  follow:{title:'Follow-up message',prompt:
    'Write a follow-up. Use the call status, the last contact date, the pipeline stage and my notes to pick the right angle. '+
    'If my notes say they asked for something, reference that. If they never answered, keep it light and short and give one new reason to reply. '+
    'Under 90 words. Start with "CHANNEL: email" or "CHANNEL: text" on its own line based on which one fits this situation, then a blank line, then the message. If email, include a Subject line.'},
  object:{title:'Objection responses',prompt:
    'Write short spoken responses to these six brush-offs. Format each as the objection in caps on its own line, then my reply on the next line, then a blank line. '+
    'Each reply is one to three sentences, conversational, no pressure, and ends by handing control back to them.\n\n'+
    'NOT INTERESTED\nHOW MUCH\nWE ALREADY USE FACEBOOK\nI DON\'T NEED A WEBSITE\nI\'LL THINK ABOUT IT\nSEND ME SOMETHING'}
};

function callAIx(system,messages,onDone,onErr,maxTok,task,feature){
  window.LDNET.chat({
    task:task||'write', feature:feature||'outreach',
    system:system, messages:messages, maxTokens:maxTok||1400
  }).then(function(r){
    if(!r.text) throw new Error('The AI returned an empty response.');
    onDone(r.text.trim());
  }).catch(function(e){ onErr(String(e.message||e)); });
}
function callAI(userMsg,onDone,onErr){
  callAIx(SYS,[{role:'user',content:userMsg}],onDone,onErr,1200,'write','outreach');
}

function generate(kind){
  var x=find(state.open); if(!x) return;
  if(!DB.settings.key&&!DB.settings.proxy){ L.toast('Connect the AI in Settings first'); return; }
  var task=TASKS[kind];
  state.gen[x.id]={title:task.title,text:'',busy:true,kind:kind};
  renderSheet();

  var msg='LEAD RECORD\n'+leadFacts(x)+'\n\nABOUT ME\n'+meBlock()+
          '\n\nSTYLE\n'+(DB.settings.tone||'Direct and friendly. Short sentences.')+
          '\n\nTASK\n'+task.prompt;

  window.LDNET.chat({task:'write',feature:'outreach_'+kind,system:SYS,
    messages:[{role:'user',content:msg}],maxTokens:1200}).then(function(rr){
    var out=rr.text;
    state.gen[x.id]={title:task.title,text:out,busy:false,kind:kind};
    if(kind==='ammo'){
      var lines=out.split('\n').map(function(l){ return l.replace(/^[-•*\d.)\s]+/,'').trim(); }).filter(function(l){ return l.length>8; });
      if(lines.length){ x.ammo=lines; L.save(); }
    }
    renderSheet();
    var el=$('#outText'); if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
  }).catch(function(err){
    state.gen[x.id]={title:task.title,text:'Could not generate.\n\n'+String(err.message||err),busy:false,kind:kind};
    renderSheet();
  });
}

    '<button class="stat money" data-stat="money" data-sf="{}"><b>'+L.money(saveTotal)+'</b><span>Possible savings / mo</span></button>'+
  '</div>';

     (ready()?'<button class="btn sm pri" id="runPri">'+(s.priorities&&s.priorities.date===td?'Refresh':'Rank my day')+'</button>':'')+'</div>';
  if(state.priBusy){
    h+=busy('Reading your business…');

        (p.action?'<p class="pact"><span>NEXT</span>'+esc(p.action)+'</p>':'')+

  if(hot.length){

    h+='<div class="list">'+hot.slice(0,5).map(L.leadRow).join('')+'</div>';
  }
  return h+'</div>';

  function tile(n,label,cls,go,f){
    return '<button class="stat '+(cls||'')+'" data-stat="'+go+'" data-sf="'+esc(JSON.stringify(f||{}))+'">'+
      '<b>'+n+'</b><span>'+esc(label)+'</span></button>';
  }

function taskRow(t){
  var od=t.due<L.today();

/* ============================================================
   SCHEDULE — tasks segment bolted onto the existing calendar
   ============================================================ */
function vTasks(){
  var s=sp(), td=L.today();
  var open=s.tasks.filter(function(t){ return !t.done; });
  var done=s.tasks.filter(function(t){ return t.done; });
  var over=open.filter(function(t){ return t.due<td; });
  var now=open.filter(function(t){ return t.due===td; });
  var soon=open.filter(function(t){ return t.due>td; });
  var h='<div class="wrap">';
  h+='<div class="sect-h"><h2>Tasks</h2><span class="n">'+open.length+' open</span>'+
     '<div style="flex:1"></div><button class="btn sm pri" id="addTask">+ Task</button></div>';
  if(!s.tasks.length) return h+empty('No tasks yet','The AI creates these as it works your leads, or add one yourself.')+'</div>';
  h+=grp('Overdue',over)+grp('Today',now)+grp('Coming up',soon);
  if(done.length){
    h+='<div class="sect-h"><h2>Done</h2><span class="n">'+done.length+'</span></div>';
    h+='<div class="notes">'+done.slice(0,12).map(taskRow).join('')+'</div>';
  }
  return h+'</div>';
  function grp(t,arr){
    if(!arr.length) return '';
    return '<div class="sect-h"><h2>'+t+'</h2><span class="n">'+arr.length+'</span></div>'+
      '<div class="notes">'+arr.map(taskRow).join('')+'</div>';
  }
}

    var openInv=s.invoices.filter(function(i){ return i.customerId===c.id&&(i.status==='open'||i.status==='partial'); });
    var due=openInv.reduce(function(a,i){ return a+(n2(i.total)-n2(i.paid)); },0);

          '<p>'+esc(a.title)+(a.value?' · '+L.money(a.value):'')+'</p></div>';

        var chan=(m.channel||'call').toUpperCase();
        var statPill=m.status==='draft'?'med':m.status==='sent'?'good':'flat';
        return '<div class="note"><div class="t">'+esc(L.fmtDate((m.t||m.created||'').slice(0,10)))+

        '<span class="t">'+esc(L.fmtDate(i.issued))+' · due '+esc(L.fmtDate(i.dueDate))+

function apStat(s){ return s==='completed'?'good':s==='missed'?'bad':s==='cancelled'?'flat':'med'; }
function invStat(i){ return i.status==='paid'?'good':i.status==='partial'?'med':
  (i.dueDate&&i.dueDate<L.today()?'bad':'flat'); }
function stars(n){ n=Math.max(0,Math.min(5,Math.round(n||0))); return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n); }

/* ============================================================
   BOOKING  (inside the calendar)
   ============================================================ */
function vBooking(){
  var s=sp(), td=L.today(), h='<div class="wrap">';
  var up=s.appointments.filter(function(a){ return a.status==='booked'&&a.date>=td; })
    .sort(function(a,b){ return (a.date+a.time)<(b.date+b.time)?-1:1; });
  var past=s.appointments.filter(function(a){ return a.status==='booked'&&a.date<td; });
  var done=s.appointments.filter(function(a){ return a.status!=='booked'; });

  h+='<div class="sect-h"><h2>Appointments</h2><div style="flex:1"></div>'+
     '<button class="btn sm pri" id="addAppt">+ Book</button></div>';
  if(!s.appointments.length){
    return h+empty('Nothing booked','Book a visit and the reminder, the invoice and the review request follow automatically.')+'</div>';
  }
  if(past.length){
    h+='<div class="warnbox">'+past.length+' appointment'+(past.length===1?'':'s')+
      ' in the past still marked booked. Close them out so the money and review flow can run.</div>';
    h+='<div class="notes" style="margin-top:10px">'+past.map(apptRow).join('')+'</div>';
  }
  h+=grp('Coming up',up)+grp('Closed',done.slice(0,20));
  return h+'</div>';
  function grp(t,arr){
    if(!arr.length) return '';
    return '<div class="sect-h"><h2>'+t+'</h2><span class="n">'+arr.length+'</span></div>'+
      '<div class="notes">'+arr.map(apptRow).join('')+'</div>';
  }
}
function apptRow(a){
  var open=a.status==='booked';
  return '<div class="note"><div class="t">'+esc(L.fmtDate(a.date))+' '+esc(a.time)+
    ' · <span class="pill '+apStat(a.status)+'">'+esc(a.status)+'</span>'+
    (a.value?' · '+L.money(a.value):'')+'</div>'+
    '<p><b>'+esc(a.title)+'</b>'+(a.customerName?' — '+esc(a.customerName):'')+'</p>'+
    (open?'<div class="callbar" style="grid-template-columns:1fr 1fr 1fr;margin-top:10px">'+
      '<button class="btn mint" data-apdone="'+a.id+'">Completed</button>'+
      '<button class="btn" data-apmove="'+a.id+'">Reschedule</button>'+
      '<button class="btn ghost" data-apmiss="'+a.id+'">No-show</button></div>':'')+
    '</div>';
}

   REVENUE  (inside Money)
   ============================================================ */
function vRevenue(){
  var s=sp(), rv=BIZ.revenue(), h='<div class="wrap">';
  h+='<div class="sect-h"><h2>Revenue</h2><div style="flex:1"></div>'+
     '<button class="btn sm pri" id="addInv">+ Invoice</button></div>';

    return h+empty('No money recorded yet','Raise an invoice, or complete a job with a value and one is raised for you.')+'</div>';
  }
  h+='<div class="stats">'+
    '<div class="stat money"><b>'+L.money(rv.total)+'</b><span>Collected</span></div>'+
    '<div class="stat"><b style="color:var(--acc-amber)">'+L.money(rv.outstanding)+'</b><span>Outstanding</span></div>'+
    '<div class="stat money"><b>'+L.money(rv.avgCustomerValue)+'</b><span>Per customer</span></div>'+
    '<div class="stat"><b>'+pct(rv.apptCompletionRate)+'</b><span>Jobs completed</span></div>'+
    '<div class="stat"><b>'+pct(rv.noShowRate)+'</b><span>No-shows</span></div>'+
    '<div class="stat"><b>'+rv.overdue.length+'</b><span>Overdue</span></div></div>';

  var months=Object.keys(rv.byMonth).sort().slice(-12);
  if(months.length>1){
    h+='<div class="board" style="grid-template-columns:1fr"><div class="panel">'+
      '<div class="dt">By month</div><div class="ttl">REVENUE COLLECTED</div>'+
      '<div class="chart">'+V.lineChart({labels:months.map(function(m){ return m.slice(5)+'/'+m.slice(2,4); }),
        series:[{values:months.map(function(m){ return Math.round(rv.byMonth[m]); }),color:'var(--acc-mint)',fill:true}]})+
      '</div></div></div>';
  }
  var svc=Object.keys(rv.byService).sort(function(a,b){ return rv.byService[b]-rv.byService[a]; }).slice(0,7)
    .map(function(k,i){ return {label:k,value:Math.round(rv.byService[k]),color:L.CH_COLORS[i%L.CH_COLORS.length]}; });
  var src=Object.keys(rv.bySource).sort(function(a,b){ return rv.bySource[b]-rv.bySource[a]; }).slice(0,7)
    .map(function(k,i){ return {label:k,value:Math.round(rv.bySource[k]),color:L.CH_COLORS[(i+3)%L.CH_COLORS.length]}; });
  if(svc.length||src.length){
    h+='<div class="board">';
    if(svc.length) h+='<div class="panel"><div class="dt">All time</div><div class="ttl">REVENUE BY SERVICE</div>'+
      '<div class="chart">'+V.donut({items:svc,center:L.money(rv.total),centerLabel:'TOTAL'})+'</div>'+V.legend(svc)+'</div>';
    if(src.length) h+='<div class="panel"><div class="dt">All time</div><div class="ttl">REVENUE BY LEAD SOURCE</div>'+
      '<div class="chart">'+V.donut({items:src,center:src.length,centerLabel:'SOURCES'})+'</div>'+V.legend(src)+'</div>';
    h+='</div>';
  }

  if(rv.overdue.length){
    h+='<div class="sect-h"><h2>Overdue</h2><span class="n">'+rv.overdue.length+'</span></div>';
    h+='<div class="notes">'+rv.overdue.map(invRow).join('')+'</div>';
  }
  h+='<div class="sect-h"><h2>Invoices</h2><span class="n">'+s.invoices.length+'</span></div>';
  h+='<div class="notes">'+s.invoices.slice(0,30).map(invRow).join('')+'</div>';
  if(s.payments.length){
    h+='<div class="sect-h"><h2>Payments in</h2></div><div class="notes">'+s.payments.slice(0,20).map(function(p){
      return '<div class="note exprow"><div class="tbody"><b>'+esc(p.customerName||'Customer')+'</b>'+
        '<span class="t">'+esc(L.fmtDate(p.date))+' · '+esc(p.service||'')+' · '+esc(p.method)+'</span></div>'+
        '<span class="amt" style="color:var(--acc-mint)">'+L.money(p.amount)+'</span></div>';
    }).join('')+'</div>';
  }
  return h+'</div>';
}
function invRow(i){
  var out=n2(i.total)-n2(i.paid);
  return '<div class="note exprow"><div class="tbody"><b>'+esc(i.number)+' — '+esc(i.customerName||'No customer')+'</b>'+
    '<span class="t">'+esc(i.service)+' · due '+esc(L.fmtDate(i.dueDate))+
    ' · <span class="pill '+invStat(i)+'">'+esc(i.status)+'</span></span></div>'+
    '<span class="amt">'+L.money(i.total)+'</span>'+
    (out>0.009&&i.status!=='void'?'<button class="btn sm mint" data-payinv="'+i.id+'">Pay</button>':'')+
    '</div>';
}

/* ---------- paste import ---------- */
var FIELD_MAP={
  business:'business',name:'business',company:'business','business name':'business',biz:'business',
  industry:'industry',type:'industry',category:'industry',niche:'industry',
  city:'city',town:'city',state:'state',
  owner:'owner',contact:'owner','owner name':'owner',
  phone:'phone',tel:'phone',telephone:'phone',mobile:'phone','phone number':'phone',
  email:'email','e-mail':'email',
  address:'address',street:'address',location:'address',
  rating:'rating',stars:'rating','google rating':'rating',
  reviews:'reviews','review count':'reviews','number of reviews':'reviews','# reviews':'reviews',
  'last review':'lastReview','recent review':'lastReview','most recent review':'lastReview',
  website:'_web',site:'_web','web':'_web','website url':'_web',
  booking:'_book','booking link':'_book','book':'_book','booking url':'_book','online booking':'_book',
  facebook:'facebook',fb:'facebook',instagram:'instagram',ig:'instagram',yelp:'yelp',
  source:'source','lead source':'source',
  notes:'_note',note:'_note',
  value:'value','deal value':'value',
  stage:'stage'
};
var NONE_WORDS=['none','no','n/a','na','-','nope','not found','no website','no booking','null','x','❌','false','0'];
function isNone(v){ return NONE_WORDS.indexOf(String(v).trim().toLowerCase())>-1; }

function parsePaste(txt){
  var blocks=txt.split(/\n\s*\n|\n-{3,}\n/).map(function(b){ return b.trim(); }).filter(Boolean);
  var out=[];
  blocks.forEach(function(b){
    var o={},note='';
    b.split('\n').forEach(function(line){
      var m=line.match(/^\s*([A-Za-z#/ '&-]{2,26})\s*[:\-–]\s*(.+)$/);
      if(!m){
        if(!o.business&&line.trim().length>2&&line.indexOf(':')<0) o.business=line.trim();
        return;
      }
      var key=m[1].trim().toLowerCase().replace(/\s+/g,' ');
      var val=m[2].trim();
      var f=FIELD_MAP[key];
      if(!f) return;
      if(f==='_web'){
        if(isNone(val)) o.web='none';
        else { o.web='has'; o.webUrl=val; }
      } else if(f==='_book'){
        if(isNone(val)) o.book='none';
        else { o.book='has'; o.bookUrl=val; }
      } else if(f==='_note'){ note=val; }
      else o[f]=val;
    });
    if(!o.business) return;
    if(o.state) o.state=String(o.state).trim().toUpperCase().slice(0,2);
    var lead=L.newLead(o);
    if(note) lead.notes=[{t:L.today(),text:note}];
    out.push(lead);
  });
  return out;
}

/* ---------- CSV ---------- */
var CSV_COLS=['business','industry','city','state','owner','phone','email','address','rating','reviews','lastReview','web','webUrl','book','bookUrl','facebook','instagram','yelp','source','stage','callStatus','lastContacted','nextFollow','attempts','value','override','created','ammo','notes'];
function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(){
  var head=CSV_COLS.concat(['score','priority']).join(',');
  var rows=DB.leads.map(function(x){
    var r=L.scoreLead(x);
    return CSV_COLS.map(function(c){
      if(c==='ammo') return csvCell(x.ammo.join(' | '));
      if(c==='notes') return csvCell(x.notes.map(function(n){ return '['+n.t+'] '+n.text; }).join(' | '));
      return csvCell(x[c]);
    }).concat([r.score,L.tierOf(r.score).label]).join(',');
  });
  return head+'\n'+rows.join('\n');
}
function parseCSV(txt){
  var rows=[],cur=[],val='',q=false;
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(q){
      if(c==='"'&&txt[i+1]==='"'){ val+='"'; i++; }
      else if(c==='"') q=false;
      else val+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ cur.push(val); val=''; }
      else if(c==='\n'){ cur.push(val); rows.push(cur); cur=[]; val=''; }
      else if(c!=='\r') val+=c;
    }
  }
  if(val||cur.length){ cur.push(val); rows.push(cur); }
  if(rows.length<2) return [];
  var head=rows[0].map(function(h){ return h.trim(); });
  return rows.slice(1).filter(function(r){ return r.join('').trim(); }).map(function(r){
    var o={};
    head.forEach(function(h,i){ if(CSV_COLS.indexOf(h)>-1) o[h]=r[i]||''; });
    if(!o.business) return null;
    var lead=L.newLead(o);
    if(o.ammo) lead.ammo=o.ammo.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
    if(o.override==='') lead.override=null;
    return lead;
  }).filter(Boolean);
}
function download(name,text,mime){
  try{
    var b=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
    var u=URL.createObjectURL(b);
    var a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); document.body.removeChild(a); },400);
    L.toast('Saved to Files');
  }catch(e){
    L.copyText(text,'Backup copied'); 
  }
}
function importFile(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='.csv,.json,text/csv,application/json';
  inp.onchange=function(){
    var f=inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var txt=String(fr.result);
      if(/\.json$/i.test(f.name)){
        try{
          var d=JSON.parse(txt);
          if(d.leads){ DB.leads=d.leads; if(d.settings) DB.settings=d.settings; if(d.industries) DB.industries=d.industries; }
          else if(Array.isArray(d)) DB.leads=d.concat(DB.leads);
          L.save(); L.render(); L.toast('Backup restored');
        }catch(e){ L.toast('That file would not open'); }
      } else {
        var arr=parseCSV(txt);
        if(!arr.length){ L.toast('No leads found in that file'); return; }
        DB.leads=arr.concat(DB.leads); L.save(); L.go('leads');
        L.toast('Imported '+arr.length+' lead'+(arr.length===1?'':'s'));
      }
    };
    fr.readAsText(f);
  };
  inp.click();
}

function setDeep(obj,path,val){
  var p=path.split('.'),o=obj;
  for(var i=0;i<p.length-1;i++){
    if(o[p[i]]==null||typeof o[p[i]]!=='object') o[p[i]]={};
    o=o[p[i]];
  }
  o[p[p.length-1]]=val;
}

function runPrompts(){

  var type=($('#pType')||{}).value||'one-page';
  var free=($('#pFree')||{}).value||'';
  state.promptLead=sel; state.pType=type; state.pFree=free;
  var lead=sel?L.find(sel):null;
  if(!lead&&!free.trim()){ L.toast('Pick a lead or describe the business'); return; }
  state.promptBusy=true; L.render();
  var typeTxt={'one-page':'A single-page conversion site.','booking':'A booking-first site where the main action is requesting an appointment.',
    'multi':'A multi-page site with individual service pages.','storefront':'A storefront site with a catalog, menu or product list.'}[type];
  var msg='SITE TYPE\n'+typeTxt+'\n\nTHE BUSINESS\n'+(lead?L.leadFacts(lead):free)+
    (lead&&free?'\n\nEXTRA CONTEXT\n'+free:'')+
    '\n\nWHO IS BUILDING IT\n'+L.meBlock()+
    '\n\nReminder: anything not stated above is unknown. Use square-bracket placeholders for it.';
  L.callAIx(PROMPT_SYS,[{role:'user',content:msg}],function(out){
    var parts=out.split(/^===CLAUDE===\s*$/m);

    if(!cl){ cl=b44; b44=(parts[0]||'').trim(); }

  },function(err){
    DB.prompts[sel||'_free']={base44:'Could not write the prompts.\n\n'+err,claude:''};
    state.promptBusy=false; L.render();

}

/* ---------- ASSISTANT ---------- */
function crmSnapshot(){
  if(!DB.leads.length) return 'He has no leads in the CRM yet.';
  var td=L.today();
  var rows=DB.leads.slice().sort(function(a,b){ return L.scoreLead(b).score-L.scoreLead(a).score; }).slice(0,40);
  var out=['HIS CRM RIGHT NOW ('+DB.leads.length+' leads total, top '+rows.length+' by score):'];
  rows.forEach(function(x){
    out.push('- '+(x.business||'Untitled')+' | score '+L.scoreLead(x).score+
      ' | '+(x.industry||'industry unknown')+' | '+[x.city,x.state].filter(Boolean).join(', ')+
      ' | website: '+L.labelOf(L.WEB,x.web)+' | booking: '+L.labelOf(L.BOOK,x.book)+
      ' | stage: '+x.stage+' | '+x.callStatus+
      (x.owner?' | owner '+x.owner:'')+
      (x.nextFollow?' | follow-up '+x.nextFollow+(x.nextFollow<=td?' (DUE)':''):'')+
      (x.notes&&x.notes.length?' | last note: '+x.notes[0].text.slice(0,90):''));
  });
  return out.join('\n');
}
function chatSys(){
  return 'You are a sharp, plain-spoken assistant inside a lead-generation CRM belonging to a freelance web designer. '+
    'Answer anything he asks, the way a good general-purpose assistant would — writing, ideas, pricing, technical questions, anything.\n'+
    'You can also see his CRM data below. When a question touches his leads, use it and name specific businesses. '+
    'Never invent leads, reviews, phone numbers or business facts that are not in the data. If something is not there, say so.\n'+
    'Be direct. Skip preamble and flattery. Use short paragraphs. Plain text only — no markdown headers or asterisks.\n\n'+
    'ABOUT HIM\n'+L.meBlock()+'\n\n'+crmSnapshot();
}
function sendChat(text){
  text=(text||'').trim(); if(!text) return;
  DB.chat.push({role:'user',content:text});
  state.chatBusy=true; state._chatForceBottom=true; L.save(); L.render();
  var hist=DB.chat.slice(-16).map(function(m){ return {role:m.role,content:m.content}; });
  if(window.LDAI&&window.LDAI.agent){
    /* the assistant works through the same tools everything else uses */
    window.LDAI.agent({
      system:window.LDAI.GROUND+'\nYou are their assistant inside the app. Answer directly and briefly. '+
        'When they ask you to change something — schedule a follow-up, add a task, log an expense, plan a post — '+
        'use the tool and then say in one line what you did. Never claim to have done something you did not do.',
      messages:hist,
      onDone:function(out,used){
        var note=used&&used.length?('\n\n— '+used.map(function(u){ return u.name; }).join(', ')+' —'):'';
        DB.chat.push({role:'assistant',content:(out||'Done.')+note});
        state.chatBusy=false; L.save(); L.render();
      },
      onErr:function(err){
        DB.chat.push({role:'assistant',content:'Could not answer.\n\n'+err});
        state.chatBusy=false; L.save(); L.render();
      },
      maxTok:1800
    });
    return;
  }
  L.callAIx(chatSys(),hist,function(out){
    DB.chat.push({role:'assistant',content:out});
    state.chatBusy=false; L.save(); L.render();
  },function(err){
    DB.chat.push({role:'assistant',content:'Could not answer.\n\n'+err});
    state.chatBusy=false; L.save(); L.render();
  },1800);
}

document.addEventListener('click',function(e){
  var a=e.target.closest('[data-ask],[data-copymsg],[data-copyp],[data-act="customreb"]');
  if(a){
    var d=a.dataset;
    if(d.ask!==undefined&&d.ask){ sendChat(d.ask); return; }
    if(d.copymsg!==undefined){
      var m=DB.chat[parseInt(d.copymsg,10)];
      if(m) L.copyText(m.content,'Copied'); return;
    }
    if(d.copyp){
      var el=d.copyp==='base44'?$('#pB44'):$('#pClaude');
      if(el) L.copyText(el.value,(d.copyp==='base44'?'Base44':'Claude')+' prompt copied');
      return;
    }
    if(d.act==='customreb'){ customRebuttal(); return; }
  }
  var t=e.target.closest('button'); if(!t||!t.id) return;
  var id=t.id;
  if(id==='runFinder'){ runFinder(); }
  else if(id==='copyFinder'){ var ft=$('#finderText'); L.copyText(ft?ft.value:DB.finder,'List copied'); }
  else if(id==='finderToLeads'){
    var ft2=$('#finderText'); if(ft2) DB.finder=ft2.value;
    var idx=DB.finder.indexOf('=== 3.');
    var chunk=idx>-1?DB.finder.slice(idx):DB.finder;
    var arr=parsePaste(chunk);
    if(!arr.length){ L.toast('No importable targets found in that list'); return; }
    arr.forEach(function(x){ x.source=x.source||'Other'; x.web='unknown'; x.book='unknown'; });
    DB.leads=arr.concat(DB.leads); L.save(); L.go('leads');
    L.toast('Added '+arr.length+' target'+(arr.length===1?'':'s')+' — verify each one');
  }
  else if(id==='runPrompts'){ runPrompts(); }

/* ============================================================
   NONMAJORITY — CLOUD SYNC (Phase 2 — Leads only)

   This module does not change how DB.leads works. It watches it.
   Every existing screen that reads DB.leads keeps doing exactly what it
   always did — this only affects what happens to a change AFTER it's
   already been made and saved locally, same as it always was.

   How a change gets to the cloud:
     save() runs (as it always has, from anywhere in the app)
       -> diffAndQueue() compares DB.leads against a "last synced" snapshot
       -> anything new/changed/removed gets queued
       -> flush() sends the queue to the Worker, one item at a time
       -> if a send fails (offline, etc.) it just stays queued and is
          retried the next time something saves, or the connection returns

   How a change gets FROM the cloud onto this device:
     pull() asks the Worker for this workspace's current leads and merges
     them in — except for any lead that still has a local change waiting
     to go out, which is left alone so a slow network never overwrites
     something you just typed.
   ============================================================ */
(function(){
"use strict";
var L=window.LD, DB=L.DB;

function cfg(){
  if(!DB.settings.cloud) DB.settings.cloud={apiUrl:'https://nonmajority-api.gregorybutler133.workers.dev',token:'',email:'',workspaceId:'',workspaces:[],pending:[],snapshot:{},lastSync:''};
  /* Phase 3: contacts get their own independent queue/snapshot, sharing
     the same connection. Backfilled here so an already-connected session
     (existing token/workspaceId/pending/snapshot for leads) is never
     touched — only the new fields are added if they're missing. */
  var c=DB.settings.cloud;
  if(!c.contactsPending) c.contactsPending=[];
  if(!c.contactsSnapshot) c.contactsSnapshot={};
  if(c.contactsLastSync===undefined) c.contactsLastSync='';
  /* Phase 4: same pattern again for tasks — own queue/snapshot, same
     backfill-only-if-missing safety for an already-connected session. */
  if(!c.tasksPending) c.tasksPending=[];
  if(!c.tasksSnapshot) c.tasksSnapshot={};
  if(c.tasksLastSync===undefined) c.tasksLastSync='';
  /* Phase 5: same pattern twice more — calendar events (DB.events, a flat
     global array today, not workspace-scoped even locally) and
     appointments (sp().appointments) each get their own independent
     queue/snapshot, backfilled the same safe way. */
  if(!c.calEventsPending) c.calEventsPending=[];
  if(!c.calEventsSnapshot) c.calEventsSnapshot={};
  if(c.calEventsLastSync===undefined) c.calEventsLastSync='';
  if(!c.apptsPending) c.apptsPending=[];
  if(!c.apptsSnapshot) c.apptsSnapshot={};
  if(c.apptsLastSync===undefined) c.apptsLastSync='';
  /* Phase 6 (Communications): same pattern four more times — conversations
     and templates are new local buckets (see NEW_BUCKETS below); messages
     is the existing sp().comms; follow-ups is a new bucket too. Each gets
     its own independent queue/snapshot, same safe backfill. */
  if(!c.conversationsPending) c.conversationsPending=[];
  if(!c.conversationsSnapshot) c.conversationsSnapshot={};
  if(c.conversationsLastSync===undefined) c.conversationsLastSync='';
  if(!c.messagesPending) c.messagesPending=[];
  if(!c.messagesSnapshot) c.messagesSnapshot={};
  if(c.messagesLastSync===undefined) c.messagesLastSync='';
  if(!c.templatesPending) c.templatesPending=[];
  if(!c.templatesSnapshot) c.templatesSnapshot={};
  if(c.templatesLastSync===undefined) c.templatesLastSync='';
  if(!c.followUpsPending) c.followUpsPending=[];
  if(!c.followUpsSnapshot) c.followUpsSnapshot={};
  if(c.followUpsLastSync===undefined) c.followUpsLastSync='';
  return c;
}

function ready(){
  var c=cfg();
  return !!(c.apiUrl&&c.token&&c.workspaceId);
}

function authedFetch(path,opts){
  opts=opts||{};
  var c=cfg();
  var headers={'Authorization':'Bearer '+c.token};
  var body;
  if(opts.body){ headers['Content-Type']='application/json'; body=JSON.stringify(opts.body); }
  return fetch(c.apiUrl.replace(/\/+$/,'')+path,{method:opts.method||'GET',headers:headers,body:body})
    .then(function(r){
      return r.text().then(function(t){
        var d=null; try{ d=JSON.parse(t); }catch(e){}
        if(!r.ok){ throw new Error((d&&d.error)||('Request failed ('+r.status+')')); }
        return d||{};
      });
    });
}

/* cheap structural hash — good enough to notice "this lead changed",
   not trying to be cryptographic */
function hashLead(l){
  var s=JSON.stringify(l);
  var h=5381;
  for(var i=0;i<s.length;i+=7) h=((h<<5)+h+s.charCodeAt(i))|0;
  return String(h)+':'+s.length;
}

function requestLink(email){
  var c=cfg();
  return fetch(c.apiUrl.replace(/\/+$/,'')+'/v1/auth/request-link',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})
  }).then(function(r){ return r.json(); });
}

function connectWithToken(token){
  var c=cfg();
  c.token=token; L.save();
  return authedFetch('/v1/auth/me').then(function(r){
    c.email=(r.user||{}).email||'';
    c.workspaces=r.workspaces||[];
    if(!c.workspaceId&&c.workspaces.length) c.workspaceId=c.workspaces[0].id;
    L.save();
    return r;
  }).catch(function(e){
    c.token=''; L.save();
    throw e;
  });
}

function disconnect(){
  var c=cfg();
  DB.settings.cloud={apiUrl:c.apiUrl,token:'',email:'',workspaceId:'',workspaces:[],pending:[],snapshot:{},lastSync:'',
    contactsPending:[],contactsSnapshot:{},contactsLastSync:'',
    tasksPending:[],tasksSnapshot:{},tasksLastSync:'',
    calEventsPending:[],calEventsSnapshot:{},calEventsLastSync:'',
    apptsPending:[],apptsSnapshot:{},apptsLastSync:'',
    conversationsPending:[],conversationsSnapshot:{},conversationsLastSync:'',
    messagesPending:[],messagesSnapshot:{},messagesLastSync:'',
    templatesPending:[],templatesSnapshot:{},templatesLastSync:'',
    followUpsPending:[],followUpsSnapshot:{},followUpsLastSync:''};
  L.save();
}

var flushing=false;
function flush(){
  if(flushing||!ready()) return Promise.resolve();
  var c=cfg();
  if(!c.pending.length) return Promise.resolve();
  flushing=true;
  var item=c.pending[0];
  var task;
  if(item.op==='delete'){
    task=authedFetch('/v1/leads/'+encodeURIComponent(item.id),{method:'DELETE'});
  } else {
    var payload=Object.assign({},item.payload,{workspace_id:c.workspaceId});
    task=authedFetch('/v1/leads/'+encodeURIComponent(item.id),{method:'PUT',body:payload})
      .catch(function(){
        /* PUT targets a row that may not exist yet server-side (first ever
           sync of a lead created before cloud was connected) — POST upserts */
        return authedFetch('/v1/leads',{method:'POST',body:payload});
      });
  }
  return task.then(function(){
    c.pending.shift();
    if(item.op==='delete') delete c.snapshot[item.id];
    else c.snapshot[item.id]=hashLead(item.payload);
    flushing=false;
    L.save();
    return flush();
  }).catch(function(){
    flushing=false; /* left in the queue, tried again on the next save or reconnect */
  });
}

function diffAndQueue(){
  if(!ready()) return;
  var c=cfg();
  var seen={};
  DB.leads.forEach(function(l){
    seen[l.id]=1;
    var h=hashLead(l);
    if(c.snapshot[l.id]!==h){
      c.pending=c.pending.filter(function(p){ return p.id!==l.id; });
      c.pending.push({op:'upsert',id:l.id,payload:l,ts:Date.now()});
    }
  });
  Object.keys(c.snapshot).forEach(function(id){
    if(!seen[id]){
      c.pending=c.pending.filter(function(p){ return p.id!==id; });
      c.pending.push({op:'delete',id:id,payload:null,ts:Date.now()});
    }
  });
  flush();
}

function pull(){
  if(!ready()) return Promise.resolve();
  var c=cfg();
  return authedFetch('/v1/leads?workspace_id='+encodeURIComponent(c.workspaceId)).then(function(r){
    var pendingIds={};
    c.pending.forEach(function(p){ pendingIds[p.id]=1; });
    (r.leads||[]).forEach(function(remote){
      if(pendingIds[remote.id]) return; /* an unsynced local edit wins for now */
      var idx=-1;
      for(var i=0;i<DB.leads.length;i++){ if(DB.leads[i].id===remote.id){ idx=i; break; } }
      if(idx>-1) DB.leads[idx]=remote; else DB.leads.unshift(remote);
      c.snapshot[remote.id]=hashLead(remote);
    });
    c.lastSync=new Date().toISOString().slice(0,16).replace('T',' ');
    L.save();
  });
}

   already, same as customers/tasks. All mutations already flow through
   runAction() -> L.save() via createAppointment/rescheduleAppointment/
   cancelAppointment/completeAppointment, so no changes were needed
   anywhere else for this to work.
   --------------------------------------------------------- */
function hashAppt(x){
  var s=JSON.stringify(x);
  var h=5381;
  for(var i=0;i<s.length;i+=7) h=((h<<5)+h+s.charCodeAt(i))|0;
  return String(h)+':'+s.length;
}

function apptsArr(){
  return (window.LDOS && window.LDOS.space) ? window.LDOS.space().appointments : [];
}

var flushingAppts=false;
function flushAppts(){
  if(flushingAppts||!ready()) return Promise.resolve();
  var c=cfg();
  if(!c.apptsPending.length) return Promise.resolve();
  flushingAppts=true;
  var item=c.apptsPending[0];
  var task;
  if(item.op==='delete'){
    task=authedFetch('/v1/appointments/'+encodeURIComponent(item.id),{method:'DELETE'});
  } else {
    var payload=Object.assign({},item.payload,{workspace_id:c.workspaceId});
    task=authedFetch('/v1/appointments/'+encodeURIComponent(item.id),{method:'PUT',body:payload})
      .catch(function(){
        return authedFetch('/v1/appointments',{method:'POST',body:payload});
      });
  }
  return task.then(function(){
    c.apptsPending.shift();
    if(item.op==='delete') delete c.apptsSnapshot[item.id];
    else c.apptsSnapshot[item.id]=hashAppt(item.payload);
    flushingAppts=false;
    L.save();
    return flushAppts();
  }).catch(function(){
    flushingAppts=false;
  });
}

function diffAndQueueAppts(){
  if(!ready()) return;
  var c=cfg();
  var seen={};
  apptsArr().forEach(function(x){
    seen[x.id]=1;
    var h=hashAppt(x);
    if(c.apptsSnapshot[x.id]!==h){
      c.apptsPending=c.apptsPending.filter(function(p){ return p.id!==x.id; });
      c.apptsPending.push({op:'upsert',id:x.id,payload:x,ts:Date.now()});
    }
  });
  Object.keys(c.apptsSnapshot).forEach(function(id){
    if(!seen[id]){
      c.apptsPending=c.apptsPending.filter(function(p){ return p.id!==id; });
      c.apptsPending.push({op:'delete',id:id,payload:null,ts:Date.now()});
    }
  });
  flushAppts();
}

function pullAppts(){
  if(!ready()) return Promise.resolve();
  var c=cfg();
  return authedFetch('/v1/appointments?workspace_id='+encodeURIComponent(c.workspaceId)).then(function(r){
    var pendingIds={};
    c.apptsPending.forEach(function(p){ pendingIds[p.id]=1; });
    var arr=apptsArr();
    (r.appointments||[]).forEach(function(remote){
      if(pendingIds[remote.id]) return;
      var idx=-1;
      for(var i=0;i<arr.length;i++){ if(arr[i].id===remote.id){ idx=i; break; } }
      if(idx>-1) arr[idx]=remote; else arr.unshift(remote);
      c.apptsSnapshot[remote.id]=hashAppt(remote);
    });
    c.apptsLastSync=new Date().toISOString().slice(0,16).replace('T',' ');
    L.save();
  });
}

window.addEventListener('online',function(){ flushAppts(); });

/* splash: 3D range + extruded wordmark. Stays until tapped. */
(function(){
  var sp=$('#splash'); if(!sp) return;
  var V=window.LDV, m=null;
  try{
    m=V.mountain($('#splashCv'),{nx:200,nz:128,pitch:0.55,dist:11.0,cy:0.90,vscale:2.15,
      parallax:true,drift:true});
    var cvEl=$('#splashCv'); if(cvEl) setTimeout(function(){ cvEl.classList.add('in'); },40);
    V.wordmark($('#splashWm'),'NONMAJORITY',20);
  }catch(e){}
  var done=false;
  function close(){
    if(done) return; done=true;
    sp.classList.add('gone');
    setTimeout(function(){
      if(m) m.stop();
      if(sp.parentNode) sp.parentNode.removeChild(sp);
      if(L.revealScan) L.revealScan();
    },800);
  }
  sp.addEventListener('click',close);
  sp.addEventListener('touchend',close);
  document.addEventListener('keydown',function k(e){
    if(done) return;
    if(e.key==='Enter'||e.key===' '||e.key==='Escape'){ close(); document.removeEventListener('keydown',k); }
  });
  window.LD.replaySplash=function(){};
})();

(function(){
"use strict";
var L=window.LD, OS=window.LDOS, AI=window.LDAI, DB=L.DB,
    state=L.state, $=L.$, $$=L.$$, esc=L.esc;

function modal(h){ L.modal(h); }

function reRender(){ L.render(); }

/* ---------- generic AI runner ---------- */
function run(flag,fn,label,after){
  if(!(window.LDNET&&LDNET.mode()!=='none')){ L.toast('Connect the AI in Settings first'); return; }
  state[flag]=label||'Working…'; reRender();
  fn(function(text,used){
    state[flag]=false;
    if(after) after(text,used);
    reRender();
    if(used&&used.length) L.toast('AI took '+used.length+' action'+(used.length===1?'':'s'));
  },function(err){
    state[flag]=false; reRender(); L.toast(err.slice(0,90));
  });
}

/* ---------- ask helpers ---------- */
function askForm(title,lede,fields,onOk,okLabel){
  modal('<h3>'+esc(title)+'</h3>'+(lede?'<p class="lede">'+esc(lede)+'</p>':'')+
    '<div class="grid2">'+fields.map(function(f){
      if(f.type==='select') return '<label class="field"><span>'+esc(f.label)+'</span><select data-af="'+f.k+'">'+
        L.opts(f.options,f.value||'')+'</select></label>';
      if(f.type==='area') return '<label class="field" style="grid-column:1/-1"><span>'+esc(f.label)+'</span>'+
        '<textarea data-af="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(f.value||'')+'</textarea></label>';
      return '<label class="field"><span>'+esc(f.label)+'</span><input data-af="'+f.k+'" type="'+(f.t||'text')+'" '+
        (f.t==='number'?'inputmode="decimal" ':'')+'value="'+esc(f.value||'')+'" placeholder="'+esc(f.ph||'')+'"></label>';
    }).join('')+'</div>'+
    '<div class="foot"><button class="btn" data-close>Cancel</button>'+
    '<button class="btn pri" id="afOk">'+esc(okLabel||'Save')+'</button></div>');
  $('#afOk').onclick=function(){
    var o={};
    $$('[data-af]').forEach(function(el){ o[el.dataset.af]=el.value.trim(); });
    onOk(o); 
  };
}

    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=520, sc=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res({thumb:c.toDataURL('image/jpeg',0.72),w:img.width,h:img.height,seconds:0});
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res({thumb:'',w:0,h:0,seconds:0}); };
    img.src=url;
  });
}
function thumbFromVideo(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file), v=document.createElement('video');
    var done=false;
    function give(o){ if(done) return; done=true; try{ URL.revokeObjectURL(url); }catch(e){} res(o); }
    v.preload='metadata'; v.muted=true; v.playsInline=true;
    v.onloadeddata=function(){
      try{ v.currentTime=Math.min(1,(v.duration||2)/3); }catch(e){ grab(); }
    };
    v.onseeked=grab;
    v.onerror=function(){ give({thumb:'',w:0,h:0,seconds:0}); };
    setTimeout(function(){ if(!done) grab(); },6000);
    function grab(){
      try{
        var max=520, w=v.videoWidth||480, hgt=v.videoHeight||480;
        var sc=Math.min(1,max/Math.max(w,hgt));
        var c=document.createElement('canvas');
        c.width=Math.round(w*sc)||320; c.height=Math.round(hgt*sc)||320;
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        give({thumb:c.toDataURL('image/jpeg',0.72),w:w,h:hgt,seconds:Math.round(v.duration||0)});
      }catch(e){ give({thumb:'',w:0,h:0,seconds:Math.round(v.duration||0)}); }
    }
    v.src=url;
  });
}
function uploadAssets(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*,image/*'; inp.multiple=true;
  inp.onchange=function(){
    var files=Array.prototype.slice.call(inp.files||[]);
    if(!files.length) return;
    state.vaultBusy='Saving '+files.length+' file'+(files.length===1?'':'s')+' to this device…';
    reRender();
    var i=0, made=[];
    next();
    function next(){
      if(i>=files.length){
        state.vaultBusy=false; L.save(); reRender();
        L.toast('Added '+made.length+' file'+(made.length===1?'':'s'));
        if(window.LDNET&&LDNET.mode()!=='none'){
          made.forEach(function(a){ OS.fire('content.uploaded',{asset:a}); });
        }
        return;
      }
      var f=files[i++];
      var isVid=/^video\//.test(f.type);
      (isVid?thumbFromVideo(f):thumbFromImage(f)).then(function(meta){
        var a={id:OS.uid('as'),name:f.name.replace(/\.[^.]+$/,''),kind:isVid?'video':'photo',
          mime:f.type,size:f.size,seconds:meta.seconds,w:meta.w,h:meta.h,thumb:meta.thumb,
          status:'New',tags:[],category:'',description:'',topic:'',platforms:[],quality:0,
          created:L.today()};
        sp().assets.unshift(a); made.push(a);
        OS.putFile(a.id,f).then(function(){ next(); }).catch(function(){
          a.noFile=true; next();
        });
      });
    }
  };
  inp.click();
}

  }catch(e){
    return {id:id,label:label,state:'fail',detail:'Check failed: '+(e.message||e),fix:fix||null};
  }
}

  out.push(check('industry','Industry pack',function(){
    var ind=mem.profile.industry;
    if(!ind) return {state:'warn',detail:'No industry set, so the generic pack is in use.',fix:'aiops'};
    var p=PACKS[ind];
    return {state:'ok',detail:ind+(p?' · '+p.pipeline.length+' pipeline stages, books by '+p.bookingModel:' · generic pack')};
  }));

  out.push(check('leads','Lead capture',function(){
    var n=DB.leads.length;
    if(!n) return {state:'fail',detail:'No leads yet.',fix:'leads'};
    var recent=DB.leads.filter(function(l){ return l.created&&L.daysBetween(l.created,td)<=30; }).length;
    if(!recent) return {state:'warn',detail:n+' leads, none added in 30 days.',fix:'leads'};
    return {state:'ok',detail:n+' leads, '+recent+' in the last 30 days.'};
  }));

  out.push(check('scoring','Lead scoring',function(){
    if(!DB.leads.length) return {state:'warn',detail:'Nothing to score yet.'};
    var r=L.scoreLead(DB.leads[0]);
    if(typeof r.score!=='number') return {state:'fail',detail:'Scoring returned nothing.'};
    var unchecked=DB.leads.filter(function(l){ return l.web==='unknown'||l.book==='unknown'; }).length;
    if(unchecked) return {state:'warn',detail:'Working, but '+unchecked+' lead'+(unchecked===1?' has':'s have')+' unverified website or booking status, so they score low.',fix:'leads'};
    return {state:'ok',detail:'Working. Top lead scores '+r.score+'/100.'};
  }));

  out.push(check('followup','Follow-up',function(){
    var live=DB.leads.filter(function(l){ return l.stage!=='Won'&&l.stage!=='Lost'; });
    if(!live.length) return {state:'warn',detail:'No live leads to follow up.'};
    var dated=live.filter(function(l){ return l.nextFollow; }).length;
    var overdue=live.filter(function(l){ return l.nextFollow&&l.nextFollow<td; }).length;
    if(!dated) return {state:'fail',detail:'Not one live lead has a follow-up date. This is where deals die.',fix:'follow'};
    if(overdue) return {state:'warn',detail:overdue+' follow-up'+(overdue===1?' is':'s are')+' overdue.',fix:'follow'};
    return {state:'ok',detail:dated+' of '+live.length+' live leads have a next date.'};
  }));

  out.push(check('booking','Booking and calendar',function(){
    var a=s.appointments.length, up=s.appointments.filter(function(x){ return x.date>=td&&x.status==='booked'; }).length;
    if(!a) return {state:'warn',detail:'No appointments booked yet.',fix:'cal'};
    var missed=s.appointments.filter(function(x){ return x.status==='missed'; }).length;
    if(missed) return {state:'warn',detail:a+' appointments, '+up+' upcoming, '+missed+' no-show'+(missed===1?'':'s')+'.',fix:'cal'};
    return {state:'ok',detail:a+' appointments, '+up+' upcoming.'};
  }));

  out.push(check('customers','Customers',function(){
    var c=s.customers.length;
    if(!c) return {state:'warn',detail:'No customers yet. Won leads should convert.',fix:'clients'};
    var active=s.customers.filter(function(x){ return x.status==='active'; }).length;
    return {state:'ok',detail:c+' customers, '+active+' active.'};
  }));

  out.push(check('revenue','Revenue tracking',function(){
    var p=s.payments.length;
    if(!p) return {state:'warn',detail:'No payments recorded, so revenue reporting is empty.',fix:'money'};
    var rev=BIZ.revenue();
    return {state:'ok',detail:L.money(rev.total)+' recorded across '+p+' payment'+(p===1?'':'s')+'.'};
  }));

  out.push(check('invoices','Invoices',function(){
    var open=s.invoices.filter(function(i){ return i.status==='open'||i.status==='partial'; });
    var overdue=open.filter(function(i){ return i.dueDate<td; });
    if(!s.invoices.length) return {state:'warn',detail:'None raised yet.',fix:'money'};
    if(overdue.length) return {state:'fail',detail:overdue.length+' overdue, '+
      L.money(overdue.reduce(function(a,i){ return a+(n2(i.total)-n2(i.paid)); },0))+' outstanding.',fix:'money'};
    return {state:'ok',detail:s.invoices.length+' raised, '+open.length+' still open.'};
  }));

  out.push(check('reviews','Reviews',function(){
    var st=BIZ.reviewStats?BIZ.reviewStats():null;
    if(!st||!st.requested) return {state:'warn',detail:'No review requests yet. This is the cheapest growth lever you have.',fix:'clients'};
    if(st.lowStar) return {state:'warn',detail:st.received+' received, average '+st.avg+'★, '+st.lowStar+' low.',fix:'clients'};
    return {state:'ok',detail:st.received+' of '+st.requested+' requests came back, average '+st.avg+'★.'};
  }));

  out.push(check('content','Content vault',function(){
    var a=s.assets.length;
    if(!a) return {state:'warn',detail:'Empty. Nothing to post and nothing for the AI to plan with.',fix:'content'};
    var newOnes=s.assets.filter(function(x){ return x.status==='New'; }).length;
    if(newOnes) return {state:'warn',detail:a+' assets, '+newOnes+' not analysed yet.',fix:'content'};
    return {state:'ok',detail:a+' assets, all analysed.'};
  }));

  out.push(check('social','Social analytics',function(){
    if(!s.metrics.length) return {state:'warn',detail:'No numbers entered. No platform is connected by API — this is screenshot-fed by design.',fix:'content'};
    var plats=Object.keys(s.metrics.reduce(function(a,m){ a[m.platform]=1; return a; },{}));
    return {state:'ok',detail:s.metrics.length+' records across '+plats.join(', ')+'.'};
  }));

  out.push(check('automations','Automations',function(){
    var on=s.automations.filter(function(a){ return a.enabled; });
    var ran=s.automations.reduce(function(a,x){ return a+n2(x.runs); },0);
    if(!on.length) return {state:'fail',detail:'All automations are off. Nothing runs on its own.',fix:'aiops'};
    if(!ran) return {state:'warn',detail:on.length+' enabled but none has fired yet.',fix:'aiops'};
    return {state:'ok',detail:on.length+' enabled, '+ran+' runs so far.'};
  }));

  out.push(check('permissions','AI permissions',function(){
    var gated=Object.keys(OS.ACTIONS).filter(function(k){ return !OS.allowed(OS.ACTIONS[k].scope,k); });
    if(!gated.length) return {state:'fail',detail:'Nothing requires your approval. Consequential actions should always stop.',fix:'aiops'};
    return {state:'ok',detail:gated.length+' consequential actions always ask you first.'};
  }));

  out.push(check('isolation','Data isolation',function(){
    var orgs=DB.orgs.length;
    if(orgs<2) return {state:'ok',detail:'One business. Isolation untested but nothing to leak.'};
    /* prove it rather than assert it */
    var mine=sp(), leak=0;
    DB.orgs.forEach(function(o){
      if(o.id===DB.activeOrg) return;
      var other=DB.spaces[o.id]||{};
      (other.leads||[]).forEach(function(l){
        if((mine.leads||DB.leads).some(function(x){ return x.id===l.id; })) leak++;
      });
      (other.customers||[]).forEach(function(c){
        if((mine.customers||[]).some(function(x){ return x.id===c.id; })) leak++;
      });
    });
    if(leak) return {state:'fail',detail:leak+' record'+(leak===1?'':'s')+' appear in more than one business.'};
    return {state:'ok',detail:orgs+' businesses, no shared records found.'};
  }));

  out.push(check('audit','AI activity log',function(){
    if(!s.aiLog.length) return {state:'warn',detail:'Nothing logged yet.',fix:'aiops'};
    var fails=s.aiLog.filter(function(x){ return !x.ok; }).length;
    if(fails>s.aiLog.length*0.25) return {state:'warn',detail:fails+' of '+s.aiLog.length+' recent actions failed.',fix:'aiops'};
    return {state:'ok',detail:s.aiLog.length+' actions logged, '+fails+' failed.'};
  }));

  out.push(check('backup','Backup',function(){
    if(!N||!N.gatewayReady()) return {state:'warn',detail:'No cloud backup. If this browser clears its data, everything goes.',fix:'set'};
    var last=DB.settings.lastBackup;
    if(!last) return {state:'warn',detail:'Gateway is connected but nothing has been backed up yet.',fix:'set'};
    var days=L.daysBetween(String(last).slice(0,10),td);
    if(days>7) return {state:'warn',detail:'Last backup was '+days+' days ago.',fix:'set'};
    return {state:'ok',detail:'Last backup '+L.fmtDate(String(last).slice(0,10))+'.'};
  }));

  out.push(check('storage','Device storage',function(){
    if(!L.HAS_LS) return {state:'fail',detail:'This browser is blocking storage. Nothing will persist.',fix:'set'};
    var size=0;
    try{ size=JSON.stringify(DB).length; }catch(e){}
    var mb=(size/1048576);
    if(mb>4) return {state:'fail',detail:mb.toFixed(1)+' MB used of roughly 5 MB. Export and prune soon.',fix:'set'};
    if(mb>2.5) return {state:'warn',detail:mb.toFixed(1)+' MB used of roughly 5 MB.',fix:'set'};
    return {state:'ok',detail:mb.toFixed(2)+' MB used.'};
  }));

  var score=Math.round(out.filter(function(c){ return c.state==='ok'; }).length/out.length*100);
  return {checks:out,score:score,
    ok:out.filter(function(c){ return c.state==='ok'; }).length,
    warn:out.filter(function(c){ return c.state==='warn'; }).length,
    fail:out.filter(function(c){ return c.state==='fail'; }).length};
}

function fill(name,vars){
  var t=PROMPTS[name];
  if(!t) return '';
  return t.replace(/\{\{([A-Z_]+)\}\}/g,function(m,k){
    var v=vars[k];
    return (v==null||v==='')?('['+k.toLowerCase().replace(/_/g,' ')+' not supplied]'):String(v);
  });
}

   One specification in → a configured business out.
   Deterministic core, so it works with or without the AI.
   ============================================================ */
function generateBusiness(spec,opts){
  opts=opts||{};
  var pack=packFor(spec.industry);
  var id=OS.addOrg(spec.name,spec.industry);
  var s=OS.space(), m=s.memory;

  m.profile.name=spec.name||'';
  m.profile.industry=spec.industry||'';
  m.profile.city=spec.area||'';
  m.profile.services=spec.services||(pack.services||[]).join(', ');
  m.profile.products=spec.products||'';
  m.profile.customers=spec.customer||'';
  m.profile.goals=spec.goals||'';
  m.profile.founded=spec.founded||'';
  m.prefs.tone=spec.brandVoice||'Direct and friendly. Short sentences.';
  m.prefs.postPlatforms=spec.platforms||'Instagram, TikTok, Facebook';
  m.prefs.autoLevel=spec.autoLevel||'high';
  m.knowledge.pricing=spec.pricing||'';
  m.knowledge.differentiators=spec.differentiators||'';

  /* pipeline, automations and KPIs come from the industry pack */
  s.config={
    pipeline:(pack.pipeline||L.STAGES).slice(),
    bookingModel:pack.bookingModel||'appointment',
    bookingWord:pack.bookingWord||'appointment',
    customerWord:pack.customerWord||'customer',
    jobWord:pack.jobWord||'job',
    services:(pack.services||[]).slice(),
    kpis:(pack.kpis||[]).slice(),
    reviewAsk:pack.reviewAsk||'on job completion',
    reviewPlatform:pack.reviewPlatform||'Google',
    leadFields:(pack.leadFields||[]).slice(),
    contentCategories:(pack.content||[]).slice(),
    generatedAt:new Date().toISOString(),
    generatedBy:'factory'
  };
  s.automations=OS.defaultAutomations();
  s.memory=m;
  L.save();

  return {orgId:id,config:s.config,profile:m.profile};
}

/* the AI enrichment pass is optional — the config is already valid without it */
function enrichBusiness(onDone,onErr){
  if(!(window.LDNET&&LDNET.mode()!=='none')) return onErr('AI is not connected.');
  var v=varsFromBusiness();
  var sys='You configure a Business Operating System. Return ONLY JSON, no prose, no code fences. '+
    'Use only what the specification gives you. Never invent prices, staff, history or results.';
  var prompt=fill('BUSINESS_OS_GENERATOR',v)+'\n\nSchema:\n'+
    '{"pipeline":["stage names in order"],"leadFields":["extra CRM fields worth capturing"],'+
    '"kpis":["3 KPIs"],"contentCategories":["5 content types"],"reviewAsk":"when to ask",'+
    '"followUps":[{"trigger":"when","channel":"sms|email","angle":"what to say"}],'+
    '"improvementRules":[{"area":"sales|marketing|content|finance|retention","flagWhen":"condition"}]}';
  window.LDNET.chat({task:'reason',feature:'os_factory',system:sys,
    messages:[{role:'user',content:prompt}],maxTokens:1600})
  .then(function(r){
    var j=AI.firstJSON(r.text);
    if(!j) throw new Error('Could not read the configuration back.');
    var s=sp();
    s.config=s.config||{};
    ['pipeline','leadFields','kpis','contentCategories','reviewAsk'].forEach(function(k){
      if(j[k]) s.config[k]=j[k];
    });
    if(j.followUps) s.config.followUps=j.followUps;
    if(j.improvementRules) s.config.improvementRules=j.improvementRules;
    s.config.enrichedAt=new Date().toISOString();
    L.save();
    onDone(s.config);
  })
  .catch(function(e){ onErr(String(e.message||e)); });
}

  return L.STAGES;
}

          '<span class="okdot '+dot+'" style="'+(c.state==='warn'?'background:var(--acc-amber)':'')+'"></span>'+
          '<b style="color:var(--ink);font-size:14px">'+esc(c.label)+'</b>'+

        '</div>'+
        '<p style="margin-top:4px">'+esc(c.detail)+'</p></div>';
    }).join('')+'</div>';
  }

     data-layer attribute (for CSS targeting, set a few lines up), and a
     bare [data-layer] selector matches that too, on every click anywhere
     on the page — this used to fire a full re-render and a toast on
     every single tap in the entire app. button[data-layer] can only
     ever match the two toggle chips this was written for. */
  var el=e.target.closest('button[data-layer],[data-prompt]');

function goto(sectionId,pageId){
  var sec=sectionById(sectionId)||SECTIONS[0];
  if(sec.admin&&!adminVisible()) sec=SECTIONS[0];
  var pg=pageById(sec,pageId);
  state.section=sec.id; state.page=pg.id;
  if(pg.filter) state.filters=JSON.parse(JSON.stringify(pg.filter));
  if(pg.seg){ state.seg=state.seg||{}; state.seg[pg.seg[0]]=pg.seg[1]; }
  state.view=pg.view||'command';
  render();
}
/* legacy calls keep working */
L.go=function(v){
  if(HOME[v]){ goto(HOME[v][0],HOME[v][1]); return; }
  origGo(v);
};
L.goto=goto;

function currentPage(){
  var sec=sectionById(state.section)||SECTIONS[0];
  return {sec:sec,pg:pageById(sec,state.page)};
}

function render(){
  var cur=currentPage(), sec=cur.sec, pg=cur.pg;
  state.view=pg.view||'command';
  origRender();
  var box=$('#view'); if(!box) return;

  if(pg.custom&&CUSTOM[pg.custom]){
    box.innerHTML=CUSTOM[pg.custom]();
  } else {
    /* the view drew its own segment bar; sub-navigation replaces it -
       but only actually touch the DOM if there is one to strip. Any
       innerHTML assignment destroys and recreates every child node
       even when the replaced string is identical, which was silently
       undoing scroll/focus state restored a moment ago in origRender(). */
    var _cur=box.innerHTML;
    var _next=_cur.replace(
      /<div class="wrap"><div style="height:14px"><\/div><div class="seg">[\s\S]*?<\/div><\/div>/,'');
    if(_next!==_cur) box.innerHTML=_next;
  }
  box.insertAdjacentHTML('afterbegin',header(sec,pg));
  buildNav();
  document.documentElement.setAttribute('data-sec',sec.id);
  if(L.revealScan) L.revealScan();
}

(function(){
"use strict";
var L=window.LD, OS=window.LDOS, IA=window.LDIA, AI=window.LDAI, DB=L.DB,
    state=L.state, $=L.$, $$=L.$$, esc=L.esc;

/* ============================================================
   1. GLOBAL SEARCH — across every record type
   ============================================================ */
function search(q){
  q=String(q||'').trim().toLowerCase();
  if(q.length<2) return [];
  var s=sp(), groups=[];

  add('Leads',DB.leads,function(l){
    return [l.business,l.owner,l.city,l.phone,l.email,l.industry].join(' ');
  },function(l){
    return {label:l.business||'Untitled lead',
      sub:[l.industry,l.city,L.scoreLead(l).score+'/100'].filter(Boolean).join(' · '),
      open:l.id};
  });

  add('Customers',s.customers,function(c){
    return [c.name,c.phone,c.email,c.city,c.service].join(' ');
  },function(c){
    return {label:c.name,sub:[c.service,c.city,c.lifetimeValue?L.money(c.lifetimeValue):''].filter(Boolean).join(' · '),
      goto:'crm.customers'};
  });

  add('Tasks',s.tasks,function(t){ return [t.title,t.notes,t.kind].join(' '); },
    function(t){ return {label:t.title,sub:(t.done?'done':'due '+L.fmtDate(t.due)),goto:'schedule.tasks'}; });

  add('Appointments',s.appointments,function(a){ return [a.title,a.service,a.address].join(' '); },
    function(a){ return {label:a.title,sub:L.fmtDate(a.date)+' at '+a.time+' · '+a.status,goto:'schedule.appointments'}; });

  add('Expenses',s.expenses,function(x){ return [x.vendor,x.category,x.purpose].join(' '); },
    function(x){ return {label:x.vendor,sub:L.money(x.amount)+' · '+x.category+' · '+L.fmtDate(x.date),goto:'money.expenses'}; });

  add('Content',s.assets,function(a){
    return [a.name,a.category,a.topic,a.description,(a.tags||[]).join(' ')].join(' ');
  },function(a){ return {label:a.name,sub:[a.kind,a.category,a.status].filter(Boolean).join(' · '),goto:'content.vault'}; });

  add('Insights',s.insights,function(i){ return [i.title,i.evidence,i.action].join(' '); },
    function(i){ return {label:i.title,sub:i.kind+' · '+i.priority,goto:'bi.improve'}; });

  add('Invoices',s.invoices,function(i){ return [i.number,i.service].join(' '); },
    function(i){ return {label:(i.number||'Invoice')+' · '+L.money(i.total),sub:i.status+' · due '+L.fmtDate(i.dueDate),goto:'money.revenue'}; });

  add('Reviews',s.reviews,function(r){ return [r.customerName,r.text,r.platform].join(' '); },
    function(r){ return {label:(r.customerName||'Review')+(r.rating?' · '+r.rating+'★':''),sub:r.status+(r.platform?' · '+r.platform:''),goto:'crm.customers'}; });

  return groups;

  function add(name,list,hay,fmt){
    if(!list||!list.length) return;
    var hits=list.filter(function(x){ return String(hay(x)||'').toLowerCase().indexOf(q)>-1; }).slice(0,6);
    if(hits.length) groups.push({name:name,items:hits.map(fmt)});
  }
}

var paletteOpen=false;

    '<div id="palResults" class="palres"></div>'+

function renderPalette(q){
  var out=$('#palResults'); if(!out) return;
  q=String(q||'');
  var cmds=COMMANDS.filter(function(c){
    return !q||c.label.toLowerCase().indexOf(q.toLowerCase())>-1;
  }).slice(0,q?6:8);
  var groups=search(q);
  var h='';
  if(cmds.length){

  groups.forEach(function(g){
    h+='<div class="palgroup"><b>'+esc(g.name)+'</b>'+g.items.map(function(it){

    }).join('')+'</div>';
  });
  if(!h) h='<div class="palempty">'+(q.length<2?'Type at least two characters.':'Nothing found.')+'</div>';

function runCommand(label){
  var c=null;
  for(var i=0;i<COMMANDS.length;i++) if(COMMANDS[i].label===label) c=COMMANDS[i];
  if(!c) return;
  L.closeModal(); paletteOpen=false;
  if(c.act){
    if(c.act==='addLead'){ L.editForm(null); return; }
    if(c.act==='addTask'){ IA.goto('schedule','tasks'); setTimeout(function(){ var b=$('#addTask'); if(b) b.click(); },250); return; }
    if(c.act==='addExpense'){ IA.goto('money','expenses'); setTimeout(function(){ var b=$('#addExp'); if(b) b.click(); },250); return; }
  }
  if(c.go){
    var p=c.go.split('.');
    IA.goto(p[0],p[1]);
    if(c.run) setTimeout(function(){ fireRun(c.run); },300);
  }

function maskSecret(v){

function scrubForAI(text){

    .replace(/sk-[A-Za-z0-9_\-]{12,}/g,'[key redacted]')
    .replace(/Bearer\s+[A-Za-z0-9._\-]{12,}/g,'[token redacted]');
}

  ['leads','customers','appointments','invoices','payments','reviews','comms','jobs','tasks','events',

   'briefs','weeklyReviews','chat'].forEach(function(k){ if(Array.isArray(fresh[k])) fresh[k].length=0; });

/* ============================================================
   5. PRIVACY CHECK — scans what is actually on screen
   ============================================================ */
function realValues(){
  var p=P(), vals=[];
  function add(v){ v=String(v||'').trim(); if(v.length>3) vals.push(v); }
  var me=p.realMe||DB.settings.me||{};
  add(me.name); add(me.company); add(me.phone); add(me.email); add(me.site);
  DB.orgs.forEach(function(o){ if(o.id!==p.demoOrg) add(o.name); });
  /* names of records in every non-demo workspace */
  Object.keys(DB.spaces||{}).forEach(function(id){
    if(id===p.demoOrg) return;
    var s=DB.spaces[id]||{};
    (s.leads||[]).slice(0,60).forEach(function(l){ add(l.business); add(l.owner); add(l.phone); add(l.email); });
    (s.customers||[]).slice(0,60).forEach(function(c){ add(c.name); add(c.phone); add(c.email); });
    (s.expenses||[]).slice(0,60).forEach(function(e){ add(e.vendor); });
  });
  return vals.filter(function(v,i,a){ return a.indexOf(v)===i; });
}

function privacyCheck(){
  var issues=[], checked=[];
  var body=document.body?document.body.innerText||'':'';

  if(!isOn()){
    issues.push({where:'Mode',what:'Demo Mode is off, so real data is on screen.',fix:'Turn on Demo Mode before you share your screen.'});
  }
  checked.push('Current screen');

  if(isOn()){
    var leaks=realValues().filter(function(v){ return body.indexOf(v)>-1; });
    if(leaks.length) issues.push({where:'Screen',what:leaks.length+' real value'+(leaks.length===1?'':'s')+' visible on this page.',fix:'Report this — the privacy layer missed something.'});
  }

  /* credentials must never be rendered in full */
  var secretVals=[DB.settings.key,(DB.settings.gw||{}).code].filter(Boolean);
  var shown=secretVals.filter(function(v){ return v.length>8&&body.indexOf(v)>-1; });
  if(shown.length) issues.push({where:'Credentials',what:'A key or access code is rendered in full.',fix:'Open Settings and re-save so it masks.'});
  checked.push('Credentials');

  /* inputs still hold real values? */
  var pw=$$('input[type="password"]').filter(function(i){ return i.value&&i.value.length>8; });
  if(pw.length&&isOn()) issues.push({where:'Forms',what:'A credential field holds a value on this page.',fix:'Avoid opening AI Connection while presenting.'});
  checked.push('Forms');

  if(isOn()&&DB.activeOrg!==P().demoOrg){
    issues.push({where:'Workspace',what:'Demo Mode is on but a real business is active.',fix:'Toggle Demo Mode off and on again.'});
  }
  checked.push('Active workspace');

  /* search must not reach real records */
  if(isOn()&&window.LDS){
    var probe=realValues().slice(0,6);
    var hit=probe.filter(function(v){
      var r=LDS.search(v.slice(0,10));
      return r&&r.length;
    });
    if(hit.length) issues.push({where:'Global search',what:'Search returned results for a real value.',fix:'Report this — search is not scoped to the demo workspace.'});
  }
  checked.push('Global search');

  if(isOn()){
    var blocked=Object.keys(EXTERNAL).length;
    checked.push(blocked+' external actions blocked');
  }
  checked.push('AI context');

  logPrivacy('privacy_check',issues.length?('issues:'+issues.length):'clean');
  return {safe:issues.length===0&&isOn(),issues:issues,checked:checked};
}

    h+='<div class="card"><b style="font-size:16px">Privacy activity</b>'+
      '<p class="hint">No values are recorded here, only what happened.</p>'+
      '<div class="notes" style="margin-top:10px">'+p.log.slice(0,20).map(function(e){

          external_action_blocked:'External action blocked'}[e.what]||e.what;
